<title>authSlice.ts — user Alanının Eklenmesi</title>
<link rel="stylesheet" href="../engine/slides.css" />
</head>
<body>
<div id="app"></div>
<script>
  window.MODULE = {
    id: 'authslice-guncelleme',
    bolumBaslik: 'B-02 — Auth Sayfaları',
    oncekiBolum: '01_tipler-ve-rtk-query.html',
    sonrakiBolum: '03_loginpage.html',
    slaytlar: [
      {
        tur: 'kapak',
        ustBaslik: 'BÖLÜM 2',
        baslik: 'authSlice.ts — user Alanının Eklenmesi',
        altBaslik: 'B-01\'de authSlice yalnızca accessToken/isAuthenticated tutuyordu ("user nesnesi B-02\'de eklenir" notuyla bilerek eksik bırakılmıştı) — bu bölüm o notu kapatıyor.'
      },
      {
        tur: 'kod-degisiklik',
        baslik: 'authSlice.ts — setCredentials Artık user de Alıyor',
        dosyaYolu: 'admin/src/store/slices/authSlice.ts',
        neden: 'Bölüm 1\'deki `verifyOtp` mutation\'ı backend\'den bir `AdminUser` nesnesi (id/currentLevel/themePreference/languagePreference) döndürüyor — B-01\'in `authSlice`\'ı bu veriyi TUTACAK bir alana sahip DEĞİLDİ, yalnızca token vardı. Bu bilgi hiçbir yere yazılmasaydı, verifyOtp\'nin yanıtı ALINIR ama ATILIRDI.',
        diff: ` import { createSlice, type PayloadAction } from '@reduxjs/toolkit'
+import type { AdminUser } from '../../types/auth.types'

 interface AuthState {
   accessToken: string | null
+  user: AdminUser | null
   isAuthenticated: boolean
 }

+// user, accessToken ile AYNI anda localStorage'a yazılır/okunur — ikisi birbirinden bağımsız
+// kalırsa (ör. yalnızca token persist edilse) sayfa yenilendiğinde isAuthenticated=true ama
+// user=null gibi tutarsız bir durum ortaya çıkardı.
+function readStoredUser(): AdminUser | null {
+  const raw = localStorage.getItem('authUser')
+  if (!raw) return null
+  try {
+    return JSON.parse(raw) as AdminUser
+  } catch {
+    // Bozuk/elle değiştirilmiş bir değer modül yüklenirken (React mount OLMADAN ÖNCE) burayı
+    // çökertip TÜM uygulamayı beyaz ekranda bırakabilirdi — kendi kendini onarır.
+    localStorage.removeItem('authUser')
+    return null
+  }
+}
+
 const initialState: AuthState = {
   accessToken: localStorage.getItem('accessToken'),
+  user: readStoredUser(),
   isAuthenticated: localStorage.getItem('accessToken') !== null,
 }

 const authSlice = createSlice({
   name: 'auth',
   initialState,
   reducers: {
-    setCredentials: (state, action: PayloadAction<{ accessToken: string }>) => {
+    setCredentials: (state, action: PayloadAction<{ accessToken: string; user: AdminUser }>) => {
       state.accessToken = action.payload.accessToken
+      state.user = action.payload.user
       state.isAuthenticated = true
       localStorage.setItem('accessToken', action.payload.accessToken)
+      localStorage.setItem('authUser', JSON.stringify(action.payload.user))
     },
     logout: (state) => {
       state.accessToken = null
+      state.user = null
       state.isAuthenticated = false
       localStorage.removeItem('accessToken')
+      localStorage.removeItem('authUser')
     },
   },
 })`,
        satirlar: [
          {
            satir: 'user: AdminUser | null',
            aciklama: '`AuthState`\'e YENİ bir alan — `accessToken` gibi `| null` (F5\'te henüz OKUNMAMIŞ ya da hiç GİRİŞ yapılmamış durumda `null`).',
            neden: 'ProtectedRoute (B-01) yalnızca `isAuthenticated`\'a bakıyor, `user`\'a DEĞİL — ama gelecekte (B-05\'ten itibaren) "işlemi yapan admin kimdi" gibi bir bilgi gerektiğinde, bu alan HAZIR olacak.',
            olmasaydi: 'Bu alan eklenmeseydi, `verifyOtp`\'nin döndürdüğü `user` nesnesi (Bölüm 1\'deki `VerifyOtpResponse.user`) OtpVerifyPage\'de ALINIR ama HİÇBİR yere YAZILAMAZDI — TypeScript, olmayan bir state alanına `state.user = ...` yazmaya izin VERMEZDİ.'
          },
          {
            satir: 'function readStoredUser(): AdminUser | null {',
            aciklama: '`accessToken`\'ın `localStorage.getItem(\'accessToken\')` ile okunmasıyla AYNI mantık — ama `user` bir NESNE olduğu için `localStorage` (yalnızca STRING saklar) önce `JSON.stringify` ile yazılıp `JSON.parse` ile GERİ okunmalı.',
            neden: 'Bu okuma bir FONKSİYONA çıkarıldı (satır içi yazılmadı) çünkü `JSON.parse` çağrısı `initialState` tanımının İÇİNE gömülseydi, o tek satır "localStorage oku + null kontrolü + JSON çöz" gibi ÜÇ farklı işi ÜST ÜSTE yapan, okuması ZOR bir ifade olurdu.',
            olmasaydi: 'Bu fonksiyon olmadan `user: JSON.parse(localStorage.getItem(\'authUser\'))` doğrudan yazılsaydı, `authUser` anahtarı HİÇ yoksa (`getItem` `null` döner) `JSON.parse(null)` GERÇEKTEN `null` DEĞİL, harfiyen `null` STRING\'ini ayrıştırıp `null` DEĞERİNİ verir gibi görünse de, TypeScript\'in kendisi bu satırı GÜVENSİZ (any) sayardı — `raw ? ... : null` kontrolü niyeti AÇIKÇA kodlar.'
          },
          {
            satir: 'try {',
            aciklama: '`JSON.parse(raw)` GEÇERSİZ bir JSON string\'iyle (ör. `localStorage`\'a elle/bir tarayıcı eklentisiyle BOZUK bir değer yazılmışsa) bir JavaScript hatası FIRLATIR — bu `try/catch`, o hatayı YAKALAR.',
            neden: 'Bu fonksiyon `initialState` TANIMLANIRKEN, yani modül İLK yüklendiğinde, React HENÜZ hiçbir şey ÇİZMEDEN (mount ETMEDEN) ÇALIŞIR — bu noktada fırlayan bir hatayı HİÇBİR React error boundary YAKALAYAMAZ, tüm uygulama beyaz bir ekranda ÇÖKER.',
            olmasaydi: 'Bu `try/catch` OLMASAYDI: `authUser` anahtarı HERHANGİ bir sebeple (DevTools\'tan elle düzenleme, YARIM kalmış bir yazma, farklı bir sekmeden GELEN bozuk veri) GEÇERSİZ bir JSON içerseydi, admin panel HİÇBİR sayfası AÇILAMAZ, yalnızca boş bir sekme GÖRÜNÜRDÜ — kullanıcının TEK kurtuluşu `localStorage`\'ı elle TEMİZLEMEK olurdu.'
          },
          {
            satir: 'localStorage.removeItem(\'authUser\')',
            aciklama: 'Bu TAM satır diff\'te İKİ KEZ geçer — bir kez `catch` bloğunun İÇİNDE (bozuk değeri SİLİP bir SONRAKİ okumada AYNI hataya düşülmesini ENGELLER, kendi kendini onarma) ve bir kez `logout`\'un İÇİNDE (`accessToken`\'ı sildiği GİBİ `authUser`\'ı da siler, ikisi BİRLİKTE yazılır BİRLİKTE silinir).',
            neden: 'İKİ FARKLI bağlamda AYNI çağrı kullanılmasının sebebi de AYNI: `authUser` anahtarının GEÇERSİZ (catch\'te) ya da ESKİ (logout\'ta) bir değerle `localStorage`\'da KALMASINI önlemek — yalnızca `null` DÖNDÜRÜP anahtarı SİLMEDEN bıraksaydık, HER okuma AYNI sorunla TEKRAR karşılaşırdı.',
            olmasaydi: 'Catch\'te `removeItem` OLMASAYDI, BOZUK veri `localStorage`\'da SONSUZA kadar KALIRDI (sonraki `setCredentials` onu ÜZERİNE yazana kadar). Logout\'ta OLMASAYDI, çıkış yapan bir adminin `localStorage`\'ında ESKİ kullanıcı bilgisi KALIR, ÇOK kısa bir an için `accessToken=null` ama `authUser` HÂLÂ ESKİ kullanıcıyı gösteren TUTARSIZ bir ara durum oluşurdu.'
          },
          {
            satir: 'setCredentials: (state, action: PayloadAction<{ accessToken: string; user: AdminUser }>) => {',
            aciklama: 'Bu action\'ı TETİKLEYEN yerin (OtpVerifyPage, Bölüm 4) göndermesi GEREKEN veri ARTIK iki alan — yalnızca token DEĞİL, backend\'in AYNI yanıtta döndürdüğü `user` de.',
            neden: 'Token VE user, backend\'in TEK bir yanıtından (`VerifyOtpResponse`) GELİYOR — ikisini AYRI action\'larla (`setToken`, `setUser`) göndermek, aralarında YAPAY bir sıralama/ara durum (token var ama user henüz YOK) yaratırdı.',
            olmasaydi: 'İmza DEĞİŞMESEYDİ (yalnızca `{accessToken}` kabul etmeye devam etseydi), OtpVerifyPage `dispatch(setCredentials({accessToken, user}))` YAZDIĞINDA TypeScript "user diye bir alan BEKLEMİYORUM" derdi — Bölüm 4\'ün kodu bu değişiklik OLMADAN hiç DERLENEMEZDİ.'
          },
          {
            satir: 'localStorage.setItem(\'authUser\', JSON.stringify(action.payload.user))',
            aciklama: '`accessToken`\'ın YANINA, AYNI action İÇİNDE yazılır — ikisi TEK bir "giriş başarılı" olayının PARÇASI, iki AYRI zaman diliminde değil.',
            neden: 'Eğer `user` yalnızca Redux state\'te tutulup `localStorage`\'a YAZILMASAYDI, F5 (sayfa yenileme) sonrası `readStoredUser()` HER ZAMAN `null` dönerdi — `isAuthenticated` (accessToken\'dan TÜRER) `true` iken `user` `null` gibi TUTARSIZ bir duruma DÜŞÜLÜRDÜ.',
            olmasaydi: 'Bu satır olmasaydı: admin giriş yapar, sayfayı YENİLER, `ProtectedRoute` onu İÇERİ ALIR (`accessToken` hâlâ localStorage\'da) ama `state.auth.user` `null`\'DIR — ileride `user`\'a bağlı BİR ekran (ör. "Hoş geldin, {user.email}") sessizce BOZULURDU.'
          }
        ]
      },
      {
        tur: 'sozluk',
        baslik: 'Bu Bölümde Geçen Terimler',
        terimler: [
          { terim: 'Type Guard olmayan basit union', tanim: '`AdminUser | null` gibi bir tip — değerin ya GERÇEK bir `AdminUser` ya da HİÇ olmadığını (`null`) ifade eder, aradaki her kontrol (`if (user)`) TypeScript\'e hangi DALDA hangi tipin geçerli olduğunu ANLATIR.' },
          { terim: 'localStorage + JSON.stringify/parse', tanim: '`localStorage` yalnızca STRING saklar — bir nesneyi saklamak için ÖNCE `JSON.stringify` ile metne çevrilir, geri okurken `JSON.parse` ile NESNEYE döndürülür.' }
        ]
      }
    ]
  };
</script>
