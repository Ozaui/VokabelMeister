import type { FetchBaseQueryError } from '@reduxjs/toolkit/query'

interface ApiErrorBody {
  error: { code: string; message: string }
}

function hasErrorBody(data: unknown): data is ApiErrorBody {
  return (
    typeof data === 'object' &&
    data !== null &&
    'error' in data &&
    typeof (data as ApiErrorBody).error?.message === 'string'
  )
}

// Accept-Language'a göre çözülmüş, admin panelin ek bir çeviri yapmasına gerek yok.
export function getApiErrorMessage(error: FetchBaseQueryError | SerializedError | unknown): string | null {
  if (error && typeof error === 'object' && 'data' in error && hasErrorBody((error as { data: unknown }).data)) {
    return (error as { data: ApiErrorBody }).data.error.message
  }
  return null
}`,

            satir: '\'error\' in data &&',

            olmasaydi: '`null` yerine boş bir string (`\'\'`) döndürülseydi, çağıran taraf `formError` state\'ini boş bir string\'e AYARLAR, `{formError && <p>...}` kontrolü (LoginPage, Bölüm 3) boş string\'i "falsy" kabul ettiği için hata KUTUSUNU hiç GÖSTERMEZDİ — admin, bir hata OLDUĞUNU bile fark ETMEZDİ.'

        tur: 'kod',

        dosyaYolu: 'admin/src/store/api/authApi.ts',

import type {
  LoginRequest,
  LoginResponse,
  VerifyOtpRequest,
  VerifyOtpResponse,
} from '../../types/auth.types'

export const authApi = api.injectEndpoints({
  endpoints: (builder) => ({
    login: builder.mutation<LoginResponse, LoginRequest>({
      query: (body) => ({ url: '/auth/login', method: 'POST', body }),
    }),
    verifyOtp: builder.mutation<VerifyOtpResponse, VerifyOtpRequest>({
      query: (body) => ({ url: '/auth/login/verify-otp', method: 'POST', body }),
    }),
  }),
})

export const { useLoginMutation, useVerifyOtpMutation } = authApi`,

            satir: 'import { api } from \'../api\'',

            neden: 'B-01\'in `endpoints: () => ({})` bilinçli boşluğu (bkz. `AKADEMI/admin/B-01_kurulum/03_....html`) TAM OLARAK bunun için vardı — header mantığı TEK yerde kalır, bu dosya yalnızca "hangi URL\'ler var" sorusuna cevap verir.',
            olmasaydi: '`authApi.ts` kendi `createApi({...})`\'sini çağırsaydı, Authorization/Accept-Language header ekleme mantığı BURADA TEKRAR yazılırdı (B-01\'deki `prepareHeaders`\'ın birebir kopyası) — iki AYRI RTK Query örneği, iki AYRI cache, birbirinden HABERSİZ.'
          },
          {
            satir: 'export const authApi = api.injectEndpoints({',

            neden: 'Her feature (B-03\'ün `wordsApi.ts`\'i gibi) KENDİ dosyasında `injectEndpoints` çağırır — TEK bir dev `api.ts` dosyasında TÜM endpoint\'lerin toplanması yerine, her biri kendi feature klasörüne AİT kalır.',
            olmasaydi: 'B-01\'deki `api.ts`\'in İÇİNE doğrudan `login`/`verifyOtp` eklenseydi, o dosya B-03/B-04/B-09\'a kadar HER endpoint\'i biriktiren, yüzlerce satırlık, hangi feature\'ın NEREDE olduğu takip edilemeyen TEK bir dosyaya dönüşürdü.'

            satir: 'login: builder.mutation<LoginResponse, LoginRequest>({',
            aciklama: 'RTK Query\'nin `mutation` (veriyi DEĞİŞTİREN/tetikleyen istek — `query`\'nin aksine, sunucu tarafında bir YAN ETKİ oluşturur) tipi — jenerik parametreler `<DönenTip, GöndeirlenTip>` sırasıyla.',
            neden: 'Login bir "veri OKUMA" değil, bir "eylem TETİKLEME" (şifre doğrulama + OTP gönderme) isteği — RTK Query bu ayrımı (`query` vs `mutation`) ÖNEMSER: `mutation`\'lar varsayılan olarak CACHE\'LENMEZ, her çağrıda GERÇEKTEN yeniden isteğe gider.',
            olmasaydi: '`mutation` yerine `query` kullanılsaydı, RTK Query bu isteği CACHE\'LEMEYE çalışırdı — ikinci bir "Giriş Yap" tıklamasında (ör. yanlış şifreden sonra düzeltilip TEKRAR denenince), önbellekteki ESKİ (başarısız) sonucu dönme RİSKİ oluşurdu.'
          },
          {
            satir: 'query: (body) => ({ url: \'/auth/login\', method: \'POST\', body }),',
            aciklama: 'Component\'in `login({email, password})` çağırdığında GERÇEKTEN gidecek isteği tanımlar — `url` GÖRECELİ (`/auth/login`), TAM adres B-01\'deki `baseUrl` (`VITE_API_URL`, ör. `http://localhost:5001/api/v1`) ile BİRLEŞTİRİLİR.',
            neden: 'Backend\'in gerçek endpoint\'i (`AuthController`, `[HttpPost("login")]`, `[Route("api/v1/auth")]`) TAM OLARAK bu yola karşılık gelir — göreli yol, admin panel FARKLI bir ortamda (staging/production) FARKLI bir `baseUrl`\'e deploy edilse bile DEĞİŞMEZ.',
            olmasaydi: '`url` TAM adres (`http://localhost:5001/api/v1/auth/login`) olarak YAZILSAYDI, B-01\'deki `baseUrl`/`Accept-Language`/`Authorization` header mantığının SAĞLADIĞI ortam-bağımsızlık BOŞA çıkardı — bu satır production\'da HÂLÂ localhost\'a giden bir isteğe DÖNÜŞÜRDÜ.'

            satir: 'verifyOtp: builder.mutation<VerifyOtpResponse, VerifyOtpRequest>({',
            aciklama: 'İkinci mutation — `login`\'in HEMEN altında, AYNI dosyada tanımlanır çünkü ikisi TEK bir akışın (iki adımlı giriş) iki PARÇASI.',
            neden: 'Bir tek dosyada (`authApi.ts`) BİRDEN FAZLA endpoint tanımlamak RTK Query\'de NORMAL bir desen — endpoint\'ler AYRI dosyalara değil, İLGİLİ OLDUKLARI feature\'a göre GRUPLANIR.',
            olmasaydi: '`verifyOtp` ayrı bir `otpApi.ts` dosyasına konsaydı, "auth ile ilgili TÜM isteklerin nerede olduğu" sorusunun cevabı İKİ dosyaya YAYILIRDI — tek bir akışın iki adımı, tek bir dosyada okunması daha KOLAY.'

            neden: 'LoginPage/OtpVerifyPage (Bölüm 3-4) bu hook\'ları ÇAĞIRARAK `[trigger, {isLoading, error}]` şeklinde bir SONUÇ alır — loading/error state\'i component\'in KENDİSİNİN elle `useState` ile YÖNETMESİ GEREKMEZ, RTK Query bunu OTOMATİK sağlar.',
            olmasaydi: 'Bu satır (ya da `injectEndpoints`\'in KENDİSİ) olmasaydı, `login`/`verifyOtp` isteklerini ATMANIN tek yolu ELLE bir `fetch()` çağrısı yazıp, isLoading/error state\'ini KENDİ `useState`\'leriyle YÖNETMEK olurdu — B-01\'in TÜM RTK Query kurulumunun VAR OLMA sebebi bu TEKRARI önlemek.'

        ]
      },
      {
        tur: 'ozet',
        baslik: 'Bu Bölümde Öğrendiklerimiz',
        maddeler: [
