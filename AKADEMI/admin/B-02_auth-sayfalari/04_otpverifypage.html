<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OtpVerifyPage.tsx</title>
<link rel="stylesheet" href="../engine/slides.css" />
</head>
<body>
<div id="app"></div>
<script>
  window.MODULE = {
    id: 'otpverifypage',
    bolumBaslik: 'B-02 — Auth Sayfaları',
    oncekiBolum: '03_loginpage.html',
    sonrakiBolum: '05_route-app-tsx.html',
    slaytlar: [
      {
        tur: 'kapak',
        ustBaslik: 'BÖLÜM 4',
        baslik: 'OtpVerifyPage.tsx',
        altBaslik: 'İki adımlı girişin İKİNCİ ve SON adımı — bu sayfa BAŞARIYLA bitince admin panelin GERÇEK bir JWT\'si olur, B-01\'in ProtectedRoute\'u ARTIK gerçek anlamda devreye girer.'
      },
      {
        tur: 'kod',
        baslik: 'OtpVerifyPage.tsx — 6 Haneli Kod Formu',
        dosyaYolu: 'admin/src/components/OtpVerifyPage.tsx',
        nedenBuKlasor: 'LoginPage.tsx ile AYNI `components/` klasörü — iki sayfa BİRBİRİNE komşu, TEK bir akışın iki YARISI.',
        kod: `import { useEffect, useState } from 'react'
import { useFormik } from 'formik'
import * as Yup from 'yup'
import { useLocation, useNavigate } from 'react-router-dom'
import { useTranslation } from 'react-i18next'
import type { TFunction } from 'i18next'
import { useDispatch } from 'react-redux'
import { useVerifyOtpMutation } from '../store/api/authApi'
import { setCredentials } from '../store/slices/authSlice'
import { getApiErrorMessage } from '../lib/apiError'

interface OtpFormValues {
  otpCode: string
}

interface OtpLocationState {
  email?: string
  from?: { pathname: string; search?: string; hash?: string }
}

function buildOtpSchema(t: TFunction) {
  return Yup.object({
    otpCode: Yup.string()
      .required(t('auth.otp.codeRequired'))
      .matches(/^\\d{6}$/, t('auth.otp.codeInvalid')),
  })
}

export function OtpVerifyPage() {
  const { t } = useTranslation()
  const dispatch = useDispatch()
  const navigate = useNavigate()
  const location = useLocation()
  const state = location.state as OtpLocationState | null
  const [verifyOtp, { isLoading }] = useVerifyOtpMutation()
  const [formError, setFormError] = useState<string | null>(null)

  useEffect(() => {
    // E-posta olmadan bu sayfaya doğrudan gelinmişse (ör. sayfa yenilendi) hangi hesabın
    // doğrulanacağı bilinmiyor demektir — LoginPage'e geri gönder.
    if (!state?.email) {
      navigate('/login', { replace: true })
    }
  }, [state, navigate])

  const formik = useFormik<OtpFormValues>({
    initialValues: { otpCode: '' },
    validationSchema: buildOtpSchema(t),
    onSubmit: async (values) => {
      setFormError(null)
      try {
        const result = await verifyOtp({ email: state!.email!, otpCode: values.otpCode })
        dispatch(setCredentials({ accessToken: result.accessToken, user: result.user }))
        // pathname TEK BAŞINA yeterli değil — ör. /words?page=3'ten atılmış bir admin,
        // search/hash de geri taşınmazsa filtrelerini/sayfa numarasını KAYBEDER.
        const destination = state!.from
          ? \`\${state!.from.pathname}\${state!.from.search ?? ''}\${state!.from.hash ?? ''}\`
          : '/'
        navigate(destination, { replace: true })
      } catch (err) {
        setFormError(getApiErrorMessage(err) ?? t('auth.genericError'))
      }
    },
  })

  if (!state?.email) return null

  return (
    <div className="flex h-screen items-center justify-center bg-background font-body text-text">
      <form
        onSubmit={formik.handleSubmit}
        noValidate
        className="w-full max-w-sm rounded-card border border-border bg-surface p-8 shadow-sm"
      >
        <h1 className="mb-2 font-heading text-xl font-bold text-text">{t('auth.otp.title')}</h1>
        <p className="mb-6 text-sm text-muted">{t('auth.otp.subtitle', { email: state.email })}</p>

        {formError && (
          <p role="alert" className="mb-4 rounded-control bg-destructive/10 px-3 py-2 text-sm text-destructive">
            {formError}
          </p>
        )}

        <label htmlFor="otpCode" className="mb-1 block text-sm font-medium text-text">
          {t('auth.otp.code')}
        </label>
        <input
          id="otpCode"
          name="otpCode"
          type="text"
          inputMode="numeric"
          maxLength={6}
          autoComplete="one-time-code"
          value={formik.values.otpCode}
          onChange={formik.handleChange}
          onBlur={formik.handleBlur}
          className="mb-1 w-full rounded-control border border-border bg-background px-3 py-2 text-center text-lg tracking-[0.5em] text-text"
        />
        {formik.touched.otpCode && formik.errors.otpCode && (
          <p className="mb-3 text-xs text-destructive">{formik.errors.otpCode}</p>
        )}

        <button
          type="submit"
          disabled={isLoading}
          className="mt-3 w-full rounded-control bg-primary py-2 text-sm font-semibold text-white disabled:opacity-60"
        >
          {isLoading ? t('auth.otp.submitting') : t('auth.otp.submit')}
        </button>
      </form>
    </div>
  )
}`,
        satirlar: [
          {
            satir: 'function buildOtpSchema(t: TFunction) {',
            aciklama: 'LoginPage\'in (Bölüm 3) `buildLoginSchema`\'sıyla AYNI DESEN — Yup şeması, hata mesajlarını ÇEVİRECEK `t` fonksiyonuna İHTİYAÇ duyduğu için component GÖVDESİNİN İÇİNDE, HER render\'da yeniden İNŞA EDİLİR.',
            neden: '`.matches(/^\\d{6}$/, ...)` tek bir KURALLA hem "boş mu" hem "6 haneli SAYI mı" sorusunu (required+pattern birlikte) CEVAPLAR — backend HER ZAMAN tam 6 haneli bir SAYISAL kod ÜRETİYOR, bu şema o SÖZLEŞMEYİ frontend tarafında da YANSITIYOR.',
            olmasaydi: 'Bu şema OLMASAYDI, "123abc" gibi GEÇERSİZ bir kod backend\'e GÖNDERİLİR, backend 400 İLE REDDEDERDİ — teknik olarak GÜVENLİ ama admin HATASINI bir AĞ isteği SONRASINDA öğrenirdi.'
          },
          {
            satir: 'const state = location.state as OtpLocationState | null',
            aciklama: 'LoginPage\'in (Bölüm 3) `navigate(\'/verify-otp\', {state: {email, from}})` ile GÖNDERDİĞİ veriyi OKUR — bu sayfaya ULAŞMANIN TEK yolu bu route state\'i, URL\'de HİÇBİR parametre YOKTUR (`/verify-otp` sabit bir yol).',
            neden: '`email`, backend\'in `POST /auth/login/verify-otp` isteğinde HANGİ hesabın OTP\'sinin doğrulanacağını bilmesi için ZORUNLU (Bölüm 1) — bu bilgi BAŞKA hiçbir yerden (URL, localStorage) OKUNAMAZ, yalnızca LoginPage\'DEN GELİR.',
            olmasaydi: 'Route state OKUNMASAYDI, bu sayfanın `verifyOtp` isteğini ATMASI için "hangi e-posta" sorusuna CEVAP verecek hiçbir veri OLMAZDI.'
          },
          {
            satir: 'useEffect(() => {',
            aciklama: 'Admin bu sayfaYA (`/verify-otp`) LoginPage\'den GEÇMEDEN, DOĞRUDAN URL yazarak ya da sayfayı YENİLEYEREK (F5) geldiyse, `location.state` KAYBOLUR (route state TARAYICI geçmişinde KALICI DEĞİLDİR) — bu `useEffect` bu durumu YAKALAR.',
            neden: 'Render SIRASINDA (component\'in GÖVDESİNDE) doğrudan `navigate(...)` ÇAĞIRMAK React\'te YASAKTIR ("render sırasında yan etki" hatası) — bir yönlendirme gibi bir YAN ETKİ, `useEffect`\'in İÇİNE, render TAMAMLANDIKTAN SONRA çalışacak şekilde YAZILMALI.',
            olmasaydi: '`useEffect` OLMADAN, `if (!state?.email) navigate(...)` DOĞRUDAN component GÖVDESİNE yazılsaydı, React "Cannot update a component while rendering a different component" UYARISI verirdi — bazı React sürümlerinde bu GERÇEK bir HATAYA (sonsuz render döngüsü) bile DÖNÜŞEBİLİR.'
          },
          {
            satir: 'const formik = useFormik<OtpFormValues>({',
            aciklama: 'LoginPage\'in (Bölüm 3) `useFormik` kullanımıyla AYNI desen — DİKKAT: bu çağrı `if (!state?.email) return null` erken ÇIKIŞINDAN ÖNCE yapılır.',
            neden: 'React\'in "hook kuralları" HER render\'da AYNI SAYIDA, AYNI SIRADA hook ÇAĞRILMASINI ZORUNLU kılar — `useFormik` bir HOOK\'tur, bu yüzden koşullu erken ÇIKIŞTAN ÖNCE, KOŞULSUZ çağrılmak ZORUNDADIR.',
            olmasaydi: '`useFormik` erken ÇIKIŞTAN SONRAYA taşınsaydı, `state?.email` YOKKEN component `useFormik`\'i HİÇ ÇAĞIRMAZ, e-posta GELDİĞİNDE (bir SONRAKİ render\'da) ÇAĞIRIRDI — React bunu "önceki render\'dan FARKLI sayıda hook" olarak ALGILAR, çalışma zamanı HATASI fırlatırdı.'
          },
          {
            satir: 'const result = await verifyOtp({ email: state!.email!, otpCode: values.otpCode })',
            aciklama: '`state!.email!` — İKİ AYRI non-null assertion. `useFormik` (bir üst satır) `if (!state?.email) return null`\'DAN ÖNCE TANIMLANDIĞI için, bu `onSubmit` callback\'i YAZILIRKEN TypeScript henüz o erken çıkışın GARANTİSİNDEN HABERSİZDİR.',
            neden: 'Bu callback GERÇEKTE yalnızca form GÖRÜNÜR OLDUĞUNDA (yani `state?.email` dolu OLDUĞUNDA) TETİKLENEBİLİR — ama TypeScript bunu callback\'in TANIMLANDIĞI NOKTADA ÇIKARAMAZ, `!` bu BİLGİYİ elle EKLER.',
            olmasaydi: '`!` işaretleri OLMASAYDI, TypeScript "`state` `null` OLABİLİR"/"`email` `undefined` OLABİLİR" diye DERLEME hatası verirdi — kod GÜVENLİ olduğu HALDE (formun kendisi yalnızca `state.email` doluyken GÖRÜNÜR OLDUĞU için) derleyici bunu BİLEMEZ.'
          },
          {
            satir: 'dispatch(setCredentials({ accessToken: result.accessToken, user: result.user }))',
            aciklama: 'Bölüm 2\'de GÜNCELLENEN `authSlice` action\'ı — backend\'in `VerifyOtpResponse`\'undan GELEN `accessToken` VE `user`\'ı Redux state\'e VE `localStorage`\'a YAZAR.',
            neden: 'Bu satır ÇALIŞTIKTAN SONRA `state.auth.isAuthenticated` `true` OLUR — B-01\'in `ProtectedRoute`\'u (Bölüm 5, App.tsx) ARTIK admin\'i korumalı sayfalara BIRAKIR, bu B-02\'nin BAŞINDAN BERİ hedeflediği AN.',
            olmasaydi: 'Bu satır ÇAĞRILMASAYDI, backend GERÇEKTEN bir token ÜRETMİŞ olurdu ama admin panel bunu HİÇ KULLANMAZDI — admin, DOĞRU kodu girmesine RAĞMEN sonsuza kadar "giriş yapmamış" GÖRÜNÜRDÜ.'
          },
          {
            satir: 'if (!state?.email) return null',
            aciklama: '`useEffect` İÇİNDEKİ yönlendirme ASENKRON çalışır (render TAMAMLANDIKTAN sonra) — bu satır, o yönlendirme GERÇEKLEŞENE KADAR geçen KISA an için formun HİÇ görünmemesini SAĞLAR. Artık `useFormik`\'İN ALTINDA durur çünkü hook\'lar erken çıkıştan ÖNCE çağrılmak ZORUNDADIR.',
            neden: 'Bu satır OLMASAYDI, `state.email` YOKKEN bile `<h1>{t(\'auth.otp.subtitle\', {email: state.email})}</h1>` GİBİ satırlar ÇALIŞMAYA çalışır, `state` `null` olduğu için `state.email` OKUMASI (aşağıdaki JSX\'te) bir ÇÖKMEYE (TypeError) yol AÇARDI.',
            olmasaydi: 'Bu erken çıkış OLMASAYDI: doğrudan `/verify-otp`\'a giden bir admin, YÖNLENDİRME gerçekleşmeden ÖNCE bir an için `state.email` okumaya çalışan JSX\'in ÇÖKMESİYLE karşılaşırdı — beyaz ekran/React hata sayfası.'
          },
          {
            satir: 'const destination = state!.from',
            aciklama: 'LoginPage\'in TAŞIDIĞI `from` bilgisi VARSA (admin BAŞKA bir korumalı sayfadan atılıp BURAYA geldiyse), oraya; YOKSA (admin doğrudan `/login`\'e gidip giriş YAPTIYSA) ana sayfaya (`/`) YÖNLENDİRME hedefini HESAPLAR. `!` burada da AYNI sebepten (bir üstteki `state!.email!` İLE aynı) GEREKLİDİR.',
            neden: '`pathname`+`search`+`hash` AYRI AYRI birleştirilir (tek bir satır ŞABLONU) çünkü React Router\'ın `navigate()`\'i TEK bir STRING URL bekler — üçünü AYRI AYRI taşımak state\'te ANLAMLI ama navigate\'e VERİRKEN TEK bir yola BİRLEŞTİRİLMELİ.',
            olmasaydi: 'Yalnızca `state.from?.pathname ?? \'/\'` yazılsaydı (İLK taslakta OLDUĞU gibi), `/words?page=3&level=A2`\'DEN atılan bir admin girişten SONRA `/words`\'e (BOŞ, 1. sayfaya) düşer, `page=3` sorgu PARAMETRESİ SESSİZCE kaybolurdu — bağımsız bir kod DENETİMİNDE bulunup DÜZELTİLDİ.'
          },
          {
            satir: 'navigate(destination, { replace: true })',
            aciklama: '`replace: true` — bu YÖNLENDİRME tarayıcı GEÇMİŞİNE YENİ bir kayıt EKLEMEZ, `/verify-otp`\'in YERİNE geçer.',
            neden: '`replace` OLMASAYDI, admin giriş YAPTIKTAN SONRA tarayıcının "geri" tuşuna BASSA `/verify-otp`\'a (ARTIK anlamsız, tekrar OTP istenen bir sayfaya) GERİ DÖNERDİ — ProtectedRoute (B-01) bu sayfada zaten JWT VAR olduğu için bir sorun ÇIKARMAZ ama kullanıcı deneyimi AÇISINDAN kafa KARIŞTIRICI olurdu.',
            olmasaydi: '`replace` YERİNE varsayılan (`push`) davranış KULLANILSAYDI, tarayıcı geçmişi `/login → /verify-otp → /words` şeklinde BİRİKİRDİ — "geri" tuşu admin\'i `/verify-otp`\'a, TEKRAR "geri" tuşu `/login`\'e GÖTÜRÜRDÜ, oysa GERÇEKTEN "bir önceki SAYFAYA" dönmek İSTİYORDU.'
          },
          {
            satir: 'value={formik.values.otpCode}',
            aciklama: 'LoginPage\'İN (Bölüm 3) e-posta/şifre alanlarıyla AYNI Formik "controlled input" DESENİ — `value`/`onChange={formik.handleChange}`/`onBlur={formik.handleBlur}` ÜÇLÜSÜ, `name="otpCode"` ÜZERİNDEN `formik.values.otpCode`\'A BAĞLANIR.',
            neden: 'Bu ÜÇLÜ olmadan `input` "uncontrolled" KALIRDI — admin YAZDIKÇA `formik.values.otpCode` HİÇ GÜNCELLENMEZ, `onSubmit`\'e giden `values.otpCode` HER ZAMAN boş STRING olurdu.',
            olmasaydi: 'Yalnızca `defaultValue` KULLANILSAYDI (React\'in "uncontrolled" ALTERNATİFİ), Formik\'in KENDİ `values`/`touched`/`errors` DÖNGÜSÜ bu alanı HİÇ İZLEMEZDİ — validasyon HER ZAMAN "boş" durumuna göre ÇALIŞIRDI.'
          },
          {
            satir: 'formik.touched.otpCode && formik.errors.otpCode && (',
            aciklama: 'Hata metni yalnızca alan "dokunulmuş" (`touched`) VE Yup şeması bir hata ÜRETMİŞSE gösterilir — LoginPage\'in (Bölüm 3) `formik.touched.email` DESENİYLE birebir AYNI.',
            neden: '`touched` kontrolü OLMADAN, sayfa AÇILIR AÇILMAZ (admin HENÜZ hiçbir şey yazmamışken) "Kod zorunludur" hatası GÖRÜNÜRDÜ.',
            olmasaydi: 'Yalnızca `formik.errors.otpCode` kontrol edilseydi, sayfa AÇILIR AÇILMAZ hata METNİ görünür, admin daha OTP kodunu YAZMAYA BAŞLAMADAN "hatalı" bir form GÖRÜRDÜ.'
          },
          {
            satir: 'maxLength={6}',
            aciklama: 'Tarayıcının KENDİSİ, kullanıcı 6 haneden FAZLA karakter YAZAMAYACAK şekilde alanı SINIRLAR — backend zaten TAM 6 haneli bir kod ÜRETİYOR (A-03, `IOtpService`).',
            neden: '`buildOtpSchema`\'daki `.matches(/^\\d{6}$/, ...)` YİNE de GEREKLİ çünkü `maxLength` yalnızca "6\'DAN FAZLA YAZAMA"yı ENGELLER — 3 haneli bir kod GİRİP submit ETMEYE (`maxLength` bunu ENGELLEMEZ) karşı Yup şeması KORUMA sağlar.',
            olmasaydi: '`maxLength` OLMASAYDI, admin YANLIŞLIKLA çok uzun bir metin YAPIŞTIRABİLİRDİ (ör. panodan) — Yup şeması yine de bunu REDDEDERDİ ama `maxLength`, HATAYI submit\'TEN ÖNCE, YAZARKEN engelleyerek daha İYİ bir kullanıcı deneyimi SAĞLAR.'
          },
          {
            satir: 'autoComplete="one-time-code"',
            aciklama: 'Tarayıcılara/işletim sistemlerine (iOS/Android/masaüstü) "bu alan bir SMS/e-posta OTP kodu" OLDUĞUNU söyleyen standart bir `autocomplete` DEĞERİ — bazı platformlar bunu GÖRÜNCE panoya kopyalanan/algılanan kodu OTOMATİK ÖNERİR.',
            neden: 'Bu, W3C\'nin standart bir `autocomplete` token\'ı — HERHANGİ bir ek JavaScript KODU gerektirmeden, tarayıcı/işletim sisteminin KENDİ OTP algılama özelliğinden (ör. SMS\'ten OTOMATİK doldurma) YARARLANMAYI sağlar.',
            olmasaydi: 'Bu öznitelik OLMASAYDI form YİNE çalışırdı ama bazı platformlarda (ör. bir admin telefonundan giriş yapıyorsa) OTOMATİK kod DOLDURMA/ÖNERME özelliği DEVREYE GİRMEZDİ — admin kodu HER zaman ELLE yazmak ZORUNDA kalırdı.'
          }
        ]
      },
      {
        tur: 'onizleme',
        baslik: 'Tarayıcıda Dene — /verify-otp',
        rota: '/verify-otp',
        aciklama: 'ProtectedRoute\'un DIŞINDAki İKİNCİ route — ama LoginPage\'in AKSİNE, e-posta bilgisi OLMADAN (route state\'siz) buraya gelen bir admin ANINDA /login\'e geri gönderilir.',
        akis: [
          { eylem: 'Admin LoginPage\'den BAŞARIYLA geçip buraya ULAŞIR, doğru 6 haneli kodu GİRER', sonuc: 'Backend token döner, authSlice GÜNCELLENİR, admin AppLayout\'a (ya da nereden geldiyse ORAYA) yönlendirilir' },
          { eylem: 'Admin YANLIŞ bir kod girer', sonuc: 'Backend 400 döner, form ÜSTÜNDE kırmızı hata KUTUSU görünür, admin AYNI sayfada kalır, TEKRAR deneyebilir' },
          { eylem: 'Admin sayfayı YENİLER (F5) ya da URL\'e doğrudan /verify-otp YAZAR', sonuc: 'Route state KAYBOLDUĞU için ANINDA /login\'e yönlendirilir — hangi hesabın doğrulanacağı BİLİNMİYOR' }
        ],
        apiCagrisi: { yontem: 'POST', url: 'http://localhost:5001/api/v1/auth/login/verify-otp' },
        durumlar: [
          { durum: 'Yükleniyor', gorunum: 'Buton disabled, metin "Doğrulanıyor..."ya döner' },
          { durum: 'Yanlış/süresi dolmuş kod', gorunum: 'Kırmızı alert kutusu, backend\'in gerçek hata mesajı' },
          { durum: 'Başarılı', gorunum: 'authSlice güncellenir (accessToken+user), ProtectedRoute artık admin\'i içeri bırakır' }
        ],
        notlar: [
          'Gerçek istek gövdesi: {"email":"admin.b02@wordlearner.test","otpCode":"775378"}',
          'Gerçek başarılı yanıt (200) — kısaltılmadan: {"accessToken":"eyJhbGci...","refreshToken":"BDshAM9i...","expiresIn":900,"user":{"id":3,"currentLevel":"A1","themePreference":"System","languagePreference":"tr"},"accountWasRecovered":false}',
          '`refreshToken` yanıtta VARDIR ama B-02 kapsamında authSlice bunu SAKLAMAZ (görev listesi yalnızca accessToken/user/isAuthenticated istiyor) — 15 dakikalık access token süresi dolduğunda OTOMATİK yenileme (silent refresh) HENÜZ YOK, bu bilinçli bir kapsam sınırı, gelecekte ayrı bir görevde ele alınacak.',
          'OTP kodu backend\'in konsol logundan okunur (geliştirme ortamı) — "[DEV EMAIL] To: ... | Subject: VokabelMeister — Giriş Kodu | Args: 775378, 5" satırındaki İLK sayı 6 haneli koddur, ikincisi (5) dakika cinsinden geçerlilik süresidir.'
        ]
      },
      {
        tur: 'sozluk',
        baslik: 'Bu Bölümde Geçen Terimler',
        terimler: [
          { terim: 'Non-null assertion (!)', tanim: 'TypeScript\'e "bu değer BURADA kesinlikle null/undefined DEĞİL" diyen, derleyicinin KENDİSİ çıkaramadığı bir garantiyi geliştiricinin ELLE verdiği işaret — yanlış kullanılırsa çalışma zamanı hatasına yol açabileceği için DİKKATLİ kullanılır.' },
          { terim: 'Route state vs URL parametresi', tanim: 'Bir sonraki sayfaya veri taşımanın iki yolu — `?email=...` (URL\'de AÇIKÇA görünür, geçmişte KALICI) veya `state` (React Router\'ın bellekte tuttuğu, sayfa yenilenince KAYBOLAN veri).' }
        ]
      }
    ]
  };
</script>
<script src="../engine/slides-engine.js"></script>
</body>
