<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Özet + Sözlük</title>
<link rel="stylesheet" href="../engine/slides.css" />
</head>
<body>
<div id="app"></div>
<script>
  window.MODULE = {
    id: 'ozet-sozluk',
    bolumBaslik: 'B-01 — Kurulum',
    oncekiBolum: '06_dark-mode.html',
    sonrakiBolum: null,
    slaytlar: [
      {
        tur: 'ozet',
        baslik: 'B-01 — Kurulum: Ne Yazıldı?',
        maddeler: [
          "Proje iskeleti: Vite+React+TS, CLAUDE.md §4.1'deki ortak kütüphane seti (Redux Toolkit, axios, Formik/Yup, react-router-dom, i18next, lucide-react, react-toastify), Tailwind v4 (@tailwindcss/vite, ayrı config dosyası YOK), Vitest — Vite'ın varsayılanı oxlint'ten ESLint'e geçildi",
          "Tasarım sistemi: DESIGN_SYSTEM.md'deki palet (renk/font/radius/gölge) index.css'te @theme + .dark override olarak token'landı — hiçbir component ham hex kodu KULLANMIYOR",
          "Redux store: authSlice (accessToken/isAuthenticated, localStorage senkron) + store/api.ts (axios apiClient, Authorization/Accept-Language interceptor'ı) — slice sınırının FIELD değil KONU bazlı çizilmesi kararı",
          "Dil tercihi: languageSlice + react-i18next (tr/de çeviri dosyaları) + useLanguageSync köprüsü + Topbar'da LanguageSwitcher — İKİ ayrı sistemin (Redux + i18next) AYNI localStorage anahtarıyla bağımsız ama senkron başlaması",
          "store/hooks.ts (useAppDispatch/useAppSelector) — YAGNI ile bunlara GERÇEKTEN ihtiyaç duyan ilk kod (LanguageSwitcher) yazılırken eklendi, önceden değil",
          "Routing: .env (VITE_API_URL) + React Router (BrowserRouter/Routes/Outlet) + ProtectedRoute (kimliksizse /login'e state.from ile yönlendirme) + AppLayout (Sidebar+Topbar+Outlet iskeleti, mobilde hamburger ile açılır-kapanır panel)",
          "Dark Mode: themeSlice (Light/Dark/System — backend'in Users.ThemePreference enum'uyla BİREBİR, dil kodlarının aksine büyük harfli), useThemeSync (System modunda OS'i CANLI dinler), ThemeSwitcher, index.html'e FOUC-önleyici senkron script",
          "components/ klasörü KONU/özellik bazlı yapılandırıldı (layout/ — ileride auth/, words/, common/ aynı desende açılacak)",
          "Backend'e bağlanacak iki nokta NOT edildi (B-02'de kapanacak): AuthUserDto.languagePreference/themePreference login yanıtından Redux'a senkronlanacak, dil/tema DEĞİŞİKLİĞİNİN backend'e YAZILMASI ise C-01'de gelecek"
        ]
      },
      {
        tur: 'sozluk',
        baslik: 'B-01 Boyunca Geçen Tüm Yeni Kavramlar',
        terimler: [
          { terim: 'Slice sınırı (konu bazlı)', tanim: 'Bir Redux slice, TEK bir konuyla ilgili state ve reducer\'ları barındırır — birlikte değişen alanlar (accessToken/isAuthenticated) AYNI slice\'ta, bağımsız konular (auth/language/theme) AYRI slice\'larda.' },
          { terim: 'resolveInitial*/SUPPORTED_*', tanim: 'languageSlice/themeSlice\'te tekrar eden desen: localStorage\'daki değeri oku, SUPPORTED_* dizisinde geçerli mi kontrol et, değilse varsayılana düş — ErrorMessages/SuccessMessages\'taki "desteklenmiyorsa varsayılana düş" kuralının frontend karşılığı.' },
          { terim: 'useAppDispatch / useAppSelector', tanim: 'react-redux\'un generic hook\'larının, withTypes ile bu projeye özel (RootState/AppDispatch bilen) hâli — her component\'te tip elle yazılmasın diye.' },
          { terim: 'useLanguageSync / useThemeSync', tanim: 'Redux state\'i ile DIŞ bir sistem (i18next instance\'ı / <html> DOM class\'ı) arasında köprü kuran hook\'lar — Redux DEĞİŞTİĞİNDE useEffect ile dış sistemi GÜNCELLERLER.' },
          { terim: 'ProtectedRoute (layout route)', tanim: 'path\'siz bir <Route element={...}>, GÖRSEL bir şey render ETMEZ — yalnızca erişim kararı verip Outlet ile alt-route\'ları gösterir ya da <Navigate> ile yönlendirir.' },
          { terim: 'fixed + md:static (responsive konum deseni)', tanim: 'TEK bir component\'in mobilde "kayan overlay panel", masaüstünde "sabit sütun" davranmasını, hiçbir JS koşulu yazmadan, yalnızca Tailwind\'in breakpoint önekleriyle sağlayan desen (Sidebar).' },
          { terim: 'ml-auto (justify-between yerine)', tanim: 'Bir flex öğesinin SOLUNDAKİ tüm boş alanı kendine ÇEKMESİ — justify-between\'in "tek görünür öğe kaldığında sola yaslama" DAVRANIŞINA düşmeden sağa yaslama sağlar (Topbar\'da hamburger mobilde/masaüstünde görünür/gizli değişse bile).' },
          { terim: 'FOUC (Flash Of Unstyled/Wrong Content)', tanim: 'Sayfanın İLK anda yanlış görünümle (burada: yanlış tema) render edilip JS çalıştıktan SONRA doğru görünüme "zıplaması" — index.html\'e eklenen SENKRON inline script ile önlendi.' },
          { terim: 'IIFE (Immediately Invoked Function Expression)', tanim: 'Tanımlandığı anda çalışan, içindeki değişkenleri global scope\'a SIZDIRMAYAN fonksiyon kalıbı — FOUC-önleyici inline script\'te kullanıldı.' },
          { terim: 'aria-pressed vs aria-expanded', tanim: 'aria-pressed "iki durumlu bir SEÇENEK" (LanguageSwitcher/ThemeSwitcher butonları) için; aria-expanded "görünürlüğü KONTROL eden" butonlar (Sidebar hamburger) için — farklı bağlamda farklı ARIA özniteliği doğrudur.' }
        ]
      }
    ]
  };
</script>
<script src="../engine/slides-engine.js"></script>
</body>
</html>
