export type Theme = 'Light' | 'Dark' | 'System'

const SUPPORTED_THEMES: Theme[] = ['Light', 'Dark', 'System']

interface ThemeState {
  theme: Theme
}

function resolveInitialTheme(): Theme {
  const stored = localStorage.getItem('theme')
  return SUPPORTED_THEMES.includes(stored as Theme) ? (stored as Theme) : 'System'
}

const initialState: ThemeState = {
  theme: resolveInitialTheme(),
}

const themeSlice = createSlice({
  name: 'theme',
  initialState,
  reducers: {
    setTheme: (state, action: PayloadAction<Theme>) => {
      state.theme = action.payload
      localStorage.setItem('theme', action.payload)
    },
  },
})

export const { setTheme } = themeSlice.actions
export default themeSlice.reducer`,

        kod: `import { useEffect } from 'react'
import { useAppSelector } from '../store/hooks'

function applyDarkClass(isDark: boolean) {
  document.documentElement.classList.toggle('dark', isDark)
}

export function useThemeSync() {
  const theme = useAppSelector((state) => state.theme.theme)

  useEffect(() => {
    if (theme === 'System') {
      const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)')
      applyDarkClass(mediaQuery.matches)

      const handleChange = (event: MediaQueryListEvent) => applyDarkClass(event.matches)
      mediaQuery.addEventListener('change', handleChange)
      return () => mediaQuery.removeEventListener('change', handleChange)
    }

    applyDarkClass(theme === 'Dark')
  }, [theme])
}`,

        kod: `import { Monitor, Moon, Sun } from 'lucide-react'
import { useAppDispatch, useAppSelector } from '../../store/hooks'
import { setTheme, type Theme } from '../../store/slices/themeSlice'

const THEMES: { value: Theme; label: string; Icon: typeof Sun }[] = [
  { value: 'Light', label: 'Açık tema', Icon: Sun },
  { value: 'Dark', label: 'Koyu tema', Icon: Moon },
  { value: 'System', label: 'Sistem teması', Icon: Monitor },
]

function ThemeSwitcher() {
  const dispatch = useAppDispatch()
  const currentTheme = useAppSelector((state) => state.theme.theme)

  return (
    <div className="inline-flex overflow-hidden rounded-control border border-border">
      {THEMES.map(({ value, label, Icon }) => (
        <button
          key={value}
          type="button"
          aria-label={label}
          aria-pressed={currentTheme === value}
          onClick={() => dispatch(setTheme(value))}
          className="px-3 py-1.5 text-text-secondary transition-colors duration-150 aria-pressed:bg-accent aria-pressed:text-white"
        >
          <Icon size={18} />
        </button>
      ))}
    </div>
  )
}

export default ThemeSwitcher`,
