@custom-variant dark (&:where(.dark, .dark *));

@theme {
  --font-sans: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;

  --color-background: #fafafa;
  --color-surface: #ffffff;
  --color-surface-muted: #f2f2f5;

  --radius-checkbox: 4px;
  --radius-row: 16px; /* küçük kart/liste satırı/mini seçenek kartı */
  --radius-card: 20px; /* genel kart — form/istatistik/panel */
  --radius-modal: 24px;
  --radius-tooltip: 8px; /* tooltip/popover */
  --radius-toast: 12px;

  --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.05);
  --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.08);
}

/* Aynı gölgeler koyu zeminde görünmez kalır — dark modda opaklık yükseltilir */
.dark {
  --color-background: #121214;
  --color-surface: #1c1c1e;
  --color-surface-muted: #2c2c2e;
  --color-text-primary: #f2f1f5;

  --color-text-muted: #636366;
  --color-border: #2c2c2e;

  --color-success: #30d158;

  --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.32);
  --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.42);
}

body {

  font-family: var(--font-sans);
  background-color: var(--color-background);
  color: var(--color-text-primary);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

#root {
  min-height: 100svh;
