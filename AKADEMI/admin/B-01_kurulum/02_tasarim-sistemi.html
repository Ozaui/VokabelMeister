  --font-sans: 'Inter', ui-sans-serif, system-ui, sans-serif;

  --color-background: #fafafa;

}

/* Aynı gölgeler koyu zeminde görünmez kalır — dark modda opaklık yükseltilir */
.dark {
  --color-background: #131217;

  --color-text-primary: #f2f1f5;

body {
