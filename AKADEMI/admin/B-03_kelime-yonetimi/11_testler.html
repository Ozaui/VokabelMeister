<!DOCTYPE html>
<html lang="tr">

<link rel="stylesheet" href="../engine/slides.css" />
</head>
<body>
<div id="app"></div>
<script>
  window.MODULE = {
    id: 'b03-testler',
    bolumBaslik: 'B-03 — Kelime Yönetimi',
    oncekiBolum: '10_i18n-hatasi-ve-duzeltmesi.html',
    sonrakiBolum: '12_ozet-sozluk.html',
    slaytlar: [
      {
        tur: 'kapak',
        ustBaslik: 'BÖLÜM 11',
        baslik: 'Testler',
        altBaslik: 'Dört test dosyası, B-02\'nin (Vitest + React Testing Library + API hook mock\'lama) desenini AYNEN sürdürüyor — bu bölüm en ZENGİN ders veren dosyayı (`WordPairingPage.test.tsx`) detaylı gösterip geri kalanları KISACA özetliyor.'
      },
      {
        tur: 'kavram',
        baslik: 'API Hook\'larını Mock\'lamak — B-02\'den Devam Eden Desen',
        aciklama: 'Dört test dosyasının HEPSİ `vi.mock(\'../../store/api/...\')` ile `wordsApi`/`languagesApi`/`categoriesApi`\'nin export ettiği hook\'ları (`useGetWordsQuery` vb.) SAHTE (mock) fonksiyonlara ÇEVİRİYOR — testler GERÇEK bir backend\'e (axios ile de olsa) istek ATMIYOR, yalnızca "bu hook şu veriyi DÖNDÜRSE component NE render eder" sorusuna cevap ARIYOR.',
        neden: 'Component testleri GERÇEK bir ağ isteği ATSAYDI, testler YAVAŞ (ağ gecikmesi) VE KIRILGAN (backend çalışmıyorsa/veri değiştiyse test BOZULUR) olurdu — mock\'lama testleri component\'in KENDİ mantığına (doğru veriye doğru tepki verip vermediğine) ODAKLIYOR. RTK Query\'den axios\'a geçiş bu ilkeyi DEĞİŞTİRMEDİ, yalnızca mock\'ların İÇ ŞEKLİ değişti (aşağıda görülecek).',
        olmasaydi: 'Mock\'lama OLMASAYDI, HER test çalıştırmasından ÖNCE gerçek bir backend\'in ÇALIŞIR durumda olması, doğru test verisiyle DOLU olması gerekirdi — CI\'da (sürekli entegrasyon) bu türden bir bağımlılık testleri YAVAŞ ve KARARSIZ (flaky) yapardı.'
      },
      {
        tur: 'kod',
        baslik: 'WordPairingPage.test.tsx — Önerilen Eşleşme + Birincil Taraf Testleri',
        dosyaYolu: 'admin/src/components/words/WordPairingPage.test.tsx',
        nedenBuKlasor: 'Component\'in KENDİ dosyasının YANINDA (`.test.tsx` uzantısı) — B-02\'de kurulan Vitest yapılandırması dosya adına göre test dosyalarını OTOMATİK BULUYOR.',
        kod: `import { describe, it, expect, vi, beforeEach } from 'vitest'
import { render, screen } from '@testing-library/react'
import userEvent from '@testing-library/user-event'
import { WordPairingPage } from './WordPairingPage'
import { useGetLanguagesQuery } from '../../store/api/languagesApi'
import { useGetUnmatchedWordConceptsQuery, usePairWordConceptsMutation } from '../../store/api/wordsApi'

vi.mock('../../store/api/languagesApi', () => ({
  useGetLanguagesQuery: vi.fn(),
}))
vi.mock('../../store/api/wordsApi', () => ({
  useGetUnmatchedWordConceptsQuery: vi.fn(),
  usePairWordConceptsMutation: vi.fn(),
}))

const mockedUseGetLanguagesQuery = vi.mocked(useGetLanguagesQuery)
const mockedUseGetUnmatchedWordConceptsQuery = vi.mocked(useGetUnmatchedWordConceptsQuery)
const mockedUsePairWordConceptsMutation = vi.mocked(usePairWordConceptsMutation)

const germanItems = [
  { wordConceptId: 41, languageCode: 'de', text: 'aber', definition: 'ama, fakat, ancak', partOfSpeech: 'Conjunction', difficultyLevel: 'A1', suggestedMatchConceptId: 87 },
]
const turkishItems = [
  { wordConceptId: 87, languageCode: 'tr', text: 'fakat', definition: null, partOfSpeech: 'Conjunction', difficultyLevel: 'A1', suggestedMatchConceptId: null },
  { wordConceptId: 88, languageCode: 'tr', text: 'ancak', definition: null, partOfSpeech: 'Conjunction', difficultyLevel: 'A1', suggestedMatchConceptId: null },
]

describe('WordPairingPage', () => {
  const pairTrigger = vi.fn()

  beforeEach(() => {
    pairTrigger.mockReset().mockResolvedValue({})
    mockedUsePairWordConceptsMutation.mockReturnValue([pairTrigger, { isLoading: false }] as unknown as ReturnType<
      typeof usePairWordConceptsMutation
    >)
    mockedUseGetLanguagesQuery.mockReturnValue({
      data: [
        { id: 1, code: 'de', name: 'German', nativeName: 'Deutsch' },
        { id: 2, code: 'tr', name: 'Turkish', nativeName: 'Türkçe' },
      ],
    } as unknown as ReturnType<typeof useGetLanguagesQuery>)
    mockedUseGetUnmatchedWordConceptsQuery.mockImplementation(((arg: { languageId: number }) => ({
      data: { items: arg.languageId === 1 ? germanItems : turkishItems, totalCount: 1, page: 1, pageSize: 50 },
      isLoading: false,
      refetch: vi.fn(),
    })) as unknown as typeof useGetUnmatchedWordConceptsQuery)
  })

  it('her iki sütun da eşleşmemiş kelimeleri listeler', () => {
    render(<WordPairingPage />)

    expect(screen.getByText('aber')).toBeInTheDocument()
    expect(screen.getByText('fakat')).toBeInTheDocument()
    expect(screen.getByText('ancak')).toBeInTheDocument()
  })

  it('Almanca taraf seçilince önerilen Türkçe eşleşme vurgulanır', async () => {
    render(<WordPairingPage />)

    await userEvent.click(screen.getByText('aber'))

    // "fakat" (suggestedMatchConceptId: 87) satırında "Önerilen eşleşme" etiketi görünür.
    const fakatRow = screen.getByText('fakat').closest('button')!
    expect(fakatRow).toHaveTextContent('Önerilen eşleşme')
    const ancakRow = screen.getByText('ancak').closest('button')!
    expect(ancakRow).not.toHaveTextContent('Önerilen eşleşme')
  })

  it('mutlu yol: iki taraf seçilip Eşleştir\'e basılınca pairWordConcepts doğru primaryId ile çağrılır', async () => {
    render(<WordPairingPage />)

    await userEvent.click(screen.getByText('aber'))
    await userEvent.click(screen.getByText('fakat'))
    await userEvent.click(screen.getByRole('button', { name: 'Eşleştir' }))

    // "aber" (Almanca) İLK seçilen taraf olduğu için varsayılan birincil odur.
    expect(pairTrigger).toHaveBeenCalledWith({ primaryId: 41, otherConceptId: 87 })
  })

  it('"birincil tarafı değiştir" ile primaryId karşı tarafa döner', async () => {
    render(<WordPairingPage />)

    await userEvent.click(screen.getByText('aber'))
    await userEvent.click(screen.getByText('fakat'))
    await userEvent.click(screen.getByRole('button', { name: 'Birincil tarafı değiştir' }))
    await userEvent.click(screen.getByRole('button', { name: 'Eşleştir' }))

    expect(pairTrigger).toHaveBeenCalledWith({ primaryId: 87, otherConceptId: 41 })
  })
})`,
        satirlar: [
          {
            satir: "pairTrigger.mockReset().mockResolvedValue({})",
            aciklama: 'RTK Query döneminin `.mockReturnValue({ unwrap: () => Promise.resolve({}) })` deseninin yerini DÜZ bir `mockResolvedValue({})` aldı — Bölüm 4\'teki `.unwrap()`\'ın kalkmasıyla BİREBİR aynı gerekçe: `pairTrigger` artık native bir Promise döndürüyor, sahte "unwrap sarmalayıcısı" kurmaya GEREK yok.',
            neden: '`useApiMutation`\'ın (Bölüm 2) döndürdüğü `trigger` fonksiyonu düz bir `Promise<T>` — testin mock\'u da GERÇEK davranışla BİREBİR eşleşmeli, aksi halde test GERÇEKTE var olmayan bir arayüzü (unwrap) doğruluyor OLURDU.',
            olmasaydi: '`.mockReturnValue({ unwrap: ... })` deseni KORUNSAYDI, test derleme zamanında GEÇER ama `WordPairingPage.tsx`\'in GERÇEK kodu (artık `.unwrap()` çağırmıyor) ile testin VARSAYDIĞI arayüz birbirinden SAPARDI — mock, GERÇEK kodun ihtiyaç DUYMADIĞI bir metodu (unwrap) sağlamaya devam ederdi.'
          },
          {
            satir: "mockedUseGetUnmatchedWordConceptsQuery.mockImplementation(((arg: { languageId: number }) => ({\n      data: { items: arg.languageId === 1 ? germanItems : turkishItems, totalCount: 1, page: 1, pageSize: 50 },\n      isLoading: false,\n      refetch: vi.fn(),\n    })) as unknown as typeof useGetUnmatchedWordConceptsQuery)",
            aciklama: 'TEK bir mock fonksiyonu, ÇAĞRILDIĞI `languageId`\'ye göre FARKLI veri döndürüyor — gerçek `getUnmatchedWordConcepts`\'in İKİ kez (Almanca+Türkçe) ÇAĞRILAN davranışını taklit ediyor. `refetch: vi.fn()` alanı RTK Query döneminde YOKTU — Bölüm 9\'daki `refetchGerman()`/`refetchTurkish()` çağrılarının component içinde GERÇEKTEN var olan bir fonksiyon bulmasını sağlıyor.',
            neden: '`WordPairingPage` AYNI hook\'u İKİ farklı `languageId` ile ÇAĞIRIYOR (Bölüm 9) — sabit bir mock (`mockReturnValue`) HER İKİ çağrıya da AYNI veriyi DÖNDÜRÜRDÜ; `mockImplementation` çağrının ARGÜMANINA BAKARAK doğru sütuna doğru veriyi VERMEYİ sağlıyor. `refetch` alanı eksik olsaydı, `handlePair`\'in başarı dalındaki `refetchGerman()`/`refetchTurkish()` çağrıları `undefined is not a function` hatasıyla ÇÖKERDİ.',
            olmasaydi: 'Sabit bir `mockReturnValue` kullanılsaydı, Almanca VE Türkçe sütunları AYNI listeyi (ör. ikisi de `germanItems`) gösterirdi — test "her iki sütun da eşleşmemiş kelimeleri LİSTELER" iddiasını GERÇEKTEN doğrulamazdı, yanlışlıkla YEŞİL geçebilirdi. `refetch: vi.fn()` eksik bırakılsaydı, "mutlu yol eşleştirme" testi `pairTrigger` başarıyla ÇÖZÜLSE bile component\'in kendi `refetch` çağrısında ÇÖKÜP kırmızı geçerdi.'
          },
          {
            satir: "const fakatRow = screen.getByText('fakat').closest('button')!",
            aciklama: '`closest(\'button\')` — metni İÇEREN elementten (bir `<span>`) yukarı doğru en YAKIN `<button>` ata elementini bulur, çünkü asıl kontrol edilecek "Önerilen eşleşme" rozeti o BUTONUN İÇİNDE.',
            neden: 'RTL\'in "kullanıcı gibi ara" felsefesi (B-02\'de tanıtıldı) metni `getByText` ile BULUR ama o metnin HANGİ interaktif elementin PARÇASI olduğunu bilmek için DOM ağacında YUKARI çıkmak gerekiyor.',
            olmasaydi: '`.closest(\'button\')` olmadan doğrudan `screen.getByText(\'fakat\')` üzerinde `toHaveTextContent` çağrılsaydı, bu yalnızca "fakat" METNİNİ TAŞIYAN `<span>`\'i kontrol ederdi — o `<span>`\'in YANINDAKİ (kardeş) rozet elementi bu kontrolün DIŞINDA kalırdı.'
          }
        ]
      },
      {
        tur: 'sozluk',
        baslik: 'Geri Kalan Üç Test Dosyası — Aynı Deseni İzliyor',
        terimler: [
          { terim: 'WordFormModal.test.tsx (4 test)', tanim: '`useCreateWordMutation`/`useUpdateWordMutation`/`useGetCategoriesQuery` mock\'lanır — mutation mock\'ları artık `.mockResolvedValue({})` ile düz bir Promise döndürüyor (`.unwrap()` deseni YOK). Varsayılan Almanca+İsim seçiliyken Almanca gramer alanlarının render EDİLDİĞİ, dil Türkçe\'ye çevrilince Türkçe alanlarının (ve YALNIZCA onların) göründüğü, Tür "Diğer" seçilince gramer bölümünün HİÇ render EDİLMEDİĞİ, ve mutlu yol submit\'in `createTrigger`\'ı doğru payload\'la ÇAĞIRDIĞI test edilir.' },
          { terim: 'WordListPage.test.tsx (4 test)', tanim: '`useGetWordsQuery`/`useGetWordByIdQuery`/`useDeleteWordMutation` mock\'lanır — `useGetWordsQuery`\'nin mock dönüşü artık BİR de `refetch: vi.fn()` alanı TAŞIYOR (component silme/kaydetme sonrası bunu ÇAĞIRIYOR). GERÇEK bir `wordFilterSlice` reducer\'ıyla KURULMUŞ küçük bir Redux store `<Provider>` ile SARILIR (LoginPage\'in aksine — bu component `useSelector`/`useDispatch`\'e bağlı). Liste render, "Eşleşmemiş" rozeti, arama YAZINCA `search` parametresiyle YENİDEN sorgulama, ve seviye filtresi değişince sayfanın 1\'e DÖNDÜĞÜ test edilir.' },
          { terim: 'WordPairingPage.test.tsx (4 test — TAMAMI bu bölümde GÖSTERİLDİ)', tanim: '"her iki sütun da eşleşmemiş kelimeleri LİSTELER", önerilen eşleşme vurgusu, mutlu yol eşleştirme (varsayılan birincil İLK seçilen taraf), ve "birincil tarafı değiştir" testleri.' },
          { terim: 'wordFilterSlice.test.ts (7 test)', tanim: 'API hook\'u YOK, gerçek bir `wordFilterReducer` üzerinde SAF reducer testleri — beş "değiştir" eyleminin HEPSİNİN sayfayı 1\'e döndürdüğü, `setPage`\'in filtreleri KORUDUĞU, `resetWordFilters`\'ın TÜM state\'i başlangıca DÖNDÜRDÜĞÜ.' },
          { terim: 'Toplam', tanim: 'B-03 4 (WordFormModal) + 4 (WordListPage) + 4 (WordPairingPage) + 7 (wordFilterSlice) = 19 YENİ test EKLEDİ — B-02\'nin 5 testiyle (authSlice 3 + LoginPage 2) BİRLİKTE admin panelde **24/24 yeşil**.' }
        ]
      },
      {
        tur: 'ozet',
        baslik: 'Bu Bölümde Öğrendiklerimiz',
        maddeler: [
          'Dört test dosyası, B-02\'nin API-hook-mock\'lama desenini AYNEN sürdürüyor — hiçbir test GERÇEK ağ isteği ATMIYOR',
          'Mutation mock\'ları artık `.mockResolvedValue(...)`/`.mockRejectedValue(...)` — RTK Query döneminin `.mockReturnValue({unwrap: ...})` deseni `.unwrap()`\'ın kalkmasıyla BİRLİKTE tamamen KALKTI',
          'Sorgu mock\'ları artık BİR `refetch: vi.fn()` alanı da TAŞIYOR — component\'lerin mutation SONRASI çağırdığı `refetch()`\'in test ortamında ÇÖKMEDEN çalışması için',
          '`mockImplementation` (argümana göre farklı sonuç) `mockReturnValue`\'dan (sabit sonuç) FARKLI kullanılıyor — `WordPairingPage`\'in İKİ farklı `languageId`\'yle çağrılan TEK hook\'unu doğru test etmek İÇİN',
          '`WordListPage.test.tsx` GERÇEK bir Redux store kuruyor (`configureStore`) — `useSelector`/`useDispatch`\'e bağlı component\'ler için mock YETERSİZ',
          '24/24 test yeşil — Bölüm 12\'de bu feature\'ın GERÇEK bir tarayıcıda, GERÇEK bir backend\'e karşı NASIL doğrulandığı anlatılıyor'
        ]
      }
    ]
  };
</script>
