        neden: 'Backend bu çakışmayı ASLA bir hata/onay diyaloğuyla ENGELLEMİYOR — dillerarası tür/seviye kayması bilinçli olarak NORMAL kabul EDİLİYOR (iki dilin AYNI kavramı farklı bağlamlarda hafifçe farklı sınıflandırması gerçek bir dil olgusu, HATA değil) — bu yüzden admin panelin KENDİSİ hangi tarafın KAZANACAĞINI AÇIKÇA seçtirmek zorunda, aksi hâlde hangi taraf "kazandığı" admin\'e HİÇ görünmeyen bir backend detayı OLURDU.',

      {
        tur: 'kod',
        baslik: 'WordPairingPage.tsx — UnmatchedColumn: Paylaşılan Sunum Component\'i',
        dosyaYolu: 'admin/src/components/words/WordPairingPage.tsx',
        nedenBuKlasor: '`components/words/` — B-03\'ün SON büyük component\'i, `wordsApi`\'nin `getUnmatchedWordConcepts`/`pairWordConcepts` uçlarını KULLANAN tek yer.',
        kod: `import { useState } from 'react'
import { useTranslation } from 'react-i18next'
import { useGetLanguagesQuery } from '../../store/api/languagesApi'
import { useGetUnmatchedWordConceptsQuery, usePairWordConceptsMutation } from '../../store/api/wordsApi'
import { getApiErrorMessage } from '../../lib/apiError'
import type { UnmatchedWordConcept } from '../../types/word.types'

interface SelectionState {
  de: number | null
  tr: number | null
  // İşlemi hangi taraftan başlattıysa (Icerik.md "Eşleştirme") o taraf varsayılan birincil olur —
  // admin isterse aşağıdaki "birincil tarafı değiştir" ile karşı tarafa çevirebilir.
  primary: 'de' | 'tr' | null
}

// İki sütun da AYNI şekilde davranır (ara, listele, seç) — dumb/controlled bir component,
// veri çekme sorumluluğu üst bileşende (WordPairingPage tek bir yerden iki sorguyu yönetir).
function UnmatchedColumn({
  title,
  search,
  onSearchChange,
  items,
  isLoading,
  selectedId,
  highlightId,
  onSelect,
}: {
  title: string
  search: string
  onSearchChange: (value: string) => void
  items: UnmatchedWordConcept[] | undefined
  isLoading: boolean
  selectedId: number | null
  highlightId: number | null
  onSelect: (concept: UnmatchedWordConcept) => void
}) {
  const { t } = useTranslation()

  return (
    <div className="flex-1 rounded-card border border-border bg-surface p-3">
      <h2 className="mb-2 font-heading text-sm font-bold text-text">{title}</h2>
      <input
        type="text"
        value={search}
        onChange={(e) => onSearchChange(e.target.value)}
        placeholder={t('words.pairing.search') ?? undefined}
        className="mb-2 w-full rounded-control border border-border bg-background px-2 py-1 text-sm text-text"
      />
      {isLoading && <p className="text-sm text-muted">{t('words.list.loading')}</p>}
      {!isLoading && (!items || items.length === 0) && <p className="text-sm text-muted">{t('words.pairing.empty')}</p>}
      <ul className="flex max-h-96 flex-col gap-1 overflow-y-auto">
        {items?.map((concept) => {
          const isSelected = selectedId === concept.wordConceptId
          const isSuggested = highlightId === concept.wordConceptId
          return (
            <li key={concept.wordConceptId}>
              <button
                type="button"
                onClick={() => onSelect(concept)}
                className={\`w-full rounded-control border px-2 py-1 text-left text-sm \${
                  isSelected
                    ? 'border-primary bg-primary/10 text-text'
                    : isSuggested
                      ? 'border-primary/50 bg-primary/5 text-text'
                      : 'border-border text-text hover:bg-background'
                }\`}
              >
                <span className="font-medium">{concept.text}</span>
                {concept.definition && <span className="ml-1 text-xs text-muted">— {concept.definition}</span>}
                {isSuggested && (
                  <span className="ml-2 rounded-control bg-primary/20 px-1 text-xs text-primary">
                    {t('words.pairing.suggested')}
                  </span>
                )}
              </button>
            </li>
          )
        })}
      </ul>
    </div>
  )
}`,
        satirlar: [
          {
            satir: 'function UnmatchedColumn({',
            aciklama: '"Aptal" (dumb/presentational) bir component — kendi VERİ ÇEKME mantığı YOK, tüm veriyi (`items`/`isLoading`) VE davranışı (`onSearchChange`/`onSelect`) PROP olarak alıyor.',
            neden: 'İki sütun (Almanca/Türkçe) GÖRSEL olarak birebir AYNI davranıyor — arama kutusu, liste, seçili/önerilen vurgusu. Bu ORTAKLIĞI TEK bir component\'te yakalamak, İKİ AYRI ("GermanColumn"/"TurkishColumn") component yazmaktan DAHA az tekrar İÇERİYOR.',
            olmasaydi: 'İki ayrı sütun component\'i yazılsaydı, "önerilen eşleşme" vurgusunun RENGİ/rozeti gibi bir GÖRSEL düzeltme İKİ dosyada AYRI AYRI yapılırdı — bu bölümün başlığındaki karşılaştırma slaydında GÖRECEĞİMİZ gibi, veri ÇEKME sorumluluğunu bu component\'e VERMEK de AYRI bir hataydı (aşağıdaki `karsilastirma` slaydı).'
          },
          {
            satir: "className={\`w-full rounded-control border px-2 py-1 text-left text-sm \${\n                  isSelected\n                    ? 'border-primary bg-primary/10 text-text'\n                    : isSuggested\n                      ? 'border-primary/50 bg-primary/5 text-text'\n                      : 'border-border text-text hover:bg-background'\n                }\`}",
            aciklama: 'ÜÇ görsel durum — SEÇİLİ (koyu vurgulu), ÖNERİLEN (hafif vurgulu, henüz seçilmemiş), NORMAL — tek bir `className` şablon string\'inde İÇ İÇE (nested) bir üçlü operatör ile karar veriliyor.',
            neden: '`isSelected` kontrolü `isSuggested`\'DAN ÖNCE geliyor — bir satır HEM seçili HEM önerilen OLABİLİR (admin önerilen satırı GERÇEKTEN seçtiyse), bu durumda "seçili" görünümü KAZANMALI, "sadece öneri" görünümüne GERİ DÜŞMEMELİ.',
            olmasaydi: 'Sıra TERS olsaydı (`isSuggested` önce kontrol edilseydi), admin önerilen bir satırı SEÇTİĞİNDE o satır HÂLÂ "yalnızca öneri" gibi (soluk) GÖRÜNÜRDÜ — admin\'in TIKLAMASININ bir etkisi OLMADIĞI YANILGISINA düşülürdü.'
          }

      {
        tur: 'kod',
        baslik: 'WordPairingPage.tsx — Seçim Mantığı + Eşleştirme',
        dosyaYolu: 'admin/src/components/words/WordPairingPage.tsx',
        nedenBuKlasor: 'Aynı dosya, `UnmatchedColumn`\'un HEMEN altında — asıl sayfa component\'i, iki sorguyu (`getUnmatchedWordConcepts` × 2) ve TEK mutation\'ı (`pairWordConcepts`) yönetiyor.',
        kod: `export function WordPairingPage() {
  const { t } = useTranslation()
  const { data: languages } = useGetLanguagesQuery()
  const germanId = languages?.find((l) => l.code === 'de')?.id
  const turkishId = languages?.find((l) => l.code === 'tr')?.id

  const [germanSearch, setGermanSearch] = useState('')
  const [turkishSearch, setTurkishSearch] = useState('')
  const {
    data: germanData,
    isLoading: isGermanLoading,
    refetch: refetchGerman,
  } = useGetUnmatchedWordConceptsQuery(
    { languageId: germanId ?? 0, search: germanSearch || undefined, pageSize: 50 },
    { skip: germanId === undefined },
  )
  const {
    data: turkishData,
    isLoading: isTurkishLoading,
    refetch: refetchTurkish,
  } = useGetUnmatchedWordConceptsQuery(
    { languageId: turkishId ?? 0, search: turkishSearch || undefined, pageSize: 50 },
    { skip: turkishId === undefined },
  )

  const [selection, setSelection] = useState<SelectionState>({ de: null, tr: null, primary: null })
  const [pairWordConcepts, { isLoading: isPairing }] = usePairWordConceptsMutation()
  const [error, setError] = useState<string | null>(null)

  // Seçili Almanca kavramın önerdiği eşleşme (varsa) Türkçe sütununda vurgulanır.
  const suggestedTrId =
    selection.de !== null
      ? (germanData?.items.find((c) => c.wordConceptId === selection.de)?.suggestedMatchConceptId ?? null)
      : null

  const selectSide = (side: 'de' | 'tr', concept: UnmatchedWordConcept) => {
    setError(null)
    setSelection((prev) => {
      if (prev[side] === concept.wordConceptId) {
        // Aynı satıra tekrar tıklamak seçimi kaldırır.
        const otherSide = side === 'de' ? 'tr' : 'de'
        return { ...prev, [side]: null, primary: prev.primary === side ? (prev[otherSide] ? otherSide : null) : prev.primary }
      }
      const isFirstSelection = prev.de === null && prev.tr === null
      return { ...prev, [side]: concept.wordConceptId, primary: isFirstSelection ? side : prev.primary }
    })
  }

  const swapPrimary = () => {
    setSelection((prev) => (prev.primary === 'de' ? { ...prev, primary: 'tr' } : { ...prev, primary: 'de' }))
  }

  const canPair = selection.de !== null && selection.tr !== null && selection.primary !== null

  const handlePair = async () => {
    if (!canPair) return
    const primaryId = selection.primary === 'de' ? selection.de! : selection.tr!
    const otherConceptId = selection.primary === 'de' ? selection.tr! : selection.de!
    try {
      await pairWordConcepts({ primaryId, otherConceptId })
      setSelection({ de: null, tr: null, primary: null })
      refetchGerman()
      refetchTurkish()
    } catch (err) {
      setError(getApiErrorMessage(err) ?? t('auth.genericError'))
    }
  }`,
        satirlar: [
          {
            satir: "{ skip: germanId === undefined },",
            aciklama: '`getUnmatchedWordConcepts` sorgusu, `germanId` HENÜZ gelmediyse (`getLanguages` sorgusu henüz dönmediyse) `skip:true` ile HİÇ ÇALIŞTIRILMIYOR.',
            neden: '`languageId: germanId ?? 0` ifadesi `germanId` `undefined` iken `0` GÖNDERİRDİ — backend `languageId=0` için ANLAMLI bir sonuç DÖNMEZ (böyle bir dil YOK), bu yüzden bu isteği baştan HİÇ atmamak, geçersiz bir isteği atıp SONRA boş sonuçla UĞRAŞMAKTAN daha TEMİZ.',
            olmasaydi: '`skip` olmasaydı, sayfa AÇILIR AÇILMAZ (dil listesi henüz gelmeden) `languageId=0` ile bir istek GİDERDİ — bu istek muhtemelen BOŞ bir sonuç dönerdi, dil listesi geldiğinde İKİNCİ bir istek GEREKİRDİ (gereksiz bir AĞ çağrısı FAZLADAN).'
          },
          {
            satir: "if (prev[side] === concept.wordConceptId) {",
            aciklama: 'Aynı satıra İKİNCİ kez tıklamak, o tarafın seçimini KALDIRIR — bir "toggle" davranışı, yalnızca "seç" değil "seç/kaldır".',
            neden: 'Admin YANLIŞLIKLA bir satıra tıklayıp fikrini DEĞİŞTİREBİLİR — eğer TEK yönlü bir "seç" davranışı olsaydı, admin\'in seçimi İPTAL etmesinin TEK yolu SAYFAYI YENİLEMEK olurdu.',
            olmasaydi: 'Toggle davranışı OLMASAYDI, yanlışlıkla "aber"e tıklayan bir admin o seçimi KALDIRAMAZDI (başka bir Almanca satıra tıklamak SEÇİMİ değiştirirdi ama "hiçbir şey seçme" durumuna DÖNMEK mümkün olmazdı).'
          },
          {
            satir: "const primaryId = selection.primary === 'de' ? selection.de! : selection.tr!",
            aciklama: '`selection.de!`/`selection.tr!` — non-null assertion, çünkü bu satır YALNIZCA `canPair` true İKEN (yani İKİSİ de dolu iken) ÇAĞRILIYOR (`handlePair`\'in İLK satırı `if (!canPair) return`).',
            neden: '`canPair` KONTROLÜ TypeScript\'e `selection.de`/`selection.tr`\'nin bu NOKTADA dolu OLDUĞUNU otomatik ÇIKARTAMIYOR (ayrı bir DEĞİŞKENDEN hesaplanmış bir bayrak) — assertion bilinen ama derleyicinin GÖREMEDİĞİ bu garantiyi ELLE belirtiyor.',
            olmasaydi: '`!` yazılmasaydı, TypeScript bu İKİ satırı `selection.de`/`selection.tr` `null` OLABİLİR diye REDDEDERDİ — `canPair` kontrolü ZATEN bu ihtimali dıştaladığı için assertion GÜVENLİ.'
          },
          {
            satir: 'refetchGerman()\n      refetchTurkish()',
            aciklama: 'RTK Query\'nin `invalidatesTags: [{type:\'Word\',id:\'LIST\'}, {type:\'Word\',id:\'UNMATCHED\'}]`\'ının yerini, eşleştirme BAŞARILI olduktan SONRA çağrılan bu iki `refetch()` fonksiyonu aldı — HER İKİ sütun da AYRI AYRI yeniden sorgulanıyor.',
            neden: 'Bir eşleştirme İKİ sorguyu (Almanca+Türkçe unmatched listesi) AYNI ANDA ETKİLİYOR — artık bunu OTOMATİK bir tag sistemi ÇÖZMÜYOR (Bölüm 2), `WordPairingPage`\'in KENDİSİ "eşleştirme başarılıysa HANGİ sorguların bayatladığını" BİLİYOR ve İKİSİNİ de elle tetikliyor.',
            olmasaydi: 'Yalnızca `refetchGerman()` çağrılsaydı (ya da HİÇBİRİ), Türkçe sütunu eşleşen kavramı LİSTEDE TUTMAYA devam ederdi — admin AYNI kavramı YANLIŞLIKLA İKİNCİ bir Almanca kelimeyle TEKRAR eşleştirmeye ÇALIŞABİLİRDİ, backend bunu reddetse bile bu KAFA KARIŞTIRICI bir deneyim olurdu.'
          }
        ]
      },
      {
        tur: 'kod',
        baslik: 'WordPairingPage.tsx — Render: İki Sütun + Birincil Taraf Paneli',
        dosyaYolu: 'admin/src/components/words/WordPairingPage.tsx',
        nedenBuKlasor: 'Aynı dosya, bir önceki slaytta görülen mantığın (`selectSide`/`swapPrimary`/`canPair`/`handlePair`) HEMEN altında — component\'in bu mantığı KULLANARAK gerçekte NE gösterdiği, yani state\'in ekranda nasıl bir arayüze dönüştüğü.',
        kod: `  return (
    <div className="flex flex-col gap-4">
      <h1 className="font-heading text-xl font-bold text-text">{t('words.pairing.title')}</h1>

      {error && (
        <p role="alert" className="rounded-control bg-destructive/10 px-3 py-2 text-sm text-destructive">
          {error}
        </p>
      )}

      <div className="flex flex-col gap-4 sm:flex-row">
        <UnmatchedColumn
          title={t('words.pairing.germanColumn')}
          search={germanSearch}
          onSearchChange={setGermanSearch}
          items={germanData?.items}
          isLoading={isGermanLoading}
          selectedId={selection.de}
          highlightId={null}
          onSelect={(concept) => selectSide('de', concept)}
        />
        <UnmatchedColumn
          title={t('words.pairing.turkishColumn')}
          search={turkishSearch}
          onSearchChange={setTurkishSearch}
          items={turkishData?.items}
          isLoading={isTurkishLoading}
          selectedId={selection.tr}
          highlightId={suggestedTrId}
          onSelect={(concept) => selectSide('tr', concept)}
        />
      </div>

      {selection.de !== null && selection.tr !== null && (
        <div className="rounded-card border border-border bg-surface p-3">
          <p className="mb-2 text-sm text-text">
            {t('words.pairing.primarySide')}: <strong>{t(\`words.language.\${selection.primary}\`)}</strong>
          </p>
          <button
            type="button"
            onClick={swapPrimary}
            className="mr-2 rounded-control border border-border px-3 py-1 text-sm text-text hover:bg-background"
          >
            {t('words.pairing.swapPrimary')}
          </button>
          <button
            type="button"
            onClick={handlePair}
            disabled={!canPair || isPairing}
            className="rounded-control bg-primary px-4 py-1 text-sm font-semibold text-white disabled:opacity-60"
          >
            {t('words.pairing.pairButton')}
          </button>
        </div>
      )}
    </div>
  )
}`,
        satirlar: [
          {
            satir: '{selection.de !== null && selection.tr !== null && (',
            aciklama: '"Birincil taraf" paneli (değiştir/eşleştir butonları) YALNIZCA her iki taraf da (Almanca VE Türkçe) seçiliyken render EDİLİYOR — tek taraf seçiliyken bu blok hiç DOM\'a girmiyor.',
            neden: 'Eşleştirme işlemi (`handlePair`) iki tarafın da DOLU olmasını zorunlu kılıyor (`canPair` kontrolü) — panel daha ortada bir eşleşme adayı yokken görünseydi, admin "birincil taraf: —" gibi anlamsız bir metinle VE erken tıklanabilir ama işe yaramayan bir butonla karşılaşırdı.',
            olmasaydi: 'Koşullu render OLMASAYDI, admin henüz tek satır seçmişken bile alt panel görünürdü — "Eşleştir" butonuna erken tıklayan bir admin ya sessiz bir no-op\'la ya da beklenmedik bir davranışla karşılaşırdı, çünkü `canPair` o an zaten false.'

            neden: '`pairWordConcepts` bir ağ isteği — admin butona art arda birden çok kez tıklayabilir, `isPairing` true iken butonu kilitlemek AYNI eşleştirmenin iki kez ÇAKIŞAN istekle gönderilmesini engelliyor.',
            olmasaydi: '`isPairing` kontrolü OLMASAYDI, yavaş bir bağlantıda admin butona iki kez tıklarsa iki ayrı `pairWordConcepts` isteği aynı anda GİDERDİ — ikincisi muhtemelen "zaten eşleşmiş" hatasıyla dönerdi, admin\'e gereksiz bir hata mesajı GÖSTERİRDİ.'

            neden: '`primary` zaten `de`/`tr` iki değerinden birini TUTUYOR — bu değeri doğrudan çeviri anahtarının parçası yapmak, "hangi taraf birincilse onun adını yaz" mantığını if/else\'e hiç düşmeden TEK satırda çözüyor.',
            olmasaydi: 'Dinamik anahtar yerine `selection.primary === \'de\' ? t(\'words.language.de\') : t(\'words.language.tr\')` gibi bir dallanma yazılsaydı, üçüncü bir dil eklendiğinde bu satırın da AYRICA güncellenmesi gerekirdi — dinamik anahtar yeni bir dilde de HİÇ değişmeden çalışmaya devam eder.'

        },

          maddeler: [

          ]
        }
      },
