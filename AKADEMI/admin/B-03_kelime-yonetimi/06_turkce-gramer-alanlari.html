<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TurkishGrammarFields.tsx</title>
<link rel="stylesheet" href="../engine/slides.css" />
</head>
<body>
<div id="app"></div>
<script>
  window.MODULE = {
    id: 'b03-turkce-gramer',
    bolumBaslik: 'B-03 — Kelime Yönetimi',
    oncekiBolum: '05_alman-gramer-alanlari.html',
    sonrakiBolum: '07_ornek-cumle-kategori-secici.html',
    slaytlar: [
      {
        tur: 'kapak',
        ustBaslik: 'BÖLÜM 6',
        baslik: 'TurkishGrammarFields.tsx',
        altBaslik: 'Türkçe İsim (çoğul+6 hâl+ünlü uyumu+iyelik) ve Fiil (kök+olumsuzluk+5 zaman×6 kişi çekim) — Almanca\'dan KÖKTEN farklı bir gramer sistemi, aynı `ConjugationGrid`\'i yeniden kullanarak.'
      },
      {
        tur: 'kod',
        baslik: 'TurkishGrammarFields.tsx — İsim Dalı: Çoğul + Ünlü Uyumu + Hâller',
        dosyaYolu: 'admin/src/components/words/TurkishGrammarFields.tsx',
        nedenBuKlasor: '`components/words/` — `GermanGrammarFields`\'ın YANINDA, `WordFormModal`\'ın Bölüm 4\'teki `languageCode === \'tr\'` dalının render ettiği alt component.',
        kod: `import { useTranslation } from 'react-i18next'
import { ConjugationGrid } from './ConjugationGrid'
import type { PartOfSpeech, TurkishNounGrammarData, TurkishVerbGrammarData } from '../../types/word.types'

// TURKISH_LANGUAGE_FEATURES.md §9'un TS karşılığı — backend WordGrammarValidator'ın tr dalıyla
// (A-05 + A-05.2 retrofit'i: vowelHarmony/possessive zorunlu) AYNI matris, kod paylaşımı yok.
// Yalnızca GrammarData JSON alan adları — GÖSTERİLEN etiketler i18n'den (words.grammar.tr.*Labels)
// gelir (CLAUDE.md §1: admin panelin kendi statik metinleri react-i18next ile tr/de çevrilir).
const TR_VERB_TENSE_KEYS = ['presentContinuous', 'aorist', 'pastDefinite', 'pastNarrative', 'future'] as const
const TR_PERSON_KEYS = ['ben', 'sen', 'o', 'biz', 'siz', 'onlar'] as const
const TR_CASE_KEYS = ['nominative', 'accusative', 'dative', 'locative', 'ablative', 'genitive'] as const

interface TurkishGrammarFieldsProps {
  partOfSpeech: PartOfSpeech
  value: TurkishNounGrammarData | TurkishVerbGrammarData | undefined
  onChange: (value: TurkishNounGrammarData | TurkishVerbGrammarData) => void
}

export function TurkishGrammarFields({ partOfSpeech, value, onChange }: TurkishGrammarFieldsProps) {
  const { t } = useTranslation()

  if (partOfSpeech === 'Noun') {
    const noun = value as TurkishNounGrammarData | undefined
    const setField = (patch: Partial<TurkishNounGrammarData>) =>
      onChange({
        plural: '',
        cases: { nominative: '', accusative: '', dative: '', locative: '', ablative: '', genitive: '' },
        vowelHarmony: 'kalın',
        possessive: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },
        ...noun,
        ...patch,
      })

    return (
      <div className="flex flex-col gap-3">
        <div>
          <label className="mb-1 block text-sm font-medium text-text">
            {t('words.grammar.tr.plural')} <span className="text-destructive">*</span>
          </label>
          <input
            type="text"
            value={noun?.plural ?? ''}
            onChange={(e) => setField({ plural: e.target.value })}
            className="w-full rounded-control border border-border bg-background px-3 py-2 text-sm text-text"
          />
        </div>
        <div>
          <label className="mb-1 block text-sm font-medium text-text">
            {t('words.grammar.tr.vowelHarmony')} <span className="text-destructive">*</span>
          </label>
          <select
            value={noun?.vowelHarmony ?? 'kalın'}
            onChange={(e) => setField({ vowelHarmony: e.target.value as TurkishNounGrammarData['vowelHarmony'] })}
            className="w-full rounded-control border border-border bg-background px-3 py-2 text-sm text-text"
          >
            <option value="kalın">{t('words.grammar.tr.vowelHarmonyThick')}</option>
            <option value="ince">{t('words.grammar.tr.vowelHarmonyThin')}</option>
          </select>
        </div>
        <div>
          <p className="mb-1 text-sm font-medium text-text">
            {t('words.grammar.tr.cases')} <span className="text-destructive">*</span>
          </p>
          <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
            {TR_CASE_KEYS.map((caseKey) => (
              <div key={caseKey}>
                <label className="mb-1 block text-xs text-muted">{t(\`words.grammar.tr.caseLabels.\${caseKey}\`)}</label>
                <input
                  type="text"
                  value={noun?.cases?.[caseKey] ?? ''}
                  onChange={(e) => setField({ cases: { ...noun?.cases, [caseKey]: e.target.value } as TurkishNounGrammarData['cases'] })}
                  className="w-full rounded-control border border-border bg-background px-2 py-1 text-sm text-text"
                />
              </div>
            ))}
          </div>
        </div>
        <div>
          <p className="mb-1 text-sm font-medium text-text">
            {t('words.grammar.tr.possessive')} <span className="text-destructive">*</span>
          </p>
          <div className="grid grid-cols-2 gap-2 sm:grid-cols-3">
            {TR_PERSON_KEYS.map((person) => (
              <div key={person}>
                <label className="mb-1 block text-xs text-muted">{t(\`words.grammar.tr.personLabels.\${person}\`)}</label>
                <input
                  type="text"
                  value={noun?.possessive?.[person] ?? ''}
                  onChange={(e) =>
                    setField({ possessive: { ...noun?.possessive, [person]: e.target.value } as TurkishNounGrammarData['possessive'] })
                  }
                  className="w-full rounded-control border border-border bg-background px-2 py-1 text-sm text-text"
                />
              </div>
            ))}
          </div>
        </div>`,
        satirlar: [
          {
            satir: "vowelHarmony: 'kalın' | 'ince'",
            aciklama: 'Türkçe\'ye ÖZGÜ bir kavram — Almanca\'nın gramerinde KARŞILIĞI bile YOK, bu yüzden `GermanNounGrammarData`\'da bu alan HİÇ görünmez.',
            neden: 'A-05.2 retrofit\'i öncesi bu alan backend tarafında ZORUNLU değildi (A-05\'in bilinçli bir kararı), ama bir isim kartının GÖRSEL tasarımı ünlü uyumunu isim kartının AYRILMAZ parçası SAYIYORDU — bu tutarsızlık fark edilip backend\'de `vowelHarmony` ZORUNLU kılındı, admin panel de o zorunluluğu (kırmızı `*`) YANSITIYOR.',
            olmasaydi: 'Bu alan hâlâ opsiyonel OLSAYDI, bir admin ünlü uyumunu BOŞ bırakıp kaydedebilirdi — sonradan bu veriyi OKUYACAK herhangi bir öğrenme/quiz özelliği o kelime İÇİN eksik bir alanla KARŞILAŞIRDI, hangi kayıtların TAMAM hangilerinin EKSİK olduğunu ayrıca KONTROL ETMESİ gerekirdi.'
          },
          {
            satir: "{TR_PERSON_KEYS.map((person) => (",
            aciklama: 'İyelik ekleri (`possessive`) altı kişi için AYRI AYRI metin girişleri — çekim tablosu GİBİ görünse de `ConjugationGrid` KULLANILMIYOR, çünkü burada "zaman" boyutu YOK, yalnızca tek boyutlu bir kişi listesi.',
            neden: 'Backend `WordGrammarValidator`\'daki `HasAllPossessiveFields` kontrolü de AYNI ayrımı yapıyor — `HasAllConjugationCells` (iki katmanlı: zaman+kişi) DEĞİL, TEK katmanlı bir kontrol; admin tarafında da bu YAPISAL farkı `ConjugationGrid`\'e ZORLA sığdırmak yerine düz bir `.map()` ile göstermek DAHA DOĞRU bir eşleşme.',
            olmasaydi: 'İyelik ekleri `ConjugationGrid`\'e sıkıştırılsaydı (ör. tek satırlı sahte bir "zaman"la), `ConjugationGrid`\'in generic tipleri (`TTense`/`TPerson` İKİSİ de gerekli) ANLAMSIZ bir "tek zamanlı tablo" ÜRETİRDİ — bu, component\'in KENDİ amacını (çok boyutlu çekim) BULANIKLAŞTIRIRDI.'
          }
        ]
      },
      {
        tur: 'kod',
        baslik: 'TurkishGrammarFields.tsx — consonantMutation: Bilinçli Olarak Opsiyonel',
        dosyaYolu: 'admin/src/components/words/TurkishGrammarFields.tsx',
        nedenBuKlasor: 'Aynı dosya, isim dalının SONUNDA — `possessive` bloğunun HEMEN altında, kaydın son alanı.',
        kod: `        {/* A-05.2: consonantMutation bilinçli olarak opsiyonel/doğrulanmamış (§8'deki henüz
            yazılmamış quiz özelliği için) — WordGrammarValidator bunu hiç kontrol etmiyor. */}
        <div>
          <label className="flex items-center gap-2 text-sm font-medium text-text">
            <input
              type="checkbox"
              checked={noun?.consonantMutation?.hasChange ?? false}
              onChange={(e) =>
                setField({
                  consonantMutation: e.target.checked
                    ? { hasChange: true, pattern: noun?.consonantMutation?.pattern ?? '', example: noun?.consonantMutation?.example ?? '' }
                    : undefined,
                })
              }
            />
            {t('words.grammar.tr.consonantMutation')}
            <span className="text-xs text-muted">({t('words.grammar.optional')})</span>
          </label>
          {noun?.consonantMutation?.hasChange && (
            <div className="mt-2 grid grid-cols-2 gap-2">
              <input
                type="text"
                placeholder={t('words.grammar.tr.consonantMutationPattern') ?? undefined}
                value={noun.consonantMutation.pattern}
                onChange={(e) => setField({ consonantMutation: { ...noun.consonantMutation!, pattern: e.target.value } })}
                className="rounded-control border border-border bg-background px-2 py-1 text-sm text-text"
              />
              <input
                type="text"
                placeholder={t('words.grammar.tr.consonantMutationExample') ?? undefined}
                value={noun.consonantMutation.example}
                onChange={(e) => setField({ consonantMutation: { ...noun.consonantMutation!, example: e.target.value } })}
                className="rounded-control border border-border bg-background px-2 py-1 text-sm text-text"
              />
            </div>
          )}
        </div>`,
        satirlar: [
          {
            satir: '<span className="text-xs text-muted">({t(\'words.grammar.optional\')})</span>',
            aciklama: 'Diğer TÜM gramer alanları kırmızı `*` taşırken bu alan GRİ "(opsiyonel)" etiketi taşıyor — formun İÇİNDE görsel olarak da AÇIKÇA farklı işaretlenen TEK gramer alanı.',
            neden: 'Bu alanı ŞU AN okuyan/doğrulayan hiçbir kod yok — backend `WordGrammarValidator`\'ın `ValidateTurkish` dalı bu alana HİÇ bakmıyor. Zorunlu İŞARETLEMEK, admin\'e backend\'in ASLA kontrol etmeyeceği bir alanı DOLDURMASI gerektiği YALANINI söylemek olurdu.',
            olmasaydi: 'Bu alan da `*` ile işaretlenseydi, bir admin onu boş bırakıp kaydettiğinde HİÇBİR hata ALMAZDI (backend zaten kontrol etmiyor) — ama yıldız işareti "bu ZORUNLU" diye bir BEKLENTİ yaratmış olurdu, form GERÇEKTE tutmadığı bir SÖZ vermiş olurdu.'
          },
          {
            satir: "onChange({ consonantMutation: { ...noun.consonantMutation!, pattern: e.target.value } })",
            aciklama: '`noun.consonantMutation!` — non-null assertion, çünkü bu satır YALNIZCA `noun?.consonantMutation?.hasChange` true İKEN (yani `consonantMutation` KESİNLİKLE dolu iken) render EDİLİYOR.',
            neden: 'JSX\'teki `{noun?.consonantMutation?.hasChange && (...)}` KOŞULU TypeScript\'e `noun.consonantMutation`\'ın bu blok İÇİNDE dolu OLDUĞUNU otomatik ÇIKARTAMIYOR (optional chaining zinciri bir SONRAKİ render\'da tekrar HESAPLANIYOR) — assertion bu bilinen ama derleyicinin GÖREMEDİĞİ garantiyi ELLE belirtiyor.',
            olmasaydi: '`!` yazılmasaydı, TypeScript `noun.consonantMutation` `undefined` OLABİLİR diye bu satırı REDDEDERDİ — kod ya EK bir `if` sarmalayıcısıyla ya da bu assertion\'la yazılabilirdi, JSX\'in KOŞULU zaten aynı garantiyi SAĞLADIĞI için assertion tercih edildi.'
          }
        ]
      },
      {
        tur: 'kod',
        baslik: 'TurkishGrammarFields.tsx — Fiil Dalı: Kök + Olumsuzluk + 5 Zamanlı Çekim',
        dosyaYolu: 'admin/src/components/words/TurkishGrammarFields.tsx',
        nedenBuKlasor: 'Aynı dosya, `partOfSpeech === \'Verb\'` dalı — isim dalının bittiği yerin HEMEN altında.',
        kod: `  // partOfSpeech === 'Verb'
  const verb = value as TurkishVerbGrammarData | undefined
  const setVerbField = (patch: Partial<TurkishVerbGrammarData>) =>
    onChange({
      verbRoot: '',
      negativeForm: '',
      conjugation: {
        presentContinuous: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },
        aorist: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },
        pastDefinite: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },
        pastNarrative: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },
        future: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },
      },
      ...verb,
      ...patch,
    })

  return (
    <div className="flex flex-col gap-3">
      <div>
        <label className="mb-1 block text-sm font-medium text-text">
          {t('words.grammar.tr.verbRoot')} <span className="text-destructive">*</span>
        </label>
        <input
          type="text"
          value={verb?.verbRoot ?? ''}
          onChange={(e) => setVerbField({ verbRoot: e.target.value })}
          className="w-full rounded-control border border-border bg-background px-3 py-2 text-sm text-text"
        />
      </div>
      <div>
        <label className="mb-1 block text-sm font-medium text-text">
          {t('words.grammar.tr.negativeForm')} <span className="text-destructive">*</span>
        </label>
        <input
          type="text"
          value={verb?.negativeForm ?? ''}
          onChange={(e) => setVerbField({ negativeForm: e.target.value })}
          className="w-full rounded-control border border-border bg-background px-3 py-2 text-sm text-text"
        />
      </div>
      <div>
        <p className="mb-1 text-sm font-medium text-text">
          {t('words.grammar.tr.conjugation')} <span className="text-destructive">*</span>
        </p>
        <ConjugationGrid
          tenses={TR_VERB_TENSE_KEYS.map((key) => ({ key, label: t(\`words.grammar.tr.tenseLabels.\${key}\`) }))}
          persons={TR_PERSON_KEYS.map((key) => ({ key, label: t(\`words.grammar.tr.personLabels.\${key}\`) }))}
          value={verb?.conjugation}
          onChange={(conjugation) => setVerbField({ conjugation: conjugation as TurkishVerbGrammarData['conjugation'] })}
        />
      </div>
    </div>
  )
}`,
        satirlar: [
          {
            satir: "presentContinuous: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },\n        aorist: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },\n        pastDefinite: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },\n        pastNarrative: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },\n        future: { ben: '', sen: '', o: '', biz: '', siz: '', onlar: '' },",
            aciklama: 'Beş Türkçe zaman (şimdiki, geniş, görülen geçmiş, duyulan geçmiş, gelecek) × altı kişi = 30 hücrelik varsayılan — Almanca\'nın 18 hücreli varsayılanından (Bölüm 5) DAHA BÜYÜK.',
            neden: 'Türkçe\'nin "geçmiş zaman" kavramı Almanca\'daki TEK bir Präteritum/Perfekt AYRIMINDAN farklı ikiye BÖLÜNÜYOR — `pastDefinite` (görülen/tanık olunan, "-di") ve `pastNarrative` (duyulan/rivayet, "-mış") ayrı GRAMER kategorileri, tek bir "geçmiş zaman" alanına SIKIŞTIRILAMAZ.',
            olmasaydi: 'Bu ikisi TEK bir "past" alanında BİRLEŞTİRİLSEYDİ, "gitti" (görülen) ile "gitmiş" (duyulan) ARASINDAKİ ANLAM farkı admin panelde HİÇ TEMSİL EDİLEMEZDİ — bu bilgiyi OKUYACAK gelecekteki bir öğrenme özelliği bu ikisini AYIRT edemezdi.'
          },
          {
            satir: '<ConjugationGrid',
            aciklama: 'Bölüm 5\'teki AYNI generic component — yalnızca `TR_VERB_TENSE_KEYS`/`TR_PERSON_KEYS` farklı diziler olarak GEÇİLİYOR, `ConjugationGrid`\'in KENDİ kodunda TEK satır bile değişmiyor.',
            neden: 'Bu, Bölüm 5\'in "tek generic component" kararının SOMUT KANITI — Almanca 3 zaman ile Türkçe 5 zaman arasındaki SAYISAL fark bile component\'in KENDİSİNDE hiçbir DALLANMA (if/else) gerektirmiyor.',
            olmasaydi: 'Bu bölümde tekrar EDİLMEDİ — Bölüm 5\'teki gerekçe AYNEN geçerli, burada yalnızca farklı prop değerleriyle KULLANILDIĞI gösteriliyor.'
          }
        ]
      },
      {
        tur: 'sozluk',
        baslik: 'Bu Bölümde Geçen Terimler',
        terimler: [
          { terim: 'Ünlü Uyumu (Vowel Harmony)', tanim: 'Türkçe\'ye özgü bir ses kuralı — bir kelimenin İÇİNDEKİ ünlülerin "kalın" (a,ı,o,u) ya da "ince" (e,i,ö,ü) grubundan olması, EKLERİN hangi biçimi alacağını belirler.' },
          { terim: 'İyelik Eki (Possessive Suffix)', tanim: 'Türkçe\'de bir ismin KİME ait olduğunu gösteren ek (ör. "kitab-ım", "kitab-ın") — altı kişi için ayrı BİR biçim.' },
          { terim: 'Ünsüz Yumuşaması (Consonant Mutation)', tanim: 'Türkçe\'de bazı kelimelerin sonundaki sert ünsüzün (p,ç,t,k) bir ek alırken YUMUŞAMASI (ör. kitap→kitabı) — B-03\'te opsiyonel/doğrulanmamış bir alan.' },
          { terim: 'Görülen vs Duyulan Geçmiş Zaman', tanim: 'Türkçe\'nin geçmişi konuşanın BİZZAT tanık olup olmadığına göre ikiye AYIRDIĞI gramer kategorisi — Almanca\'da karşılığı YOK.' }
        ]
      },
      {
        tur: 'ozet',
        baslik: 'Bu Bölümde Öğrendiklerimiz',
        maddeler: [
          'Türkçe İsim: çoğul + 6 hâl + ünlü uyumu + iyelik — DÖRDÜ de zorunlu (A-05.2 retrofit\'i sonrası)',
          '`consonantMutation` BİLİNÇLİ olarak opsiyonel — hiçbir kod onu henüz OKUMUYOR, `*` yerine gri "(opsiyonel)" etiketi TAŞIYOR',
          'İyelik ekleri `ConjugationGrid`\'e SIĞDIRILMADI (zaman boyutu yok) — düz bir `.map()` ile gösterildi',
          'Türkçe Fiil: 5 zaman (görülen/duyulan geçmiş AYRI kategoriler) × 6 kişi = 30 hücre, AYNI `ConjugationGrid`',
          'Sırada: gramer DIŞINDAKİ alanlar — örnek cümleler ve kategori seçici (Bölüm 7)'
        ]
      }
    ]
  };
</script>
<script src="../engine/slides-engine.js"></script>
</body>
</html>
