<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WordListPage.tsx — Route + Sidebar</title>
<link rel="stylesheet" href="../engine/slides.css" />
</head>
<body>
<div id="app"></div>
<script>
  window.MODULE = {
    id: 'b03-wordlistpage',
    bolumBaslik: 'B-03 — Kelime Yönetimi',
    oncekiBolum: '07_ornek-cumle-kategori-secici.html',
    sonrakiBolum: '09_wordpairingpage.html',
    slaytlar: [
      {
        tur: 'kapak',
        ustBaslik: 'BÖLÜM 8',
        baslik: 'WordListPage.tsx',
        altBaslik: 'Filtre çubuğu + sayfalanmış tablo + inline düzenle/sil — B-03\'ün tüm alt parçalarının (filtre slice, form modal, API katmanı) BİR ARAYA GELDİĞİ ilk gerçek sayfa.'
      },
      {
        tur: 'kod',
        baslik: 'WordListPage.tsx — Özet Veriyle Çalışan Tablo + Talep Üzerine Detay',
        dosyaYolu: 'admin/src/components/words/WordListPage.tsx',
        nedenBuKlasor: '`components/words/` — B-03\'ün tüm görsel parçalarının yaşadığı klasör; bu dosya `/words` route\'una BAĞLANAN component (App.tsx\'te aşağıda göreceğiz).',
        kod: `import { useState } from 'react'
import { useTranslation } from 'react-i18next'
import { useDispatch, useSelector } from 'react-redux'
import { useDeleteWordMutation, useGetWordByIdQuery, useGetWordsQuery } from '../../store/api/wordsApi'
import {
  setCategoryId as setCategoryFilter,
  setLevel,
  setPage,
  setPartOfSpeech,
  setSearch,
} from '../../store/slices/wordFilterSlice'
import type { RootState } from '../../store/store'
import { WordFormModal } from './WordFormModal'
import type { DifficultyLevel, PartOfSpeech } from '../../types/word.types'

const LEVELS: DifficultyLevel[] = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2']
const PARTS_OF_SPEECH: PartOfSpeech[] = [
  'Noun',
  'Verb',
  'Adjective',
  'Adverb',
  'Conjunction',
  'Preposition',
  'Pronoun',
  'Other',
]

// wordConceptId !== null iken WordFormModal'ı düzenleme modunda açar — liste yalnızca özet
// (WordListItem) taşıdığı için, tam çeviri/gramer verisi bu ayrı sorguyla (GetWordByIdQuery)
// yalnızca düzenle tıklanınca çekilir.
function EditWordModal({ wordConceptId, onClose }: { wordConceptId: number; onClose: () => void }) {
  const { data, isLoading } = useGetWordByIdQuery(wordConceptId)
  if (isLoading || !data) return null
  return <WordFormModal initialData={data} onClose={onClose} />
}

export function WordListPage() {
  const { t } = useTranslation()
  const dispatch = useDispatch()
  const filter = useSelector((state: RootState) => state.wordFilter)
  const { data, isLoading, refetch } = useGetWordsQuery({
    search: filter.search || undefined,
    level: filter.level ?? undefined,
    partOfSpeech: filter.partOfSpeech ?? undefined,
    categoryId: filter.categoryId ?? undefined,
    page: filter.page,
    pageSize: 20,
  })
  const [deleteWord] = useDeleteWordMutation()
  const [isCreating, setIsCreating] = useState(false)
  const [editingId, setEditingId] = useState<number | null>(null)

  const handleDelete = async (id: number) => {
    if (window.confirm(t('words.list.deleteConfirm') ?? '')) {
      await deleteWord(id)
      refetch()
    }
  }

  const totalPages = data ? Math.max(1, Math.ceil(data.totalCount / data.pageSize)) : 1

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <h1 className="font-heading text-xl font-bold text-text">{t('words.list.title')}</h1>
        <button
          type="button"
          onClick={() => setIsCreating(true)}
          className="rounded-control bg-primary px-4 py-2 text-sm font-semibold text-white"
        >
          {t('words.list.addButton')}
        </button>
      </div>

      <div className="flex flex-wrap gap-2">
        <input
          type="text"
          value={filter.search}
          onChange={(e) => dispatch(setSearch(e.target.value))}
          placeholder={t('words.list.search') ?? undefined}
          className="rounded-control border border-border bg-surface px-3 py-2 text-sm text-text"
        />
        <select
          value={filter.level ?? ''}
          onChange={(e) => dispatch(setLevel((e.target.value || null) as DifficultyLevel | null))}
          className="rounded-control border border-border bg-surface px-3 py-2 text-sm text-text"
        >
          <option value="">{t('words.list.allLevels')}</option>
          {LEVELS.map((level) => (
            <option key={level} value={level}>
              {level}
            </option>
          ))}
        </select>
        <select
          value={filter.partOfSpeech ?? ''}
          onChange={(e) => dispatch(setPartOfSpeech((e.target.value || null) as PartOfSpeech | null))}
          className="rounded-control border border-border bg-surface px-3 py-2 text-sm text-text"
        >
          <option value="">{t('words.list.allPartsOfSpeech')}</option>
          {PARTS_OF_SPEECH.map((pos) => (
            <option key={pos} value={pos}>
              {t(\`words.partOfSpeech.\${pos}\`)}
            </option>
          ))}
        </select>
        {filter.categoryId !== null && (
          <button
            type="button"
            onClick={() => dispatch(setCategoryFilter(null))}
            className="rounded-control border border-border px-3 py-2 text-sm text-text hover:bg-background"
          >
            {t('words.list.filterCategory') ?? ''} #{filter.categoryId} ×
          </button>
        )}
      </div>

      {isLoading && <p className="text-sm text-muted">{t('words.list.loading')}</p>}
      {!isLoading && data && data.items.length === 0 && (
        <p className="text-sm text-muted">{t('words.list.empty')}</p>
      )}

      {!isLoading && data && data.items.length > 0 && (
        <div className="overflow-x-auto rounded-card border border-border bg-surface">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-border bg-background text-left text-muted">
                <th className="p-3 font-medium">{t('words.form.text')}</th>
                <th className="p-3 font-medium">{t('words.form.partOfSpeech')}</th>
                <th className="p-3 font-medium">{t('words.form.difficultyLevel')}</th>
                <th className="p-3 font-medium" />
              </tr>
            </thead>
            <tbody>
              {data.items.map((item) => (
                <tr key={item.wordConceptId} className="border-b border-border last:border-0">
                  <td className="p-3 text-text">
                    {item.translations.map((tr) => tr.text).join(' / ')}
                    {item.translations.length < 2 && (
                      <span className="ml-2 rounded-control bg-warning/10 px-2 py-0.5 text-xs text-warning">
                        {t('words.list.unmatchedBadge')}
                      </span>
                    )}
                  </td>
                  <td className="p-3 text-text">{t(\`words.partOfSpeech.\${item.partOfSpeech}\`)}</td>
                  <td className="p-3 text-text">{item.difficultyLevel}</td>
                  <td className="p-3 text-right">
                    <button
                      type="button"
                      onClick={() => setEditingId(item.wordConceptId)}
                      className="mr-2 rounded-control px-2 py-1 text-primary hover:bg-primary/10"
                    >
                      {t('action.edit')}
                    </button>
                    <button
                      type="button"
                      onClick={() => handleDelete(item.wordConceptId)}
                      className="rounded-control px-2 py-1 text-destructive hover:bg-destructive/10"
                    >
                      {t('action.delete')}
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {!isLoading && data && data.totalCount > 0 && (
        <div className="flex items-center justify-end gap-3 text-sm text-text">
          <span>{t('words.list.pageInfo', { page: filter.page, totalPages })}</span>
          <button
            type="button"
            disabled={filter.page <= 1}
            onClick={() => dispatch(setPage(filter.page - 1))}
            className="rounded-control border border-border px-3 py-1 disabled:opacity-40"
          >
            {t('words.list.previous')}
          </button>
          <button
            type="button"
            disabled={filter.page >= totalPages}
            onClick={() => dispatch(setPage(filter.page + 1))}
            className="rounded-control border border-border px-3 py-1 disabled:opacity-40"
          >
            {t('words.list.next')}
          </button>
        </div>
      )}

      {isCreating && (
        <WordFormModal
          onClose={() => {
            setIsCreating(false)
            refetch()
          }}
        />
      )}
      {editingId !== null && (
        <EditWordModal
          wordConceptId={editingId}
          onClose={() => {
            setEditingId(null)
            refetch()
          }}
        />
      )}
    </div>
  )
}`,
        satirlar: [
          {
            satir: 'function EditWordModal({ wordConceptId, onClose }: { wordConceptId: number; onClose: () => void }) {',
            aciklama: 'Küçük bir ARA component — `wordConceptId` verildiğinde `useGetWordByIdQuery`\'yi çağırır, veri gelene kadar `null` render eder, gelince `WordFormModal`\'ı `initialData` İLE açar.',
            neden: 'Liste tablosu yalnızca `WordListItem` (özet) taşıyor — tam gramer/örnek verisi YOK. Bu ARA component, "düzenle" tıklanana kadar o AĞIR sorguyu HİÇ ÇALIŞTIRMAMAYI garanti ediyor; `useGetWordByIdQuery` component MOUNT olmadan (yani admin "düzenle"ye BASMADAN) hiç çağrılmıyor.',
            olmasaydi: 'Bu ayrım OLMASAYDI (ör. `WordListPage`\'in KENDİSİ her satır için `useGetWordByIdQuery` çağırsaydı), sayfa AÇILDIĞI anda 20 satırın HEPSİ İÇİN 20 AYRI detay isteği GİDERDİ — admin hiçbirini düzenlemese BİLE.'
          },
          {
            satir: 'const handleDelete = async (id: number) => {\n    if (window.confirm(t(\'words.list.deleteConfirm\') ?? \'\')) {\n      await deleteWord(id)\n      refetch()\n    }\n  }',
            aciklama: 'Native tarayıcı `window.confirm()` — özel bir onay modalı DEĞİL, admin panelin BAŞKA hiçbir yerinde de kullanılmayan basit bir tarayıcı API\'si. Silme İSTEĞİ `await`lendikten SONRA `refetch()` çağrılıyor.',
            neden: 'Silme İŞLEMİNİN GERİ ALINAMAZ olması (soft delete olsa bile admin panelde bunu geri getiren bir arayüz YOK) bir onay ADIMI gerektiriyor — `window.confirm` bu ihtiyacı, YENİ bir component/state YAZMADAN, TEK satırda karşılıyor. `refetch()` ise Bölüm 2\'de anlatılan axios geçişinin SONUCU: artık otomatik bir tag invalidation YOK, listenin silinen satırsız GÖRÜNMESİ bu component\'in KENDİ sorumluluğu.',
            olmasaydi: 'Onay adımı hiç OLMASAYDI, "Sil" butonuna YANLIŞLIKLA (ör. "Düzenle" butonuna YAKIN olduğu için) tıklayan bir admin, hiçbir UYARI almadan bir kelimeyi SİLERDİ. `refetch()` çağrılmasaydı, silme backend\'de BAŞARILI olsa bile tablo o satırı SAYFA YENİLENENE kadar GÖSTERMEYE devam ederdi — admin silmenin işe yarayıp yaramadığından EMİN olamazdı.'
          }
        ]
      },
      {
        tur: 'onizleme',
        baslik: 'Tarayıcıda Dene — /words',
        rota: '/words',
        aciklama: 'Admin girişi yaptıktan sonra Sidebar\'daki "Kelimeler" linkiyle ulaşılan, admin panelin İLK gerçek İÇERİK yönetimi ekranı.',
        akis: [
          { eylem: 'Admin sayfayı açar', sonuc: '`wordFilterSlice`\'ın o ANKİ state\'iyle (varsayılan: boş filtre, sayfa 1) `getWords` sorgusu ÇALIŞIR, sonuçlar tabloda listelenir' },
          { eylem: 'Admin arama kutusuna "Tisch" yazar', sonuc: '`setSearch` dispatch edilir → sayfa 1\'e döner → `getWords` YENİ `search` parametresiyle TEKRAR çalışır' },
          { eylem: 'Admin bir satırda "Düzenle"ye tıklar', sonuc: '`EditWordModal` mount olur, `useGetWordByIdQuery` İLK KEZ çalışır, veri gelince `WordFormModal` düzenleme modunda AÇILIR' },
          { eylem: 'Admin "Sil"e tıklar', sonuc: 'Tarayıcının native onay kutusu ÇIKAR — "Tamam" ile `deleteWord` çağrılır, ardından `refetch()` tetiklenir, satır listeden KAYBOLUR' },
          { eylem: 'Tek dilli (eşleşmemiş) bir kavram listede görünür', sonuc: 'Metnin yanında sarı "Eşleşmemiş" rozeti çıkar — bu satırı eşleştirmenin yolu Sidebar\'daki "Kelime Eşleştirme" linki (Bölüm 9)' }
        ],
        apiCagrisi: { yontem: 'GET', url: 'http://localhost:5001/api/v1/words?page=1&pageSize=20' },
        durumlar: [
          { durum: 'Yükleniyor', gorunum: '"Yükleniyor..." metni, tablo henüz RENDER edilmez' },
          { durum: 'Boş sonuç', gorunum: '"Kelime bulunamadı" metni — filtre çok DAR ya da hiç kelime YOK' },
          { durum: 'Silme onayı', gorunum: 'Tarayıcının native `confirm()` penceresi — özel bir tasarım YOK' }
        ],
        notlar: [
          'Bu route `ProtectedRoute`\'un İÇİNDE — JWT yoksa `/login`\'e yönlendirilir.',
          'Backend `[Authorize]` (Admin şartı YOK) ile korunuyor — `GET /words` okuma HERKESE (User dahil) açık, yalnızca yazma uçları (`POST`/`PUT`/`DELETE`) `[Authorize(Roles="Admin")]`.'
        ]
      },
      {
        tur: 'kod-degisiklik',
        baslik: 'App.tsx — İki Yeni Route Eklendi',
        dosyaYolu: 'admin/src/App.tsx',
        neden: 'B-01\'de kurulan route ağacı `/login`/`/verify-otp`/`/` (dashboard yer tutucusu) DIŞINDA hiçbir korumalı sayfa İÇERMİYORDU — B-03 admin panelin İLK gerçek İÇERİK sayfalarını (`WordListPage`, `WordPairingPage`) ekliyor, ikisi de `ProtectedRoute`+`AppLayout`\'un İÇİNDE.',
        diff: ` import { BrowserRouter, Routes, Route } from 'react-router-dom'
 import { useTranslation } from 'react-i18next'
 import { ProtectedRoute } from './components/ProtectedRoute'
 import { AppLayout } from './components/layout/AppLayout'
 import { LoginPage } from './components/LoginPage'
 import { OtpVerifyPage } from './components/OtpVerifyPage'
+import { WordListPage } from './components/words/WordListPage'
+import { WordPairingPage } from './components/words/WordPairingPage'
 import { useThemeSync } from './hooks/useThemeSync'

 function DashboardPlaceholder() {
   const { t } = useTranslation()
   return <div className="font-heading text-xl font-bold text-text">{t('nav.dashboard')} — B-07'de gelecek</div>
 }

 function App() {
   useThemeSync()

   return (
     <BrowserRouter>
       <Routes>
         <Route path="/login" element={<LoginPage />} />
         <Route path="/verify-otp" element={<OtpVerifyPage />} />
         <Route element={<ProtectedRoute />}>
           <Route element={<AppLayout />}>
             <Route path="/" element={<DashboardPlaceholder />} />
+            <Route path="/words" element={<WordListPage />} />
+            <Route path="/words/pairing" element={<WordPairingPage />} />
           </Route>
         </Route>
       </Routes>
     </BrowserRouter>
   )
 }`,
        satirlar: [
          {
            satir: '<Route path="/words" element={<WordListPage />} />',
            aciklama: '`ProtectedRoute`+`AppLayout`\'un İÇİNDE — Sidebar/Topbar OTOMATİK sarılır, `WordListPage`\'in kendisi bu KABUĞU hiç bilmez/yönetmez.',
            neden: '`AppLayout` (B-01) zaten TÜM korumalı sayfaların ORTAK kabuğu — `WordListPage` kendi başlığını/sidebar\'ını YENİDEN yazmıyor, yalnızca `<Outlet/>`\'in İÇİNE düşen bir sayfa içeriği.',
            olmasaydi: '`/words` `ProtectedRoute`\'un DIŞINA (ör. `/login` GİBİ) eklenseydi, JWT\'si OLMAYAN biri bu sayfaya DOĞRUDAN URL yazarak ERİŞEBİLİRDİ — backend zaten `[Authorize]` ile KORUNUYOR ama admin panel BOŞ bir yükleniyor ekranı GÖSTERİP arkasında 401 alırdı, kullanıcı deneyimi olarak KÖTÜ bir sürpriz.'
          }
        ]
      },
      {
        tur: 'kod-degisiklik',
        baslik: 'Sidebar.tsx — İki Yeni Link Eklendi',
        dosyaYolu: 'admin/src/components/layout/Sidebar.tsx',
        neden: 'B-01\'de `Sidebar` yalnızca TEK bir link (`/` — Panel) İÇERİYORDU, çünkü o zaman KORUMALI hiçbir SAYFA yoktu. B-03 admin panelin İLK gezinme (navigation) ihtiyacını doğuruyor.',
        diff: ` export function Sidebar() {
   const { t } = useTranslation()
   const links = [
-    { to: '/', label: t('nav.dashboard') }
+    { to: '/', label: t('nav.dashboard') },
+    { to: '/words', label: t('nav.words') },
+    { to: '/words/pairing', label: t('nav.wordPairing') },
   ]`,
        satirlar: [
          {
            satir: "{ to: '/words', label: t('nav.words') },",
            aciklama: '`links` dizisi `.map()`\'lenerek `NavLink`\'lere DÖNÜŞÜYOR (bu bölümün dışında, dosyanın GERİ KALANI değişmedi) — yeni bir link eklemek bu diziye TEK bir nesne eklemek kadar BASİT.',
            neden: '`label` `t(\'nav.words\')` üzerinden GELİYOR (sabit "Kelimeler" string\'i DEĞİL) — admin panelin dili DEĞİŞTİĞİNDE (B-01\'in `languageSlice`\'ı) bu link de OTOMATİK "Wörter"e DÖNÜŞÜYOR.',
            olmasaydi: 'Label sabit bir string OLSAYDI, admin panelin dili Almanca\'ya çevrildiğinde Sidebar\'ın GERİ KALANI (Panel→Übersicht) çevrilirken bu TEK link Türkçe KALIRDI — tutarsız, YARI çevrilmiş bir arayüz.'
          }
        ]
      },
      {
        tur: 'sozluk',
        baslik: 'Bu Bölümde Geçen Terimler',
        terimler: [
          { terim: 'Talep Üzerine Veri Çekme (Lazy Fetch)', tanim: 'Bir sorgunun component MOUNT olana kadar hiç ÇALIŞMAMASI — `EditWordModal`\'ın yalnızca "düzenle" tıklanınca RENDER edilmesi, `useGetWordByIdQuery`\'yi de o ana kadar ERTELİYOR.' },
          { terim: 'Layout Route', tanim: 'React Router\'da kendi element\'i OLAN ama asıl amacı `<Outlet/>` ile İÇ route\'ları SARMALAMAK olan bir route (`ProtectedRoute`, `AppLayout`).' },
          { terim: 'window.confirm', tanim: 'Tarayıcının kendi native onay penceresini AÇAN, hiçbir stil/özelleştirme İZNİ vermeyen basit bir JS API\'si.' }
        ]
      },
      {
        tur: 'ozet',
        baslik: 'Bu Bölümde Öğrendiklerimiz',
        maddeler: [
          '`WordListPage` yalnızca ÖZET veri (`WordListItem`) render ediyor — tam detay yalnızca "düzenle" tıklanınca `EditWordModal` ÜZERİNDEN çekiliyor',
          'Silme `window.confirm()` ile onaylanıyor — özel bir modal YAZILMADI',
          '`/words` ve `/words/pairing` `ProtectedRoute`+`AppLayout`\'un İÇİNDE — admin panelin İLK gerçek içerik sayfaları',
          'Sidebar\'a iki link eklendi, İKİSİ de `t()` üzerinden — dil değişince OTOMATİK çevriliyor',
          'Sırada: ikinci route — `WordPairingPage`, B-03\'ün en KARMAŞIK ekranı (Bölüm 9)'
        ]
      }
    ]
  };
</script>
<script src="../engine/slides-engine.js"></script>
</body>
</html>
