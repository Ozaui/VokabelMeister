<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WordExamplesFields.tsx + CategoryPicker.tsx</title>
<link rel="stylesheet" href="../engine/slides.css" />
</head>
<body>
<div id="app"></div>
<script>
  window.MODULE = {
    id: 'b03-ornekler-kategori',
    bolumBaslik: 'B-03 — Kelime Yönetimi',
    oncekiBolum: '06_turkce-gramer-alanlari.html',
    sonrakiBolum: '08_wordlistpage-route-sidebar.html',
    slaytlar: [
      {
        tur: 'kapak',
        ustBaslik: 'BÖLÜM 7',
        baslik: 'WordExamplesFields.tsx + CategoryPicker.tsx',
        altBaslik: 'Gramerin DIŞINDAKİ iki alan: dinamik EKLE/ÇIKAR listesi (örnek cümleler) ve recursive bir ağaç (kategori seçici) — ikisi de `WordFormModal`\'a `formik.setFieldValue` ile bağlanıyor.'
      },
      {
        tur: 'kavram',
        baslik: 'Neden Düzenleme Modunda Örnek Cümle Listesi BOŞ Başlıyor',
        aciklama: 'Backend\'in `UpdateWordCommand`\'ı bir çeviriye YENİ örnek cümleler EKLEYEBİLİR ama VAR OLANLARI silemez/değiştiremez — `Handle` metodunda `translation.Examples` listesindeki HER öğe, mevcut sayıya `displayOrder++` ile EKLENİR, var olan `WordExamples` koleksiyonuna hiç DOKUNULMAZ. Bu yüzden `WordExamplesFields`, düzenleme modunda bile BOŞ bir listeyle başlar (Bölüm 4\'teki `toFormValues`\'ta `examples: []`) — var olanlar `WordFormModal` tarafından AYRICA salt-okunur gösterilir, bu component\'e hiç GİRMEZ.',
        neden: 'Bu backend\'in A-05\'te bilinçli alınmış bir YAGNI kararı — örnek cümle DÜZENLEME/SİLME o dönemde İHTİYAÇ duyulmayan bir kapsam GENİŞLEMESİYDİ. Admin panel bu kısıtı GÖRMEZDEN gelip listeyi var olan örneklerle DOLDURSAYDI, "kaydet"e her basışta o örnekler YENİDEN eklenir, aynı cümle veritabanında ÇOĞALIRDI.',
        olmasaydi: 'Var olan örnekler bu diziye ÖNCEDEN doldurulup backend\'e AYNEN geri gönderilseydi, bir admin yalnızca TELAFFUZU düzeltip kaydettiğinde o kelimenin ÖRNEK CÜMLELERİ SESSİZCE ikiye, üçe KATLANIRDI — hatanın SEBEBİ ekranda hiç GÖRÜNMEYEN bir davranış olurdu.'
      },
      {
        tur: 'kod',
        baslik: 'WordExamplesFields.tsx — Dinamik Ekle/Çıkar Listesi',
        dosyaYolu: 'admin/src/components/words/WordExamplesFields.tsx',
        nedenBuKlasor: '`components/words/` — `WordFormModal`\'ın HER çeviri satırının İÇİNDE bir `formik.setFieldValue` çağrısıyla bağlanan, kendi başına state\'i olmayan (dışarıdan `value`/`onChange` alan) saf bir liste editörü.',
        kod: `import { useTranslation } from 'react-i18next'
import type { DifficultyLevel, ExampleType, WordExampleInput } from '../../types/word.types'

interface WordExamplesFieldsProps {
  value: WordExampleInput[]
  onChange: (value: WordExampleInput[]) => void
}

const LEVELS: DifficultyLevel[] = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2']
const EXAMPLE_TYPES: ExampleType[] = ['Normal', 'Idiom', 'Formal', 'Colloquial']

// UpdateWordCommand yalnızca EKLEME yapar (mevcut örnekleri silme/güncelleme kapsam dışı, A-05
// bilinçli bir YAGNI kararıydı) — bu yüzden düzenleme modunda da bu liste zaten SIFIRDAN başlar,
// var olan örnekler backend'e AYRICA gönderilmez (WordFormModal onları salt-okunur ayrıca gösterir).
export function WordExamplesFields({ value, onChange }: WordExamplesFieldsProps) {
  const { t } = useTranslation()

  const addExample = () => onChange([...value, { sentenceText: '', level: 'A1', exampleType: 'Normal' }])
  const removeExample = (index: number) => onChange(value.filter((_, i) => i !== index))
  const updateExample = (index: number, patch: Partial<WordExampleInput>) =>
    onChange(value.map((example, i) => (i === index ? { ...example, ...patch } : example)))

  return (
    <div className="flex flex-col gap-2">
      {value.map((example, index) => (
        <div key={index} className="flex flex-col gap-2 rounded-control border border-border p-2 sm:flex-row sm:items-start">
          <input
            type="text"
            value={example.sentenceText}
            onChange={(e) => updateExample(index, { sentenceText: e.target.value })}
            placeholder={t('words.examples.sentencePlaceholder') ?? undefined}
            className="flex-1 rounded-control border border-border bg-background px-2 py-1 text-sm text-text"
          />
          <select
            value={example.level}
            onChange={(e) => updateExample(index, { level: e.target.value as DifficultyLevel })}
            className="rounded-control border border-border bg-background px-2 py-1 text-sm text-text"
          >
            {LEVELS.map((level) => (
              <option key={level} value={level}>
                {level}
              </option>
            ))}
          </select>
          <select
            value={example.exampleType}
            onChange={(e) => updateExample(index, { exampleType: e.target.value as ExampleType })}
            className="rounded-control border border-border bg-background px-2 py-1 text-sm text-text"
          >
            {EXAMPLE_TYPES.map((type) => (
              <option key={type} value={type}>
                {t(\`words.examples.type.\${type}\`)}
              </option>
            ))}
          </select>
          <button
            type="button"
            onClick={() => removeExample(index)}
            className="rounded-control px-2 py-1 text-sm text-destructive hover:bg-destructive/10"
          >
            {t('action.remove')}
          </button>
        </div>
      ))}
      <button
        type="button"
        onClick={addExample}
        className="self-start rounded-control border border-border px-3 py-1 text-sm text-text hover:bg-background"
      >
        + {t('words.examples.add')}
      </button>
    </div>
  )
}`,
        satirlar: [
          {
            satir: "{t(\`words.examples.type.\${type}\`)}",
            aciklama: 'Örnek türü (`Normal`/`Idiom`/`Formal`/`Colloquial`) dropdown\'ının GÖSTERDİĞİ metin — `t()` üzerinden `words.examples.type.*` anahtarına GİDİYOR ("Deyim"/"Resmî"/"Günlük Dil" gibi).',
            neden: 'Bir satır üstteki seviye (`LEVELS`) dropdown\'u ZATEN "A1"/"B2" gibi evrensel kısaltmalar kullandığı için ÇEVİRİYE ihtiyacı YOKTU, ama örnek TÜRÜ İngilizce alan adlarının (`Idiom`, `Colloquial`) KENDİSİ — bunlar backend\'e giden GERÇEK değerler, admin\'e GÖRÜNEN metin OLMAMALI.',
            olmasaydi: 'Bu satır `{type}` (çevirisiz) OLSAYDI, dropdown Türkçe arayüzde bile "Idiom"/"Colloquial" gibi HAM İngilizce kelimeler GÖSTERİRDİ — tam olarak Bölüm 10\'da anlatılan i18n hatasıyla AYNI kategoriden bir hata, burada YAKALANIP düzeltildi.'
          },
          {
            satir: "const removeExample = (index: number) => onChange(value.filter((_, i) => i !== index))",
            aciklama: 'Silinecek satırın İNDEKSİYLE filtrelenip YENİ bir dizi üretilir — orijinal `value` dizisi hiç MUTASYONA uğramaz.',
            neden: '`WordFormModal`\'ın `formik.setFieldValue(path, value)` çağrısı `value`\'nun REFERANS olarak DEĞİŞTİĞİNİ (yeni bir dizi) fark edip Formik\'in `values` state\'ini GÜNCELLEMESİ üzerine kurulu — `value.splice(index,1)` gibi YERİNDE (in-place) bir mutasyon AYNI referansı korurdu, bu güncelleme hiç FARK EDİLMEZDİ.',
            olmasaydi: '`.splice()` kullanılsaydı, bir örneği SİLMEK ekranda HİÇBİR ŞEY değiştirmezdi (React "aynı referans, re-render gerekmez" diye DÜŞÜNÜRDÜ) — admin "Kaldır"a bassa da satır EKRANDA kalmaya DEVAM ederdi.'
          }
        ]
      },
      {
        tur: 'kavram',
        baslik: 'Recursive Component — Neden CategoryPicker Kendi Kendini Çağırıyor',
        aciklama: 'Kategori hiyerarşisinin DERİNLİĞİ (kaç seviye alt kategori olduğu) ÖNCEDEN bilinmiyor — bir kategori kendi `children`\'ına, onlar da KENDİ `children`\'larına sahip OLABİLİR. `CategoryNode` bu belirsiz derinliği, KENDİSİNİ çağırarak (`<CategoryNode>` component\'inin JSX\'inde tekrar `<CategoryNode>` render etmesi) çözer.',
        neden: 'Sabit sayıda İÇ İÇE döngü (`.map` içinde `.map` içinde `.map`...) yazmak, kategori ağacının ÖNCEDEN bilinen bir DERİNLİĞİ olduğunu VARSAYARDI — oysa bu derinlik backend\'de HİÇ SINIRLANMAMIŞ (self-ref bir FK, istenen kadar derin OLABİLİR).',
        olmasaydi: 'Recursive render YERİNE 2-3 seviyelik sabit İÇ İÇE `.map` yazılsaydı, kategori ağacı DÖRDÜNCÜ bir seviyeye ULAŞTIĞINDA (ör. Mobilya > Oturma Odası > Koltuklar > Deri Koltuklar) o EN ALTTAKİ seviye admin panelde HİÇ GÖRÜNMEZDİ — kod SESSİZCE eksik kalırdı, hiçbir hata VERMEZDİ.'
      },
      {
        tur: 'kod',
        baslik: 'CategoryPicker.tsx — Recursive Checkbox Ağacı',
        dosyaYolu: 'admin/src/components/words/CategoryPicker.tsx',
        nedenBuKlasor: '`components/words/` — B-04\'ün TAM kategori CRUD sayfalarından FARKLI, yalnızca SEÇMEK için minimal bir görünüm; `categoriesApi`\'nin (Bölüm 2) tek endpoint\'ini okuyor.',
        kod: `import { useTranslation } from 'react-i18next'
import { useGetCategoriesQuery } from '../../store/api/categoriesApi'
import type { Category } from '../../types/category.types'

interface CategoryPickerProps {
  selectedIds: number[]
  onChange: (ids: number[]) => void
}

// Kategori adı admin'in seçili diline göre gösterilir (CategoryTranslation[] içinden ara),
// hiçbiri yoksa (henüz o dilde çeviri girilmemişse) ilk çeviri fallback olur.
function categoryLabel(category: Category, languageCode: string): string {
  const translation =
    category.translations.find((t) => t.languageCode === languageCode) ?? category.translations[0]
  return translation?.name ?? \`#\${category.id}\`
}

function CategoryNode({
  category,
  depth,
  languageCode,
  selectedIds,
  onToggle,
}: {
  category: Category
  depth: number
  languageCode: string
  selectedIds: number[]
  onToggle: (id: number) => void
}) {
  return (
    <>
      <label
        className="flex items-center gap-2 rounded-control px-2 py-1 text-sm text-text hover:bg-background"
        style={{ paddingLeft: \`\${depth * 1.25 + 0.5}rem\` }}
      >
        <input
          type="checkbox"
          checked={selectedIds.includes(category.id)}
          onChange={() => onToggle(category.id)}
        />
        {categoryLabel(category, languageCode)}
      </label>
      {category.children.map((child) => (
        <CategoryNode
          key={child.id}
          category={child}
          depth={depth + 1}
          languageCode={languageCode}
          selectedIds={selectedIds}
          onToggle={onToggle}
        />
      ))}
    </>
  )
}

export function CategoryPicker({ selectedIds, onChange }: CategoryPickerProps) {
  const { t, i18n } = useTranslation()
  const { data: categories, isLoading } = useGetCategoriesQuery()

  const toggle = (id: number) => {
    onChange(selectedIds.includes(id) ? selectedIds.filter((x) => x !== id) : [...selectedIds, id])
  }

  if (isLoading) return <p className="text-sm text-muted">{t('words.categories.loading')}</p>
  if (!categories || categories.length === 0)
    return <p className="text-sm text-muted">{t('words.categories.empty')}</p>

  return (
    <div className="max-h-48 overflow-y-auto rounded-control border border-border bg-background p-1">
      {categories.map((category) => (
        <CategoryNode
          key={category.id}
          category={category}
          depth={0}
          languageCode={i18n.language}
          selectedIds={selectedIds}
          onToggle={toggle}
        />
      ))}
    </div>
  )
}`,
        satirlar: [
          {
            satir: "{category.children.map((child) => (\n        <CategoryNode\n          key={child.id}\n          category={child}\n          depth={depth + 1}\n          languageCode={languageCode}\n          selectedIds={selectedIds}\n          onToggle={onToggle}\n        />\n      ))}",
            aciklama: '`CategoryNode`\'un JSX\'inin İÇİNDE, KENDİ tipinden bir component (`CategoryNode`) tekrar render ediliyor — `depth+1` ile bir seviye DAHA girinti eklenerek.',
            neden: 'Bu, recursion\'ın KENDİSİ — fonksiyon (burada component) kendi TANIMININ İÇİNDE kendini ÇAĞIRIYOR, bir üst seviyenin `children` dizisi TÜKENENE kadar (yaprak kategoriye ULAŞILANA, yani `children: []` olana kadar) devam EDİYOR.',
            olmasaydi: 'Bu satır olmasaydı (yalnızca TEK seviye `categories.map` olsaydı), KÖK kategoriler görünürdü ama HİÇBİR alt kategori GÖSTERİLMEZDİ — admin "Mobilya > Oturma Odası" gibi İÇ İÇE bir kategoriye kelime ATAYAMAZDI.'
          },
          {
            satir: 'style={{ paddingLeft: `${depth * 1.25 + 0.5}rem` }}',
            aciklama: 'Girinti MİKTARI `depth` parametresinden HESAPLANIYOR — Tailwind\'in SABİT `pl-4`/`pl-8` sınıfları yerine dinamik bir inline stil.',
            neden: 'Tailwind\'in class tabanlı yaklaşımı DERLEME zamanında SABİT sınıf isimleri BEKLER (`pl-${depth}` gibi DİNAMİK bir class ismi Tailwind\'in tarayıcısı TARAFINDAN üretilemez, çünkü hangi sınıfların VAR OLDUĞU derleme ZAMANINDA taranır) — derinlik SINIRSIZ olduğu için (bkz. kavram slaydı) inline stil TEK pratik çözüm.',
            olmasaydi: 'Sabit bir Tailwind sınıfı (`pl-4`) kullanılsaydı, TÜM derinlik seviyeleri AYNI girintiye sahip OLURDU — üçüncü seviyedeki bir alt kategori ile KÖK kategori GÖRSEL olarak AYIRT edilemezdi.'
          }
        ]
      },
      {
        tur: 'sozluk',
        baslik: 'Bu Bölümde Geçen Terimler',
        terimler: [
          { terim: 'Recursive Component', tanim: 'JSX\'inin İÇİNDE kendi tipinden bir component render eden React component\'i — kategori/menü/dosya AĞACI gibi bilinmeyen derinlikteki hiyerarşileri göstermek için standart desen.' },
          { terim: 'Fallback Değer (??)', tanim: '`translation?.name ?? \`#\${category.id}\`` — çeviri BULUNAMAZSA (henüz o dilde ad girilmemişse) admin\'e boş bir alan yerine kategori KİMLİĞİNİ (id) göstermek.' },
          { terim: 'Immutable Filter/Map', tanim: 'Bir diziyi YERİNDE (in-place, `splice`/`push`) değiştirmek yerine `.filter()`/`.map()` ile YENİ bir dizi ÜRETMEK — React\'in "referans değişti mi" kontrolüyle UYUMLU çalışma şekli.' }
        ]
      },
      {
        tur: 'ozet',
        baslik: 'Bu Bölümde Öğrendiklerimiz',
        maddeler: [
          '`WordExamplesFields` düzenleme modunda BOŞ başlıyor — backend `UpdateWordCommand` yalnızca EKLİYOR, bu yüzden var olan örnekler bu listeye HİÇ girmiyor',
          'Örnek TÜRÜ (`Idiom`/`Formal`/...) artık `t()` üzerinden ÇEVRİLİYOR — bir i18n hatası burada YAKALANIP düzeltildi (Bölüm 10\'da detaylı)',
          '`CategoryPicker` recursive bir `CategoryNode` — kategori ağacının SINIRSIZ derinliğini TEK bir component KARŞILIYOR',
          'Girinti Tailwind sınıfı DEĞİL, inline stil — derinlik önceden BİLİNMEDİĞİ için sabit sınıf isimleri YETERSİZ kalırdı',
          'Sırada: bu component\'lerin HEPSİNİN bir araya geldiği yer — `WordListPage` ve GERÇEK `/words` route\'u (Bölüm 8)'
        ]
      }
    ]
  };
</script>
<script src="../engine/slides-engine.js"></script>
</body>
</html>
