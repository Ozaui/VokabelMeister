        kod: `import { createSlice, type PayloadAction } from '@reduxjs/toolkit'
import type { DifficultyLevel, PartOfSpeech } from '../../types/word.types'

interface WordFilterState {
  search: string
  level: DifficultyLevel | null
  partOfSpeech: PartOfSpeech | null
  categoryId: number | null
  page: number
}

const initialState: WordFilterState = {
  search: '',
  level: null,
  partOfSpeech: null,
  categoryId: null,
  page: 1,
}

const wordFilterSlice = createSlice({
  name: 'wordFilter',
  initialState,
  reducers: {
    // Arama/filtre değiştiğinde sayfa 1'e döner — aksi hâlde 3. sayfadayken filtre değiştirilirse
    // yeni sonuç kümesinde var olmayan bir sayfada boş bir liste görülür.
    setSearch: (state, action: PayloadAction<string>) => {
      state.search = action.payload
      state.page = 1
    },
    setLevel: (state, action: PayloadAction<DifficultyLevel | null>) => {
      state.level = action.payload
      state.page = 1
    },
    setPartOfSpeech: (state, action: PayloadAction<PartOfSpeech | null>) => {
      state.partOfSpeech = action.payload
      state.page = 1
    },
    setCategoryId: (state, action: PayloadAction<number | null>) => {
      state.categoryId = action.payload
      state.page = 1
    },
    setPage: (state, action: PayloadAction<number>) => {
      state.page = action.payload
    },
    resetWordFilters: () => initialState,
  },
})

export const { setSearch, setLevel, setPartOfSpeech, setCategoryId, setPage, resetWordFilters } =
  wordFilterSlice.actions
export default wordFilterSlice.reducer`,

            olmasaydi: 'Immer olmasaydı, her reducer `return { ...state, search: action.payload, page: 1 }` gibi ELLE yayılan (spread) bir nesne DÖNDÜRMEK zorunda kalırdı — beş reducer\'ın hepsinde bu TEKRAR, bir tanesinde `page: 1` unutulursa fark etmesi ZOR bir hata olurdu.'
          },
          {
            satir: 'setPage: (state, action: PayloadAction<number>) => {',
            aciklama: 'TEK reducer — diğer beşinin AKSİNE `page`\'i `1`\'e SIFIRLAMIYOR, yalnızca kendi değerini yazıyor.',
            neden: 'Bu bilinçli bir ASİMETRİ: "Sonraki"/"Önceki" butonlarına tıklamak filtreyi DEĞİŞTİRMEZ, yalnızca AYNI filtrenin farklı bir sayfasını ister — sayfa 1\'e sıfırlansaydı, "Sonraki"ye her tıklama admin\'i tekrar 1. sayfaya ATARDI.',
            olmasaydi: '`setPage` de diğerleri gibi kendini sıfırlasaydı (anlamsız ama varsayalım), admin HİÇBİR ZAMAN 1. sayfadan ileri GİDEMEZDİ — her "Sonraki" tıklaması kendi kendini İPTAL ederdi.'
          },
          {
            satir: 'resetWordFilters: () => initialState,',
            aciklama: 'Argümansız bir reducer — mevcut state\'e BAKMADAN doğrudan `initialState`\'e döner.',
            neden: 'Diğer beş reducer `(state, action) => {...}` imzasına sahipken bu yalnızca `() => initialState` — çünkü "resetle" eylemi hiçbir GİRDİ (payload) gerektirmiyor, hangi state\'te olursa olsun SONUÇ hep aynı.',
            olmasaydi: '`resetWordFilters` her alanı TEK TEK `null`/`\'\'`/`1` yapan bir dizi atama olarak yazılsaydı, `initialState`\'e YENİ bir alan eklendiğinde (ör. gelecekte bir `sortBy`) bu reducer\'ın GÜNCELLENMESİ unutulabilirdi — `initialState`\'e dönmek bu riski TAMAMEN ortadan kaldırıyor.'
          }
        ]
      },
      {
        tur: 'kod',
        baslik: 'store.ts — wordFilterReducer Kaydı (Saf Ekleme)',
        dosyaYolu: 'admin/src/store/store.ts',
        nedenBuKlasor: 'B-01\'de kurulan kök store — yeni bir slice yazıldığında bu dosyaya İKİ satırlık bir ekleme (import + reducer anahtarı) yeterli, `configureStore`\'un GERİ KALANI değişmiyor.',
        kod: `import { configureStore } from '@reduxjs/toolkit'
import { api } from './api'
import authReducer from './slices/authSlice'
import languageReducer from './slices/languageSlice'
import themeReducer from './slices/themeSlice'
import wordFilterReducer from './slices/wordFilterSlice'

export const store = configureStore({
  reducer: {
    auth: authReducer,
    language: languageReducer,
    theme: themeReducer,
    wordFilter: wordFilterReducer,
    [api.reducerPath]: api.reducer,
  },
  middleware: (getDefaultMiddleware) => getDefaultMiddleware().concat(api.middleware),
})`,

          {

            olmasaydi: 'Bu satır unutulsaydı, `wordFilterSlice`\'ın reducer\'ları ÇAĞRILABİLİR olurdu (action\'lar dispatch edilebilirdi) ama HİÇBİR şeyi DEĞİŞTİRMEZDİ — store\'da o slice\'a AYRILMIŞ bir yer olmadığı için Redux o action\'ları SESSİZCE yok sayardı, `WordListPage` filtre UI\'ı hiç TEPKİ VERMEZDİ.'
          }
        ]
      },

          { terim: 'RootState', tanim: '`store.getState()`\'in dönüş tipinden TÜRETİLEN, TÜM slice\'ların birleşimi olan kök state tipi.' }

          '`resetWordFilters` argümansız — doğrudan `initialState`\'e döner, alan alan sıfırlama YAZMAZ',

        ]
