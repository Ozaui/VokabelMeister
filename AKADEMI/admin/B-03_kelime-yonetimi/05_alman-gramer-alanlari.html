<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GermanGrammarFields.tsx + ConjugationGrid.tsx</title>
<link rel="stylesheet" href="../engine/slides.css" />
</head>
<body>
<div id="app"></div>
<script>
  window.MODULE = {
    id: 'b03-alman-gramer',
    bolumBaslik: 'B-03 — Kelime Yönetimi',
    oncekiBolum: '04_wordformmodal.html',
    sonrakiBolum: '06_turkce-gramer-alanlari.html',
    slaytlar: [
      {
        tur: 'kapak',
        ustBaslik: 'BÖLÜM 5',
        baslik: 'GermanGrammarFields.tsx + ConjugationGrid.tsx',
        altBaslik: 'Almanca İsim (cinsiyet+çoğul+4 hâl) ve Fiil (ayrılabilirlik+yardımcı fiil+3 zaman×6 kişi çekim) — ve ikisinin de paylaştığı TEK bir çekim tablosu component\'i.'
      },
      {
        tur: 'kod',
        baslik: 'GermanGrammarFields.tsx — İsim Dalı: Cinsiyet + Çoğul + Hâller',
        dosyaYolu: 'admin/src/components/words/GermanGrammarFields.tsx',
        nedenBuKlasor: '`components/words/` — `WordFormModal`\'ın Bölüm 4\'te gördüğümüz `formik.setFieldValue` çağrısıyla bağlandığı, dile ÖZGÜ iki alt component\'ten biri.',
        kod: `import { useTranslation } from 'react-i18next'
import { ConjugationGrid } from './ConjugationGrid'
import type { GermanNounGrammarData, GermanVerbGrammarData, PartOfSpeech } from '../../types/word.types'

// GERMAN_LANGUAGE_FEATURES.md §10'un TS karşılığı — backend WordGrammarValidator'ın de dalıyla
// AYNI zorunlu/koşullu/yasak matrisi, kod paylaşımı yok (iki ayrı katman, bilinçli tekrar).
// Yalnızca GrammarData JSON alan adları (WordGrammarValidator ile birebir) — GÖSTERİLEN etiketler
// i18n'den (words.grammar.de.tenseLabels/personLabels/caseLabels) gelir, CLAUDE.md §1 "admin
// panelin kendi statik arayüz metinleri react-i18next ile çevrilir" kuralı burada da geçerli.
const DE_VERB_TENSE_KEYS = ['present', 'preterite', 'perfect'] as const
const DE_PERSON_KEYS = ['ich', 'du', 'erSieEs', 'wir', 'ihr', 'sie'] as const
const DE_CASE_KEYS = ['nominative', 'accusative', 'dative', 'genitive'] as const

interface GermanGrammarFieldsProps {
  partOfSpeech: PartOfSpeech
  value: GermanNounGrammarData | GermanVerbGrammarData | undefined
  onChange: (value: GermanNounGrammarData | GermanVerbGrammarData) => void
}

export function GermanGrammarFields({ partOfSpeech, value, onChange }: GermanGrammarFieldsProps) {
  const { t } = useTranslation()

  if (partOfSpeech === 'Noun') {
    const noun = value as GermanNounGrammarData | undefined
    const setField = (patch: Partial<GermanNounGrammarData>) =>
      onChange({ gender: 'Masculine', plural: '', cases: { nominative: '', accusative: '', dative: '', genitive: '' }, ...noun, ...patch })

    return (
      <div className="flex flex-col gap-3">
        <div>
          <label className="mb-1 block text-sm font-medium text-text">
            {t('words.grammar.de.gender')} <span className="text-destructive">*</span>
          </label>
          <select
            value={noun?.gender ?? 'Masculine'}
            onChange={(e) => setField({ gender: e.target.value as GermanNounGrammarData['gender'] })}
            className="w-full rounded-control border border-border bg-background px-3 py-2 text-sm text-text"
          >
            <option value="Masculine">der ({t('words.grammar.de.masculine')})</option>
            <option value="Feminine">die ({t('words.grammar.de.feminine')})</option>
            <option value="Neuter">das ({t('words.grammar.de.neuter')})</option>
          </select>
        </div>
        <div>
          <label className="mb-1 block text-sm font-medium text-text">
            {t('words.grammar.de.plural')} <span className="text-destructive">*</span>
          </label>
          <input
            type="text"
            value={noun?.plural ?? ''}
            onChange={(e) => setField({ plural: e.target.value })}
            className="w-full rounded-control border border-border bg-background px-3 py-2 text-sm text-text"
          />
        </div>
        <div>
          <p className="mb-1 text-sm font-medium text-text">
            {t('words.grammar.de.cases')} <span className="text-destructive">*</span>
          </p>
          <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
            {DE_CASE_KEYS.map((caseKey) => (
              <div key={caseKey}>
                <label className="mb-1 block text-xs text-muted">{t(\`words.grammar.de.caseLabels.\${caseKey}\`)}</label>
                <input
                  type="text"
                  value={noun?.cases?.[caseKey] ?? ''}
                  onChange={(e) =>
                    setField({
                      cases: {
                        nominative: '',
                        accusative: '',
                        dative: '',
                        genitive: '',
                        ...noun?.cases,
                        [caseKey]: e.target.value,
                      },
                    })
                  }
                  className="w-full rounded-control border border-border bg-background px-2 py-1 text-sm text-text"
                />
              </div>
            ))}
          </div>
        </div>
      </div>
    )
  }`,
        satirlar: [
          {
            satir: "const DE_CASE_KEYS = ['nominative', 'accusative', 'dative', 'genitive'] as const",
            aciklama: 'Dört Almanca hâl, İngilizce alan adlarıyla — `as const` bu diziyi salt-okunur bir TUPLE\'a çevirir, `caseKey`\'in tipi `string` değil `\'nominative\' | \'accusative\' | \'dative\' | \'genitive\'` OLUR.',
            neden: '`as const` OLMASAYDI, `noun?.cases?.[caseKey]` ifadesindeki `caseKey`\'in tipi geniş bir `string` olurdu ve `cases` NESNESİNİN dört SABİT alanından biriyle EŞLEŞTİĞİ TypeScript\'e KANITLANAMAZDI — `.map()` içindeki indeksleme (`noun?.cases?.[caseKey]`) tip GÜVENLİĞİNİ KAYBEDERDİ.',
            olmasaydi: '`as const` olmasaydı, biri bu diziye YANLIŞLIKLA `\'nominatve\'` (yazım hatası) EKLESEYDİ, TypeScript bunu `cases` nesnesinin GEÇERLİ bir alanı OLARAK kabul ederdi (çünkü tip zaten geniş `string`) — hata yalnızca ÇALIŞMA zamanında, o hücre HİÇBİR ZAMAN doğru veriyle EŞLEŞMEDİĞİNDE fark edilirdi.'
          },
          {
            satir: "onChange({ gender: 'Masculine', plural: '', cases: { nominative: '', accusative: '', dative: '', genitive: '' }, ...noun, ...patch })",
            aciklama: 'Her alan değişikliğinde TÜM nesne YENİDEN inşa edilir: ÖNCE varsayılanlar, SONRA var olan `noun`, EN SONDA yeni `patch` — spread SIRASI önemli, sonraki üzerine YAZAR.',
            neden: '`GrammarData` alanları BİRBİRİNE bağımlı DEĞİL (bir hâl değiştiğinde diğer hâller/cinsiyet/çoğul KORUNMALI) ama `value` prop\'u BAŞLANGIÇTA `undefined` OLABİLİR (yeni bir çeviri, henüz hiç gramer girilmemiş) — varsayılanlar bu durumda `noun?.x` her yerde `?? \'\'` YAZMak yerine TEK bir yerde ÇÖZÜYOR.',
            olmasaydi: 'Varsayılan nesne İLK spread OLMASAYDI (yalnızca `...noun, ...patch` olsaydı), `noun` `undefined` iken (form YENİ açıldığında) `onChange` eksik ALANLARLA bir nesne ÜRETİRDİ — `GermanNounGrammarData`\'nın `cases` gibi zorunlu bir ALT nesnesi HİÇ olmadan backend\'e giderdi.'
          }
        ]
      },
      {
        tur: 'kod',
        baslik: 'GermanGrammarFields.tsx — Fiil Dalı: Ayrılabilirlik + Çekim',
        dosyaYolu: 'admin/src/components/words/GermanGrammarFields.tsx',
        nedenBuKlasor: 'Aynı dosya, `partOfSpeech === \'Verb\'` dalı — isim dalının HEMEN altında, `if (partOfSpeech === \'Noun\') {...return...}` bloğu bittikten SONRA.',
        kod: `  // partOfSpeech === 'Verb'
  const verb = value as GermanVerbGrammarData | undefined
  const setVerbField = (patch: Partial<GermanVerbGrammarData>) =>
    onChange({
      isSeparableVerb: false,
      auxiliaryVerb: '',
      pastParticiple: '',
      conjugation: {
        present: { ich: '', du: '', erSieEs: '', wir: '', ihr: '', sie: '' },
        preterite: { ich: '', du: '', erSieEs: '', wir: '', ihr: '', sie: '' },
        perfect: { ich: '', du: '', erSieEs: '', wir: '', ihr: '', sie: '' },
      },
      ...verb,
      ...patch,
    })

  return (
    <div className="flex flex-col gap-3">
      <label className="flex items-center gap-2 text-sm font-medium text-text">
        <input
          type="checkbox"
          checked={verb?.isSeparableVerb ?? false}
          onChange={(e) =>
            setVerbField({
              isSeparableVerb: e.target.checked,
              separablePrefix: e.target.checked ? verb?.separablePrefix : undefined,
            })
          }
        />
        {t('words.grammar.de.isSeparableVerb')} <span className="text-destructive">*</span>
      </label>
      {verb?.isSeparableVerb && (
        <div>
          <label className="mb-1 block text-sm font-medium text-text">
            {t('words.grammar.de.separablePrefix')} <span className="text-destructive">*</span>
          </label>
          <input
            type="text"
            value={verb?.separablePrefix ?? ''}
            onChange={(e) => setVerbField({ separablePrefix: e.target.value })}
            className="w-full rounded-control border border-border bg-background px-3 py-2 text-sm text-text"
          />
        </div>
      )}
      <div>
        <label className="mb-1 block text-sm font-medium text-text">
          {t('words.grammar.de.auxiliaryVerb')} <span className="text-destructive">*</span>
        </label>
        <input
          type="text"
          value={verb?.auxiliaryVerb ?? ''}
          onChange={(e) => setVerbField({ auxiliaryVerb: e.target.value })}
          className="w-full rounded-control border border-border bg-background px-3 py-2 text-sm text-text"
        />
      </div>
      <div>
        <label className="mb-1 block text-sm font-medium text-text">
          {t('words.grammar.de.pastParticiple')} <span className="text-destructive">*</span>
        </label>
        <input
          type="text"
          value={verb?.pastParticiple ?? ''}
          onChange={(e) => setVerbField({ pastParticiple: e.target.value })}
          className="w-full rounded-control border border-border bg-background px-3 py-2 text-sm text-text"
        />
      </div>
      <div>
        <p className="mb-1 text-sm font-medium text-text">
          {t('words.grammar.de.conjugation')} <span className="text-destructive">*</span>
        </p>
        <ConjugationGrid
          tenses={DE_VERB_TENSE_KEYS.map((key) => ({ key, label: t(\`words.grammar.de.tenseLabels.\${key}\`) }))}
          persons={DE_PERSON_KEYS.map((key) => ({ key, label: t(\`words.grammar.de.personLabels.\${key}\`) }))}
          value={verb?.conjugation}
          onChange={(conjugation) =>
            setVerbField({ conjugation: conjugation as GermanVerbGrammarData['conjugation'] })
          }
        />
      </div>
    </div>
  )
}`,
        satirlar: [
          {
            satir: "isSeparableVerb: e.target.checked,\n              separablePrefix: e.target.checked ? verb?.separablePrefix : undefined,",
            aciklama: 'Checkbox İŞARETİ KALDIRILDIĞINDA (`e.target.checked` false), `separablePrefix` da AYNI ANDA `undefined`\'a döner — ayrı bir "temizle" adımı YOK.',
            neden: 'Backend `WordGrammarValidator` `isSeparableVerb=false` iken `separablePrefix`\'in DOLU olmasını YASAKLIYOR (`GRAMMAR_DE_VERB_SEPARABLE_PREFIX_FORBIDDEN`) — admin checkbox\'ı işaretleyip bir ön ek yazdıktan SONRA fikrini değiştirip checkbox\'ı KALDIRSA, eski ön ek state\'te KALIRSA backend bu isteği REDDEDERDİ.',
            olmasaydi: 'Bu satır olmasaydı (yalnızca `isSeparableVerb: e.target.checked` yazılsaydı), checkbox kaldırıldığında `separablePrefix` ESKİ değerinde KALIRDI (JSX zaten `{verb?.isSeparableVerb && (...)}` ile o INPUT\'u GİZLER, ama STATE\'TEKİ değer SİLİNMEZ) — kaydet\'e basıldığında backend "ayrılabilir değilsin ama ön ekin var" diye 400 dönerdi, admin EKRANDA GÖRMEDİĞİ bir alan yüzünden hata alırdı.'
          },
          {
            satir: "<ConjugationGrid",
            aciklama: 'Üç zaman (`present`/`preterite`/`perfect`) × altı kişi = 18 hücrelik çekim tablosu — Almanca\'ya ÖZGÜ zaman/kişi anahtarları PROP olarak geçiliyor, `ConjugationGrid`\'in KENDİSİ hiçbir dile ÖZGÜ değer BİLMİYOR.',
            neden: 'Türkçe fiil çekimi de (Bölüm 6) AYNI şekle (zaman × kişi → metin) sahip ama BEŞ zaman × altı kişi = 30 hücre — iki ayrı, neredeyse BİREBİR aynı tablo bileşeni yazmak yerine TEK generic bir component, aşağıdaki kavram slaydında detaylı.',
            olmasaydi: 'Almanca ve Türkçe için AYRI çekim tablosu component\'leri yazılsaydı (`GermanConjugationGrid`, `TurkishConjugationGrid`), tablo GÖRÜNÜMÜNDE bir düzeltme (ör. hücre genişliği, mobilde yatay kaydırma) gerektiğinde bu düzeltme İKİ AYRI dosyada TEKRARLANIRDI — biri unutulsa iki tablo BİRBİRİNDEN SAPARDI.'
          }
        ]
      },
      {
        tur: 'kavram',
        baslik: 'Neden TEK Bir Generic ConjugationGrid — İki Değil',
        aciklama: 'Almanca çekim (3 zaman×6 kişi=18 hücre) ve Türkçe çekim (5 zaman×6 kişi=30 hücre) SAYICA farklı ama YAPICA birebir aynı: bir zaman × kişi ızgarası, her hücre bir metin girişi. `ConjugationGrid<TTense, TPerson>` bu ORTAK yapıyı TEK bir generic component\'te yakalıyor, hangi zaman/kişi etiketlerinin kullanılacağını çağıran component (German/TurkishGrammarFields) PROP olarak veriyor.',
        neden: 'Generic tipler (`TTense extends string`, `TPerson extends string`) sayesinde `ConjugationGrid` hem Almanca\'nın `\'present\'|\'preterite\'|\'perfect\'` anahtarlarıyla hem Türkçe\'nin `\'presentContinuous\'|\'aorist\'|...` anahtarlarıyla TİP GÜVENLİ çalışıyor — iki dil ayrı component olsaydı KAZANILACAK hiçbir şey yok, KAYBEDİLECEK bakım maliyeti VAR.',
        olmasaydi: 'İki ayrı, neredeyse BİREBİR aynı component (`GermanConjugationGrid`/`TurkishConjugationGrid`) yazılsaydı, `satirlar`\'da yukarıda bahsedilen "bir düzeltme iki yerde tekrarlanır" riskinin YANI SIRA, kod tabanında "hangi ConjugationGrid\'i kullanmalıyım" diye bir SEÇİM sorusu da ORTAYA çıkardı — generic TEK component bu soruyu HİÇ sormaya gerek BIRAKMIYOR.'
      },
      {
        tur: 'kod',
        baslik: 'ConjugationGrid.tsx — Generic Zaman × Kişi Izgarası',
        dosyaYolu: 'admin/src/components/words/ConjugationGrid.tsx',
        nedenBuKlasor: '`components/words/` — hem `GermanGrammarFields` hem `TurkishGrammarFields` bu TEK dosyayı import EDİYOR.',
        kod: `// DE (3 zaman × 6 kişi = 18 hücre) ve TR (5 zaman × 6 kişi = 30 hücre) çekim tabloları AYNI
// şekle sahip (Record<tense, Record<person, string>>) — bu yüzden tek, parametreli bir grid.
interface ConjugationGridProps<TTense extends string, TPerson extends string> {
  tenses: readonly { key: TTense; label: string }[]
  persons: readonly { key: TPerson; label: string }[]
  value: Partial<Record<TTense, Partial<Record<TPerson, string>>>> | undefined
  onChange: (value: Partial<Record<TTense, Partial<Record<TPerson, string>>>>) => void
}

export function ConjugationGrid<TTense extends string, TPerson extends string>({
  tenses,
  persons,
  value,
  onChange,
}: ConjugationGridProps<TTense, TPerson>) {
  const setCell = (tense: TTense, person: TPerson, text: string) => {
    onChange({
      ...value,
      [tense]: { ...value?.[tense], [person]: text },
    })
  }

  return (
    <div className="overflow-x-auto rounded-control border border-border">
      <table className="w-full text-sm">
        <thead>
          <tr className="bg-background">
            <th className="p-2 text-left font-medium text-muted">&nbsp;</th>
            {persons.map((person) => (
              <th key={person.key} className="p-2 text-left font-medium text-muted">
                {person.label}
              </th>
            ))}
          </tr>
        </thead>
        <tbody>
          {tenses.map((tense) => (
            <tr key={tense.key} className="border-t border-border">
              <td className="p-2 font-medium text-text">{tense.label}</td>
              {persons.map((person) => (
                <td key={person.key} className="p-1">
                  <input
                    type="text"
                    value={value?.[tense.key]?.[person.key] ?? ''}
                    onChange={(e) => setCell(tense.key, person.key, e.target.value)}
                    className="w-full rounded-control border border-border bg-background px-2 py-1 text-sm text-text"
                  />
                </td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  )
}`,
        satirlar: [
          {
            satir: 'interface ConjugationGridProps<TTense extends string, TPerson extends string> {',
            aciklama: 'İki generic tip parametresi — `TTense`/`TPerson` çağıran component\'in verdiği SOMUT string birleşimleriyle (ör. Almanca\'da `\'present\'|\'preterite\'|\'perfect\'`) DOLAR.',
            neden: '`extends string` sınırı, bu iki tipin nesne ANAHTARI olarak kullanılabilir OLMASINI garanti eder (`Record<TTense, ...>` gibi) — generic OLMASAYDI bu component ya `any` kullanır ya da HER dil için AYRI yazılırdı.',
            olmasaydi: 'Generic parametreler OLMASAYDI ve `tense`/`person` tipleri düz `string` olsaydı, `value?.[tense.key]?.[person.key]` ifadesi TypeScript\'e göre HER ZAMAN geçerli GÖRÜNÜRDÜ — yanlış bir zaman/kişi anahtarı (ör. Almanca tablosuna Türkçe\'nin `\'aorist\'`ini vermek) derleme zamanında YAKALANMAZDI.'
          },
          {
            satir: 'onChange({\n      ...value,\n      [tense]: { ...value?.[tense], [person]: text },\n    })',
            aciklama: 'Yalnızca DEĞİŞEN hücrenin bulunduğu zaman satırı YENİDEN inşa edilir (`...value?.[tense]` ile o satırın DİĞER kişileri korunur), diğer zaman satırları OLDUĞU gibi spread edilir (`...value`).',
            neden: 'Bir çekim tablosunda TEK bir hücreye yazı yazmak, DİĞER 17-29 hücrenin değerini KORUMALI — yalnızca değişen hücrenin İÇİNDE bulunduğu iç içe (nested) nesneyi yeniden inşa etmek, geri kalan HER ŞEYİ olduğu gibi bırakır.',
            olmasaydi: 'İç içe spread (`...value?.[tense]`) atlanıp yalnızca `[tense]: { [person]: text }` yazılsaydı, o zaman satırındaki DİĞER beş kişinin değeri (ör. `ich` doldururken `du`/`er` vb.) SESSİZCE SİLİNİRDİ — kullanıcı her hücreyi doldururken bir ÖNCEKİ hücrenin verisi KAYBOLURDU.'
          }
        ]
      },
      {
        tur: 'sozluk',
        baslik: 'Bu Bölümde Geçen Terimler',
        terimler: [
          { terim: 'as const', tanim: 'TypeScript\'e bir diziyi/nesneyi SALT OKUNUR ve olabildiğince DAR (literal) tiplerle ele almasını söyleyen işaretleyici — `[\'a\',\'b\']` yerine `readonly [\'a\',\'b\']` ve elemanların tipi `string` değil `\'a\'|\'b\'` OLUR.' },
          { terim: 'Generic Component', tanim: 'Belirli bir veri tipine değil, ÇAĞRILDIĞI yerde verilen tip PARAMETRELERİNE göre şekillenen React component\'i — `ConjugationGrid<TTense, TPerson>`.' },
          { terim: 'Partial<Record<K, V>>', tanim: '`K` tipindeki HER anahtarın (opsiyonel olarak) `V` tipinde bir değere sahip olabileceği bir nesne tipi — çekim tablosunun HENÜZ tamamlanmamış (bazı hücreleri boş) hâlini modellemek için.' },
          { terim: 'İç İçe Spread (Nested Spread)', tanim: 'Bir nesnenin İÇİNDEKİ bir alt nesneyi de `{...obj, key: {...obj.key, ...}}` şeklinde KORUYARAK güncelleme deseni.' }
        ]
      },
      {
        tur: 'ozet',
        baslik: 'Bu Bölümde Öğrendiklerimiz',
        maddeler: [
          'Almanca İsim: cinsiyet (der/die/das) + çoğul + 4 hâl, HEPSİ zorunlu (`*` işaretli)',
          'Almanca Fiil: ayrılabilirlik checkbox\'ı KENDİ ön ek alanının zorunlu/yasak durumunu KONTROL ediyor',
          '`ConjugationGrid<TTense,TPerson>` — TEK generic component, Almanca (18 hücre) ve Türkçe (30 hücre) İKİSİNİ de karşılıyor',
          'Her hücre güncellemesi İÇ İÇE spread ile yalnızca KENDİ konumunu değiştiriyor, geri kalanı KORUYOR',
          'Sırada: Türkçe gramer — aynı desen, ama ÜNLÜ UYUMU/İYELİK gibi Almanca\'da hiç OLMAYAN kavramlarla (Bölüm 6)'
        ]
      }
    ]
  };
</script>
<script src="../engine/slides-engine.js"></script>
</body>
