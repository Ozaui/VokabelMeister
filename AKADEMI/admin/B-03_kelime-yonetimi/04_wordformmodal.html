  // Verilmezse "ekle" modu (yeni WordConcept, tek dil seçilerek başlar) — verilirse "düzenle"
  // modu (concept'in var olan çevirileri düzenlenir, yeni dil EKLENMEZ — o WordPairingPage'in işi).
  initialData?: WordConceptDetail
  onClose: () => void
}

function toFormValues(initialData: WordConceptDetail | undefined): WordFormValues {
  if (!initialData) {
    return {
      partOfSpeech: 'Noun',
      difficultyLevel: 'A1',
      imageUrl: '',
      categoryIds: [],
      translations: [{ languageCode: 'de', text: '', definition: '', wordDetail: undefined, examples: [] }],
    }
  }

  return {
    partOfSpeech: initialData.partOfSpeech,
    difficultyLevel: initialData.difficultyLevel,
    imageUrl: initialData.imageUrl ?? '',
    categoryIds: initialData.categories.map((c) => c.categoryId),
    translations: initialData.translations.map((translation) => ({
      languageCode: translation.languageCode,
      text: translation.text,
      definition: translation.definition ?? '',
      wordDetail: translation.wordDetail
        ? {
            pronunciation: translation.wordDetail.pronunciation ?? '',
            audioUrl: translation.wordDetail.audioUrl ?? '',
            notes: translation.wordDetail.notes ?? '',
            commonMistakes: translation.wordDetail.commonMistakes ?? '',
            grammarData: translation.wordDetail.grammarData ?? undefined,
          }
        : undefined,
      // UpdateWordCommand yalnızca EKLEME yapar (bkz. WordExamplesFields yorumu) — var olan
      // örnekler burada tekrar gönderilmez, liste boş başlar.
      examples: [],
    })),
  }
}`,

        tur: 'kod',

        nedenBuKlasor: 'Component fonksiyonunun İLK satırları — `toFormValues`\'un hemen ALTINDA, henüz hiçbir JSX yok, yalnızca mutation hook\'ları ve yerel state.',
        kod: `export function WordFormModal({ initialData, onClose }: WordFormModalProps) {
  const { t } = useTranslation()
  const isEdit = !!initialData
  const [createWord, { isLoading: isCreating }] = useCreateWordMutation()
  const [updateWord, { isLoading: isUpdating }] = useUpdateWordMutation()
  const [formError, setFormError] = useState<string | null>(null)
  const [duplicatePending, setDuplicatePending] = useState<WordFormValues | null>(null)

          {
            satir: 'const [createWord, { isLoading: isCreating }] = useCreateWordMutation()',

            neden: 'Bu değişikliğin component koduna YANSIMASI minimal tutuldu — `useApiMutation`\'ın tuple şeklini RTK Query\'ninkine BENZER tutmak (Bölüm 2), bu satırın hiç DEĞİŞMEDEN kalabilmesini sağladı; aşağıdaki `submit`\'te DEĞİŞEN tek şey `.unwrap()`\'ın kalkması.',

          {

            neden: 'Kaydet butonu hangi modda olursa olsun (ekle/düzenle) AYNI şekilde devre dışı kalmalı — iki bayrağı her kullanım yerinde ayrı ayrı `isCreating || isUpdating` yazmak yerine BİR kez hesaplayıp isimlendirmek, ileride üçüncü bir mutation eklenirse tek bir satırın güncellenmesini yeterli kılıyor.',
            olmasaydi: 'Bu türetilmiş değer olmasaydı ve buton yalnızca `isCreating` kontrol etseydi, düzenleme modunda `updateWord` isteği SÜRERKEN kaydet butonu aktif KALIRDI — admin isteği bitmeden tekrar tıklayıp aynı güncellemeyi İKİNCİ kez tetikleyebilirdi.'

      {
        tur: 'kod',
        baslik: 'WordFormModal.tsx — submit: grammarData\'nın Koşullu İnşası',
        dosyaYolu: 'admin/src/components/words/WordFormModal.tsx',
        nedenBuKlasor: 'Aynı dosya, component gövdesinin İÇİNDE — `useFormik`\'ten ÖNCE tanımlanıyor, çünkü `useFormik`\'in `onSubmit` alanı (aşağıdaki slayt) bu fonksiyona bir REFERANS veriyor.',
        kod: `const submit = async (values: WordFormValues, force: boolean) => {
    setFormError(null)
    const hasGrammar = values.partOfSpeech === 'Noun' || values.partOfSpeech === 'Verb'
    const payload = {
      partOfSpeech: values.partOfSpeech,
      difficultyLevel: values.difficultyLevel,
      imageUrl: values.imageUrl || null,
      categoryIds: values.categoryIds,
      translations: values.translations.map((translation) => ({
        languageCode: translation.languageCode,
        text: translation.text,
        definition: translation.definition || null,
        // Noun/Verb'de grammarData ZORUNLU (WordGrammarValidator GRAMMAR_DATA_REQUIRED), diğer
        // türlerde tamamen NULL olmalı (GRAMMAR_DATA_MUST_BE_NULL_FOR_OTHER) — wordDetail'in
        // diğer alanları (telaffuz/ses/not) türden bağımsız her zaman gönderilebilir.
        wordDetail: translation.wordDetail
          ? {
              pronunciation: translation.wordDetail.pronunciation || null,
              audioUrl: translation.wordDetail.audioUrl || null,
              notes: translation.wordDetail.notes || null,
              commonMistakes: translation.wordDetail.commonMistakes || null,
              grammarData: hasGrammar ? (translation.wordDetail.grammarData ?? null) : null,
            }
          : hasGrammar
            ? { pronunciation: null, audioUrl: null, notes: null, commonMistakes: null, grammarData: null }
            : null,
        examples: translation.examples && translation.examples.length > 0 ? translation.examples : undefined,
      })),
    }

    try {
      if (isEdit) {
        await updateWord({ body: { id: initialData!.wordConceptId, ...payload }, force })
      } else {
        await createWord({ body: payload, force })
      }
      setDuplicatePending(null)
      onClose()
    } catch (err) {
      if (!force && getApiErrorCode(err) === 'WORD_TEXT_ALREADY_EXISTS') {
        setDuplicatePending(values)
        return
      }
      setFormError(getApiErrorMessage(err) ?? t('auth.genericError'))
    }
  }`,
        satirlar: [
          {
            satir: "const hasGrammar = values.partOfSpeech === 'Noun' || values.partOfSpeech === 'Verb'",
            aciklama: '`submit`\'in KENDİ, yerel bir `hasGrammar` hesaplaması — aşağıdaki `useFormik` slaydında görülecek component-seviyesi `hasGrammar`\'dan (render\'ı kontrol eden) BAĞIMSIZ, ikinci bir hesaplama.',
            neden: '`submit`, gönderdiği `payload`\'ı HER ZAMAN kendisine PARAMETRE olarak gelen `values`\'e göre inşa etmeli — "yine de ekle" akışında (Bölüm 4 devamı) `submit(duplicatePending, true)` GEÇMİŞTE saklanmış bir `values` anlık görüntüsüyle ÇAĞRILIYOR; bu görüntünün gramer kararı, o ANDA formun canlı state\'ine değil, GÖNDERİLEN değerin kendisine dayanmalı.',
            olmasaydi: 'Yerine component-seviyesi `hasGrammar` kullanılsaydı, "yine de ekle" butonuna basıldığı ANDAKİ form durumu (ör. admin arada tür\'ü değiştirmiş olabilir) `duplicatePending`\'in SAKLADIĞI eski değerlerle ÇELİŞEBİLİRDİ — payload, gönderilen `values` ile TUTARSIZ bir gramer kararıyla inşa edilirdi.'
          },
          {
            satir: "grammarData: hasGrammar ? (translation.wordDetail.grammarData ?? null) : null,",
            aciklama: 'Tür Noun/Verb İSE forma girilen gramer verisi gönderilir, DEĞİLSE (Adjective/Adverb/...) `grammarData` HER ZAMAN `null` — kullanıcı ne yazmış olursa olsun.',
            neden: 'Backend `WordGrammarValidator`\'ın "diğer türlerde GrammarData tamamen NULL olmalı" kuralına (`GRAMMAR_DATA_MUST_BE_NULL_FOR_OTHER`) MECBUR uyuyor — admin tür\'ü ÖNCE Noun/gramer doldurup SONRA "Diğer"e çevirse bile, form eski gramer verisini GÖNDERMEZ.',
            olmasaydi: 'Admin türü Noun\'dan "Diğer"e çevirdiğinde eski `grammarData` state\'te KALSAYDI ve `hasGrammar` kontrolü OLMASAYDI, backend bu isteği 400 (`GRAMMAR_DATA_MUST_BE_NULL_FOR_OTHER`) ile REDDEDERDİ — admin "hiçbir şey yapmadım, neden hata alıyorum" diye ŞAŞIRIRDI, çünkü hatanın sebebi ARTIK ekranda GÖRÜNMEYEN bir alan.'
          },
          {
            satir: "await updateWord({ body: { id: initialData!.wordConceptId, ...payload }, force })",
            aciklama: 'RTK Query\'nin `.unwrap()`\'ı YOK — Bölüm 2\'deki `useApiMutation` zaten axios\'un native Promise reddini KULLANIYOR, `updateWord(...)` DOĞRUDAN `await`lenebilir düz bir `Promise<WordConceptDetail>` döndürüyor.',
            neden: 'RTK Query\'nin `trigger(arg)` çağrısı HATA durumunda bile RESOLVE olan bir nesne döndürürdü (`.unwrap()` asıl hatayı FIRLATMAK için ZORUNLUYDU) — axios tabanlı `useApiMutation` bu ekstra adımı GEREKSİZ kılıyor, hata zaten native `catch` bloğuna DÜŞÜYOR.',
            olmasaydi: '`.unwrap()` hâlâ çağrılsaydı, TypeScript bu metodun `useApiMutation`\'ın döndürdüğü düz `Promise<WordConceptDetail>` üzerinde YOK olduğunu söyleyip DERLEME hatası verirdi.'
          },
          {
            satir: "if (!force && getApiErrorCode(err) === 'WORD_TEXT_ALREADY_EXISTS') {",
            aciklama: '`force` ZATEN true İSE bu dal hiç ÇALIŞMAZ — yalnızca İLK denemede (force olmadan) 409 alındıysa "yine de ekle" uyarısı gösterilir.',
            neden: '`force=true` ile TEKRAR gönderilen bir istek YİNE 409 dönerse (ör. ARADA başka bir admin AYNI metni GERÇEKTEN engellenmesi gereken bir şekilde eklediyse), bu artık "yine de ekle?" diye SORULACAK bir durum DEĞİL — sonsuz bir onay döngüsüne girmemek için `!force` şartı bu ihtimali KAPATIYOR.',
            olmasaydi: '`!force` kontrolü olmasaydı, `force=true` ile gönderilen bir istek YİNE 409 alırsa `setDuplicatePending` TEKRAR tetiklenir, "yine de ekle" butonu TEKRAR görünür, admin TEKRAR tıklar — backend GERÇEKTEN reddetmek istediği bir durumda bile UI sonsuza kadar "belki bu sefer olur" diye ISRAR ederdi.'

          }
        ]
      },
      {
        tur: 'kod',
        baslik: 'WordFormModal.tsx — useFormik: initialValues + Yup Şeması + onSubmit',
        dosyaYolu: 'admin/src/components/words/WordFormModal.tsx',
        nedenBuKlasor: '`submit`\'in HEMEN altında — Formik\'in `onSubmit` alanı `submit`\'e bir REFERANS verdiği için, `submit` bu noktada zaten tanımlanmış olmalı.',
        kod: `  const formik = useFormik<WordFormValues>({
    initialValues: toFormValues(initialData),
    validationSchema: wordFormSchema,
    onSubmit: (values) => submit(values, false),
