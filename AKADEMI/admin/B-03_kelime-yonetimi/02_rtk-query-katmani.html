async function fetchWordById(id: number): Promise<WordConceptDetail> {

  return data

        kod: `import { useEffect, useRef, useState } from 'react'

interface UseApiQueryOptions {
  // RTK Query'nin skip'iyle aynı amaç — ör. WordPairingPage dil id'si henüz gelmemişken
  // (languageId: 0) isteği hiç atmaz.
  skip?: boolean
}

interface UseApiQueryResult<T> {
  data: T | undefined
  error: unknown
  isLoading: boolean
  refetch: () => void
}

// RTK Query'nin providesTags/invalidatesTags'ı yok — axios'a geçişte cache invalidation'ın
// yerini bilinçli olarak BASİT bir refetch() aldı (CLAUDE.md §3 "spekülatif ortak tip yazılmaz"
// ilkesiyle aynı gerekçe: burada henüz ihtiyaç duyulmayan bir cache katmanı kurmuyoruz).
export function useApiQuery<T, P>(
  fetcher: (params: P) => Promise<T>,
  params: P,
  options?: UseApiQueryOptions,
): UseApiQueryResult<T> {
  const skip = options?.skip ?? false
  const [data, setData] = useState<T>()
  const [error, setError] = useState<unknown>()
  const [isLoading, setIsLoading] = useState(!skip)
  const [reloadToken, setReloadToken] = useState(0)
  const paramsRef = useRef(params)
  paramsRef.current = params
  const fetcherRef = useRef(fetcher)
  fetcherRef.current = fetcher
  const paramsKey = JSON.stringify(params)

  useEffect(() => {
    if (skip) return
    let cancelled = false
    setIsLoading(true)
    fetcherRef
      .current(paramsRef.current)
      .then((result) => {
        if (cancelled) return
        setData(result)
        setError(undefined)
      })
      .catch((err: unknown) => {
        if (cancelled) return
        setError(err)
      })
      .finally(() => {
        if (!cancelled) setIsLoading(false)
      })
    return () => {
      cancelled = true
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [paramsKey, skip, reloadToken])

  return { data, error, isLoading, refetch: () => setReloadToken((t) => t + 1) }
}`,

            neden: 'React\'in `useEffect` bağımlılık karşılaştırması REFERANS eşitliğine (`===`) bakar — `params` OBJESİ her render\'da yeni bir referans olsaydı ve `paramsKey` OLMASAYDI, effect HER render\'da yeniden ÇALIŞIRDI (sonsuz istek döngüsü riski), çünkü içerik AYNI olsa bile referans HER ZAMAN farklı.',

        kod: `import { useState } from 'react'

type UseApiMutationResult<T, A> = [(arg: A) => Promise<T>, { isLoading: boolean }]

// RTK Query mutation hook'larının yerini alır — trigger promise'i RTK'daki gibi .unwrap()
// GEREKTİRMEZ, axios zaten 2xx dışı yanıtlarda reject eder (çağıran taraf düz try/catch kullanır).
export function useApiMutation<T, A>(mutationFn: (arg: A) => Promise<T>): UseApiMutationResult<T, A> {
  const [isLoading, setIsLoading] = useState(false)

  const trigger = async (arg: A) => {
    setIsLoading(true)
    try {
      return await mutationFn(arg)
    } finally {
      setIsLoading(false)
    }
  }

  return [trigger, { isLoading }]
}`,

            olmasaydi: 'Dönüş şekli TAMAMEN farklı OLSAYDI (ör. yalnızca `{trigger, isLoading}` bir NESNE), bu geçişte HER mutation çağıran component\'in destructuring KODU da DEĞİŞTİRİLMEK zorunda kalırdı — tuple şeklini KORUMAK bu değişikliği yalnızca `.unwrap()` satırlarına İNDİRGEDİ.'

            neden: 'RTK Query\'nin `trigger(arg)` çağrısı normalde HATA DURUMUNDA bile RESOLVE olan bir nesne DÖNDÜRÜR (`{data}` veya `{error}`) — asıl hatayı FIRLATMASI için `.unwrap()` ZORUNLUYDU; axios bu adımı GEREKSİZ kılıyor çünkü zaten native Promise semantiğiyle REDDEDİYOR.',

        kod: `// B-03 (WordFormModal) — "409 DuplicateWordException (WORD_TEXT_ALREADY_EXISTS) → ?force=true ile
