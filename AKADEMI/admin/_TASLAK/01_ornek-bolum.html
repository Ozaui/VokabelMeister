<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Şablon Bölüm</title>
<link rel="stylesheet" href="../engine/slides.css" />
</head>
<body>
<div id="app"></div>
<script>
  // AMAÇ: Bu dosya, Admin Akademi'ye (AKADEMI/admin/) yeni bir bölüm eklerken kopyalanacak ŞABLONDUR.
  // NEDEN: Her slayt türünün en az bir çalışan örneğini içerir — yeni bir yazar (insan ya da AI)
  //        şemayı ezberlemek yerine buradan kopyalayıp alanları doldurabilir. Ortak slayt
  //        türleri (kapak/kavram/kod/karsilastirma/sozluk/ozet) → AKADEMI/backend/STANDART.md §3,
  //        admin'e özgü `onizleme` türü → AKADEMI/admin/STANDART.md §2.
  window.MODULE = {
    id: 'sablon-ornek-bolum',
    bolumBaslik: 'B-0X — Görev Adı',       // topbar breadcrumb'ında görünür
    oncekiBolum: null,                      // önceki bölüm dosyasının göreli yolu, yoksa null
    sonrakiBolum: null,                     // sonraki bölüm dosyasının göreli yolu, yoksa null

    slaytlar: [
      // 1) KAPAK — bölümün ilk slaytı, yalnızca başlık ekranı.
      {
        tur: 'kapak',
        ustBaslik: 'BÖLÜM X',
        baslik: 'Slayt Başlığı Buraya',
        altBaslik: 'Bir-iki cümlelik alt başlık: bu bölümde ne öğreneceğiz ve neden önemli.'
      },

      // 2) KAVRAM — kod göstermeden, sıfırdan bir kavramı anlatan slayt.
      {
        tur: 'kavram',
        baslik: 'Bu Kavram Ne?',
        aciklama: 'Kavramın sade, jargonsuz tanımı. Okuyucu junior\'dan bile acemi — hiçbir ön bilgi varsayma.',
        neden: 'Bu yaklaşımın seçilmesinin somut mühendislik gerekçesi — "standart böyle" demek YETERLİ DEĞİL.',
        olmasaydi: 'Bu yaklaşım kullanılmasaydı ortaya çıkacak somut, ölçülebilir sorun.'
      },

      // 3) KOD — gerçek kaynak dosyadan BİREBİR alınan kod, satır satır açıklanır.
      //    `satirlar[]` içindeki `satir` alanı, `kod` metnindeki satırla (trim edilmiş)
      //    KARAKTER KARAKTER eşleşmeli — eşleşmezse o satır tıklanabilir olmaz.
      {
        tur: 'kod',
        baslik: 'DosyaAdi.tsx — Kısa Açıklama',
        dosyaYolu: 'admin/src/klasor/DosyaAdi.tsx',
        kod: `export function OrnekComponent() {
  return <div>Merhaba</div>;
}`,
        satirlar: [
          {
            satir: 'export function OrnekComponent() {',
            aciklama: 'Bu satırın ne yaptığının kısa açıklaması.',
            neden: 'Neden böyle yazıldığının gerekçesi.',
            olmasaydi: 'Böyle yazılmasaydı ne olurdu — somut senaryo.'
          }
        ]
      },

      // 3.1) KOD (terminal: true) — çalıştırılan terminal komutları, dosyaYolu YOK.
      //      "Bu Bölümde Öğrendiklerimiz" (ozet) slaytından HEMEN ÖNCE yer alır — bkz. STANDART.md §3.
      {
        tur: 'kod',
        baslik: 'Bu Bölümde Kullandığımız Terminal Komutları',
        terminal: true,
        kod: `$ npm i ornek-paket`,
        satirlar: [
          {
            satir: '$ npm i ornek-paket',
            aciklama: 'Bu komutun ne yaptığı.',
            neden: 'Neden bu komut / bu bayraklarla çalıştırıldı.',
            olmasaydi: 'Bu komut atlansaydı ne olurdu.'
          }
        ]
      },

      // 4) ONIZLEME — bir component bir route'a bağlandığında, `kod` slaytından HEMEN SONRA
      //    eklenir (backend akademideki `postman`ın karşılığı). Şema → STANDART.md §2.
      {
        tur: 'onizleme',
        baslik: 'Tarayıcıda Dene — OrnekComponent',
        route: '/ornek',
        aciklama: 'Bu ekranın ne zaman/ne amaçla görüldüğü.',
        akis: [
          'Kullanıcının attığı ilk adım.',
          'Sistemin tepkisi / ikinci adım.'
        ],
        apiCagrisi: {
          yontem: 'POST',
          url: 'http://localhost:5001/api/v1/ornek/endpoint',
          govde: `{
  "alan": "deger"
}`,
          yanit: {
            durum: 200,
            govde: `{
  "id": 1
}`
          }
        },
        durumlar: [
          { durum: 'Yükleniyor', aciklama: 'Butonlar disabled, spinner gösterilir.' },
          { durum: 'Hata', aciklama: 'API 400/401 dönerse toast ile hata gösterilir.' }
        ],
        notlar: [
          'Bu ekranı denemeden önce gereken ön koşul.'
        ]
      },

      // 5) KARSILASTIRMA — "doğru yapılırsa / yanlış yapılırsa" iki sütunlu karşılaştırma.
      {
        tur: 'karsilastirma',
        baslik: 'Doğru mu, Yanlış mı?',
        iyi: {
          baslik: 'Böyle yaz',
          maddeler: ['Doğru yaklaşımın ilk maddesi.']
        },
        kotu: {
          baslik: 'Böyle yazma',
          maddeler: ['Sık yapılan hatanın ilk maddesi.']
        }
      },

      // 6) SOZLUK — terim tanımları grid'i.
      {
        tur: 'sozluk',
        baslik: 'Bu Bölümde Geçen Terimler',
        terimler: [
          { terim: 'Terim 1', tanim: 'Sade, tek cümlelik tanım.' }
        ]
      },

      // 7) OZET — bölümün kapanış slaytı, madde madde "bugün öğrendiklerimiz".
      {
        tur: 'ozet',
        baslik: 'Bu Bölümde Öğrendiklerimiz',
        maddeler: ['İlk öğrenilen şey.', 'İkinci öğrenilen şey.']
      }
    ]
  };
</script>
<script src="../engine/slides-engine.js"></script>
</body>
</html>
