<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Şablon Bölüm</title>
<link rel="stylesheet" href="../engine/slides.css" />
</head>
<body>
<div id="app"></div>
<script>
  // AMAÇ: Bu dosya, Admin Akademi'ye (AKADEMI/admin/) yeni bir bölüm eklerken kopyalanacak ŞABLONDUR.
  // NEDEN: Her slayt türünün (kapak, kavram, kod, karsilastirma, sozluk, onizleme, ozet) en az
  //        bir çalışan örneğini içerir — yeni bir yazar (insan ya da AI) şemayı ezberlemek yerine
  //        buradan kopyalayıp alanları doldurabilir. Alan açıklamalarının tam listesi bu akademinin
  //        kendi kural dokümanında tutulur.
  window.MODULE = {
    id: 'sablon-ornek-bolum',
    bolumBaslik: 'B-0X — Görev Adı',       // topbar breadcrumb'ında görünür
    oncekiBolum: null,                      // önceki bölüm dosyasının göreli yolu, yoksa null
    sonrakiBolum: null,                     // sonraki bölüm dosyasının göreli yolu, yoksa null

    slaytlar: [
      // 1) KAPAK — bölümün ilk slaytı, yalnızca başlık ekranı.
      {
        tur: 'kapak',
        ustBaslik: 'BÖLÜM X',
        baslik: 'Slayt Başlığı Buraya',
        altBaslik: 'Bir-iki cümlelik alt başlık: bu bölümde ne öğreneceğiz ve neden önemli.'
      },

      // 2) KAVRAM — kod göstermeden, sıfırdan bir kavramı anlatan slayt.
      //    `neden` ve `olmasaydi` AYRI alanlardır — "kural böyle" demek YETERSİZ, ikisi de
      //    somut, mühendislik gerekçesi taşıyan cümleler olmalı.
      {
        tur: 'kavram',
        baslik: 'Bu Kavram Ne?',
        aciklama: 'Kavramın sade, jargonsuz tanımı. Okuyucu junior\'dan bile acemi — hiçbir ön bilgi varsayma.',
        neden: 'Bu yaklaşımın seçilmesinin somut mühendislik gerekçesi (performans, güvenlik, sürdürülebilirlik vb.) — "standart böyle" demek YETERLİ DEĞİL.',
        olmasaydi: 'Bu yaklaşım kullanılmasaydı ortaya çıkacak somut, ölçülebilir sorun (ör. "her component kendi fetch mantığını yazardı, aynı hata onlarca yerde tekrarlanırdı").'
      },

      // 3) KOD — gerçek kaynak dosyadan BİREBİR alınan kod, satır satır açıklanır.
      //    `satirlar[]` içindeki `satir` alanı, `kod` metnindeki satırla (trim edilmiş)
      //    KARAKTER KARAKTER eşleşmeli — eşleşmezse o satır tıklanabilir olmaz.
      {
        tur: 'kod',
        baslik: 'ornekSlice.ts — Kısa Açıklama',
        dosyaYolu: 'admin/src/store/slices/ornekSlice.ts',
        nedenBuKlasor: 'Bu dosyanın neden bu klasörde/isimde olduğunun gerekçesi — ör. "tüm Redux slice\'ları store/slices/ altında yaşar, böylece bir state parçası aranırken tek bir klasöre bakmak yeterli olur".',
        kod: `export interface OrnekState {
  id: number;
}`,
        satirlar: [
          {
            satir: 'export interface OrnekState {',
            aciklama: 'Bu satırın ne yaptığının kısa açıklaması.',
            neden: 'Neden böyle yazıldığının gerekçesi.',
            olmasaydi: 'Böyle yazılmasaydı ne olurdu — somut senaryo.'
          },
          {
            satir: 'id: number;',
            aciklama: 'Bu satırın ne yaptığının kısa açıklaması.',
            neden: 'Neden böyle yazıldığının gerekçesi.',
            olmasaydi: 'Böyle yazılmasaydı ne olurdu — somut senaryo.'
          }
        ]
      },

      // 4) KARSILASTIRMA — "doğru yapılırsa / yanlış yapılırsa" iki sütunlu karşılaştırma.
      //    Sık yapılan bir hatayı gösterip düzeltmesini yan yana koymak için kullanılır.
      {
        tur: 'karsilastirma',
        baslik: 'Doğru mu, Yanlış mı?',
        iyi: {
          baslik: 'Böyle yaz',
          maddeler: [
            'Doğru yaklaşımın ilk maddesi.',
            'Doğru yaklaşımın ikinci maddesi.'
          ]
        },
        kotu: {
          baslik: 'Böyle yazma',
          maddeler: [
            'Sık yapılan hatanın ilk maddesi.',
            'Sık yapılan hatanın ikinci maddesi.'
          ]
        }
      },

      // 5) SOZLUK — terim tanımları grid'i. Genelde bölümün SONUNDA, o bölümde geçen
      //    jargonu (İngilizce terimler dahil) özetlemek için kullanılır.
      {
        tur: 'sozluk',
        baslik: 'Bu Bölümde Geçen Terimler',
        terimler: [
          { terim: 'Terim 1', tanim: 'Sade, tek cümlelik tanım.' },
          { terim: 'Terim 2', tanim: 'Sade, tek cümlelik tanım.' }
        ]
      },

      // 6) ONIZLEME — bu component'in tarayıcıda gerçekte NASIL davrandığı: hangi route'ta
      //    görünür, kullanıcı adım adım ne yapar, hangi backend endpoint'ine gider, farklı
      //    durumlarda (yükleniyor/hata) ne olur. Component'i `kod` slaytıyla gösterdikten HEMEN
      //    SONRA eklenir. Backend'deki `postman`'in frontend karşılığı — gerçek route/URL,
      //    uydurma değil.
      {
        tur: 'onizleme',
        baslik: 'Tarayıcıda Dene — /ornek-route',
        rota: '/ornek-route',
        aciklama: 'Bu ekranın ne zaman/ne amaçla görüntülendiğinin bir-iki cümlelik açıklaması.',
        akis: [
          { eylem: 'Kullanıcı formu doldurup "Kaydet"e tıklar', sonuc: 'buton disabled olur, "Kaydediliyor..." yazısı görünür' },
          { eylem: 'İstek başarıyla döner', sonuc: 'başarı toast\'ı gösterilir, liste otomatik yenilenir' }
        ],
        apiCagrisi: { yontem: 'POST', url: 'https://localhost:7001/api/v1/ornek/endpoint' },
        durumlar: [
          { durum: 'Yükleniyor', gorunum: 'Buton disabled, spinner ikonu' },
          { durum: 'Hata', gorunum: 'Formun üstünde kırmızı hata mesajı (backend ErrorMessages Code\'undan çözülür)' }
        ],
        notlar: [
          'Bu akışı denemeden önce gereken ön koşul (ör. "önce login ile admin olarak giriş yap").'
        ]
      },

      // 7) OZET — bölümün kapanış slaytı, madde madde "bugün öğrendiklerimiz".
      {
        tur: 'ozet',
        baslik: 'Bu Bölümde Öğrendiklerimiz',
        maddeler: [
          'İlk öğrenilen şey.',
          'İkinci öğrenilen şey.',
          'Üçüncü öğrenilen şey.'
        ]
      }
    ]
  };
</script>
<script src="../engine/slides-engine.js"></script>
</body>
</html>
