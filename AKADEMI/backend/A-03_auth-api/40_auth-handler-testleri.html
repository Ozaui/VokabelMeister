    private readonly Mock<IUserRepository> _userRepository = new();
    private readonly Mock<IPasswordService> _passwordService = new();
    private readonly Mock<IOtpService> _otpService = new();
    private readonly Mock<IEmailService> _emailService = new();

    private RegisterCommandHandler CreateHandler() =>
        new(_userRepository.Object, _passwordService.Object, _otpService.Object, _emailService.Object);

    [Fact]
    public async Task Handle_EmailAlreadyRegistered_ThrowsEmailAlreadyRegisteredException()
    {
        // ARRANGE
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>()))
            .ReturnsAsync(new User { Email = "ada@test.de" });
        var handler = CreateHandler();
        var command = new RegisterCommand("ada@test.de", "Sifre123!", "Ada", "Lovelace", "tr");

        // ACT
        var act = () => handler.Handle(command, default);

        // ASSERT
        await act.Should().ThrowAsync<EmailAlreadyRegisteredException>();
        _userRepository.Verify(r => r.AddAsync(It.IsAny<User>(), It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task Handle_NewEmail_CreatesUserAndSendsVerificationEmail()
    {
        // ARRANGE
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync((User?)null);
        _passwordService.Setup(p => p.Hash("Sifre123!")).Returns("hashed-sifre");
        _otpService.Setup(o => o.Generate(It.IsAny<User>(), OtpPurpose.EmailVerification)).Returns("123456");
        var handler = CreateHandler();
        var command = new RegisterCommand("ada@test.de", "Sifre123!", "Ada", "Lovelace", "tr");

        // ACT
        var result = await handler.Handle(command, default);

        // ASSERT — DB'ye eklenen User doğru alanlarla kuruldu, OTP e-postayla gönderildi
        _userRepository.Verify(r => r.AddAsync(It.Is<User>(u =>
            u.Email == "ada@test.de" && u.PasswordHash == "hashed-sifre" && u.FirstName == "Ada" && u.LastName == "Lovelace"),
            It.IsAny<CancellationToken>()), Times.Once);
        _userRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Once);
        _emailService.Verify(e => e.SendEmailVerificationAsync("ada@test.de", "Ada", "123456", "tr", It.IsAny<CancellationToken>()), Times.Once);
        result.Email.Should().Be("ada@test.de");
        result.FirstName.Should().Be("Ada");
    }
}`,

using FluentAssertions;
using WordLearner.Application.Common.Exceptions;
using WordLearner.Application.Features.Auth;
using WordLearner.Application.Interfaces.Repositories.Auth;
using WordLearner.Application.Interfaces.Services;
using WordLearner.Domain.Entities.Auth;
using WordLearner.Domain.Enums.Auth;

namespace WordLearner.Tests.Features.Auth;

public class VerifyEmailCommandHandlerTests
{
    private readonly Mock<IUserRepository> _userRepository = new();
    private readonly Mock<IOtpService> _otpService = new();

    private VerifyEmailCommandHandler CreateHandler() => new(_userRepository.Object, _otpService.Object);

    [Fact]
    public async Task Handle_EmailNotFound_ThrowsInvalidOtpException()
    {
        // ARRANGE — hangi e-postanın kayıtlı olduğunu sızdırmamak için VerifyEmail ile aynı hata
        _userRepository.Setup(r => r.GetByEmailAsync(It.IsAny<string>(), It.IsAny<CancellationToken>())).ReturnsAsync((User?)null);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new VerifyEmailCommand("yok@test.de", "123456"), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidOtpException>();
    }

    [Fact]
    public async Task Handle_OtpExpired_ThrowsOtpExpiredException()
    {
        // ARRANGE
        var user = new User { Email = "ada@test.de" };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "123456", OtpPurpose.EmailVerification)).Returns(OtpVerificationResult.Expired);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new VerifyEmailCommand("ada@test.de", "123456"), default);

        // ASSERT
        await act.Should().ThrowAsync<OtpExpiredException>();
    }

    [Fact]
    public async Task Handle_InvalidCode_ThrowsInvalidOtpException()
    {
        // ARRANGE
        var user = new User { Email = "ada@test.de" };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "000000", OtpPurpose.EmailVerification)).Returns(OtpVerificationResult.InvalidCode);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new VerifyEmailCommand("ada@test.de", "000000"), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidOtpException>();
    }

    [Fact]
    public async Task Handle_ValidCode_MarksEmailVerifiedAndSaves()
    {
        // ARRANGE
        var user = new User { Email = "ada@test.de", IsEmailVerified = false };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "123456", OtpPurpose.EmailVerification)).Returns(OtpVerificationResult.Success);
        var handler = CreateHandler();

        // ACT
        await handler.Handle(new VerifyEmailCommand("ada@test.de", "123456"), default);

        // ASSERT
        user.IsEmailVerified.Should().BeTrue();
        user.EmailVerifiedAt.Should().NotBeNull();
        _userRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Once);
    }
}`,

using FluentAssertions;
using WordLearner.Application.Common.Exceptions;
using WordLearner.Application.Features.Auth;
using WordLearner.Application.Interfaces.Repositories.Auth;
using WordLearner.Application.Interfaces.Services;
using WordLearner.Domain.Entities.Auth;
using WordLearner.Domain.Enums.Auth;

namespace WordLearner.Tests.Features.Auth;

public class VerifyLoginOtpCommandHandlerTests
{
    private readonly Mock<IUserRepository> _userRepository = new();
    private readonly Mock<IRefreshTokenRepository> _refreshTokenRepository = new();
    private readonly Mock<IOtpService> _otpService = new();
    private readonly Mock<ILoginCompletionService> _loginCompletionService = new();
    private readonly Mock<IEmailService> _emailService = new();

    private VerifyLoginOtpCommandHandler CreateHandler() => new(
        _userRepository.Object, _refreshTokenRepository.Object, _otpService.Object,
        _loginCompletionService.Object, _emailService.Object);

    private static LoginCompletionResult CreateCompletion(bool recovered = false) =>
        new("access-token", "refresh-token", new RefreshToken { UserId = 1 }, recovered);

    [Fact]
    public async Task Handle_UserNotFound_ThrowsInvalidOtpException()
    {
        // ARRANGE
        _userRepository.Setup(r => r.GetByEmailAsync(It.IsAny<string>(), It.IsAny<CancellationToken>())).ReturnsAsync((User?)null);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new VerifyLoginOtpCommand("yok@test.de", "123456", null, null, "tr"), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidOtpException>();
    }

    [Fact]
    public async Task Handle_InactiveAccount_ThrowsAccountInactiveException()
    {
        // ARRANGE
        var user = new User { Email = "ada@test.de", IsActive = false };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new VerifyLoginOtpCommand("ada@test.de", "123456", null, null, "tr"), default);

        // ASSERT
        await act.Should().ThrowAsync<AccountInactiveException>();
    }

    [Fact]
    public async Task Handle_OtpExpired_ThrowsOtpExpiredException()
    {
        // ARRANGE
        var user = new User { Email = "ada@test.de", IsActive = true };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "123456", OtpPurpose.LoginOtp)).Returns(OtpVerificationResult.Expired);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new VerifyLoginOtpCommand("ada@test.de", "123456", null, null, "tr"), default);

        // ASSERT
        await act.Should().ThrowAsync<OtpExpiredException>();
    }

    [Fact]
    public async Task Handle_InvalidCode_ThrowsInvalidOtpException()
    {
        // ARRANGE
        var user = new User { Email = "ada@test.de", IsActive = true };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "000000", OtpPurpose.LoginOtp)).Returns(OtpVerificationResult.InvalidCode);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new VerifyLoginOtpCommand("ada@test.de", "000000", null, null, "tr"), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidOtpException>();
    }

    [Fact]
    public async Task Handle_ValidCode_ReturnsLoginResponseAndPersistsRefreshToken()
    {
        // ARRANGE
        var user = new User { Id = 1, Email = "ada@test.de", IsActive = true, CurrentLevel = "A1", ThemePreference = "System", LanguagePreference = "tr" };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "123456", OtpPurpose.LoginOtp)).Returns(OtpVerificationResult.Success);
        var completion = CreateCompletion();
        _loginCompletionService.Setup(l => l.Complete(user, "Chrome", "1.2.3.4")).Returns(completion);
        var handler = CreateHandler();

        // ACT
        var result = await handler.Handle(new VerifyLoginOtpCommand("ada@test.de", "123456", "Chrome", "1.2.3.4", "tr"), default);

        // ASSERT
        _refreshTokenRepository.Verify(r => r.AddAsync(completion.RefreshTokenEntity, It.IsAny<CancellationToken>()), Times.Once);
        _refreshTokenRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Once);
        result.AccessToken.Should().Be("access-token");
        result.User.Id.Should().Be(1);
        _emailService.Verify(e => e.SendAccountRecoveredNotificationAsync(It.IsAny<string>(), It.IsAny<string>(), It.IsAny<string?>(), It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task Handle_AccountWasRecovered_SendsAccountRecoveredNotification()
    {
        // ARRANGE
        var user = new User { Id = 1, Email = "ada@test.de", FirstName = "Ada", IsActive = true };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "123456", OtpPurpose.LoginOtp)).Returns(OtpVerificationResult.Success);
        _loginCompletionService.Setup(l => l.Complete(user, null, null)).Returns(CreateCompletion(recovered: true));
        var handler = CreateHandler();

        // ACT
        await handler.Handle(new VerifyLoginOtpCommand("ada@test.de", "123456", null, null, "de"), default);

        // ASSERT
        _emailService.Verify(e => e.SendAccountRecoveredNotificationAsync("ada@test.de", "Ada", "de", It.IsAny<CancellationToken>()), Times.Once);
    }

using FluentAssertions;
using WordLearner.Application.Common.Exceptions;
using WordLearner.Application.Features.Auth;
using WordLearner.Application.Interfaces.Repositories.Auth;
using WordLearner.Application.Interfaces.Services;
using WordLearner.Domain.Entities.Auth;

namespace WordLearner.Tests.Features.Auth;

public class LoginWithGoogleCommandHandlerTests
{
    private readonly Mock<IUserRepository> _userRepository = new();
    private readonly Mock<IRefreshTokenRepository> _refreshTokenRepository = new();
    private readonly Mock<IGoogleTokenValidator> _googleTokenValidator = new();
    private readonly Mock<ILoginCompletionService> _loginCompletionService = new();
    private readonly Mock<IEmailService> _emailService = new();

    private LoginWithGoogleCommandHandler CreateHandler() => new(
        _userRepository.Object, _refreshTokenRepository.Object, _googleTokenValidator.Object,
        _loginCompletionService.Object, _emailService.Object);

    private static LoginCompletionResult CreateCompletion(bool recovered = false) =>
        new("access-token", "refresh-token", new RefreshToken { UserId = 1 }, recovered);

    [Fact]
    public async Task Handle_InvalidToken_ThrowsInvalidSocialTokenException()
    {
        // ARRANGE
        _googleTokenValidator.Setup(v => v.ValidateAsync("kotu-token", It.IsAny<CancellationToken>())).ReturnsAsync((GoogleTokenPayload?)null);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new LoginWithGoogleCommand("kotu-token", null, null, "tr"), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidSocialTokenException>();
    }

    [Fact]
    public async Task Handle_ExistingGoogleUser_ReturnsLoginResponseWithoutCreatingUser()
    {
        // ARRANGE
        var payload = new GoogleTokenPayload("google-sub-1", "ada@test.de", "Ada", "Lovelace");
        _googleTokenValidator.Setup(v => v.ValidateAsync("iyi-token", It.IsAny<CancellationToken>())).ReturnsAsync(payload);
        var user = new User { Id = 1, Email = "ada@test.de", GoogleId = "google-sub-1", IsActive = true };
        _userRepository.Setup(r => r.GetByGoogleIdAsync("google-sub-1", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        var completion = CreateCompletion();
        _loginCompletionService.Setup(l => l.Complete(user, null, null)).Returns(completion);
        var handler = CreateHandler();

        // ACT
        var result = await handler.Handle(new LoginWithGoogleCommand("iyi-token", null, null, "tr"), default);

        // ASSERT
        _userRepository.Verify(r => r.AddAsync(It.IsAny<User>(), It.IsAny<CancellationToken>()), Times.Never);
        result.AccessToken.Should().Be("access-token");
    }

    [Fact]
    public async Task Handle_ExistingEmailDifferentProvider_LinksGoogleIdToExistingAccount()
    {
        // ARRANGE — daha önce Local kayıt açılmış aynı e-posta, Google hesabı BİRLEŞTİRİLİR
        var payload = new GoogleTokenPayload("google-sub-1", "ada@test.de", "Ada", "Lovelace");
        _googleTokenValidator.Setup(v => v.ValidateAsync("iyi-token", It.IsAny<CancellationToken>())).ReturnsAsync(payload);
        _userRepository.Setup(r => r.GetByGoogleIdAsync("google-sub-1", It.IsAny<CancellationToken>())).ReturnsAsync((User?)null);
        var existingLocalUser = new User { Id = 5, Email = "ada@test.de", AuthProvider = "Local", IsActive = true };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(existingLocalUser);
        _loginCompletionService.Setup(l => l.Complete(existingLocalUser, null, null)).Returns(CreateCompletion());
        var handler = CreateHandler();

        // ACT
        await handler.Handle(new LoginWithGoogleCommand("iyi-token", null, null, "tr"), default);

        // ASSERT
        existingLocalUser.GoogleId.Should().Be("google-sub-1");
        _userRepository.Verify(r => r.AddAsync(It.IsAny<User>(), It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task Handle_NoExistingUser_CreatesNewGoogleUser()
    {
        // ARRANGE
        var payload = new GoogleTokenPayload("google-sub-1", "yeni@test.de", "Yeni", "Kullanici");
        _googleTokenValidator.Setup(v => v.ValidateAsync("iyi-token", It.IsAny<CancellationToken>())).ReturnsAsync(payload);
        _userRepository.Setup(r => r.GetByGoogleIdAsync("google-sub-1", It.IsAny<CancellationToken>())).ReturnsAsync((User?)null);
        _userRepository.Setup(r => r.GetByEmailAsync("yeni@test.de", It.IsAny<CancellationToken>())).ReturnsAsync((User?)null);
        _loginCompletionService.Setup(l => l.Complete(It.IsAny<User>(), null, null)).Returns(CreateCompletion());
        var handler = CreateHandler();

        // ACT
        await handler.Handle(new LoginWithGoogleCommand("iyi-token", null, null, "tr"), default);

        // ASSERT
        _userRepository.Verify(r => r.AddAsync(It.Is<User>(u =>
            u.Email == "yeni@test.de" && u.GoogleId == "google-sub-1" && u.AuthProvider == "Google" && u.IsEmailVerified),
            It.IsAny<CancellationToken>()), Times.Once);
    }

    [Fact]
    public async Task Handle_InactiveAccount_ThrowsAccountInactiveException()
    {
        // ARRANGE
        var payload = new GoogleTokenPayload("google-sub-1", "ada@test.de", "Ada", "Lovelace");
        _googleTokenValidator.Setup(v => v.ValidateAsync("iyi-token", It.IsAny<CancellationToken>())).ReturnsAsync(payload);
        var user = new User { Id = 1, Email = "ada@test.de", GoogleId = "google-sub-1", IsActive = false };
        _userRepository.Setup(r => r.GetByGoogleIdAsync("google-sub-1", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new LoginWithGoogleCommand("iyi-token", null, null, "tr"), default);

        // ASSERT
        await act.Should().ThrowAsync<AccountInactiveException>();
    }

        kod: `using Moq;
using FluentAssertions;
using WordLearner.Application.Common.Exceptions;
using WordLearner.Application.Features.Auth;
using WordLearner.Application.Interfaces.Repositories.Auth;
using WordLearner.Application.Interfaces.Services;
using WordLearner.Domain.Entities.Auth;

namespace WordLearner.Tests.Features.Auth;

public class RefreshCommandHandlerTests
{
    private readonly Mock<IUserRepository> _userRepository = new();
    private readonly Mock<IRefreshTokenRepository> _refreshTokenRepository = new();
    private readonly Mock<ITokenService> _tokenService = new();
    private readonly Mock<IPasswordService> _passwordService = new();

    public RefreshCommandHandlerTests()
    {
        _passwordService.Setup(p => p.HashToken(It.IsAny<string>())).Returns<string>(t => $"hash-of-{t}");
    }

    private RefreshCommandHandler CreateHandler() => new(
        _userRepository.Object, _refreshTokenRepository.Object, _tokenService.Object, _passwordService.Object);

    [Fact]
    public async Task Handle_TokenNotFound_ThrowsInvalidRefreshTokenException()
    {
        // ARRANGE
        _refreshTokenRepository.Setup(r => r.GetByTokenHashAsync(It.IsAny<string>(), It.IsAny<CancellationToken>())).ReturnsAsync((RefreshToken?)null);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new RefreshCommand("ham-token", null, null), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidRefreshTokenException>();
    }

    [Fact]
    public async Task Handle_TokenAlreadyUsed_RevokesFamilyAndThrowsInvalidRefreshTokenException()
    {
        // ARRANGE — Token Family Pattern: replay algılanınca TÜM family iptal edilir
        var token = new RefreshToken { TokenFamily = "family-1", IsUsed = true };
        _refreshTokenRepository.Setup(r => r.GetByTokenHashAsync("hash-of-ham-token", It.IsAny<CancellationToken>())).ReturnsAsync(token);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new RefreshCommand("ham-token", null, null), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidRefreshTokenException>();
        _refreshTokenRepository.Verify(r => r.RevokeFamilyAsync("family-1", It.IsAny<CancellationToken>()), Times.Once);
        _refreshTokenRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Once);
    }

    [Theory]
    [InlineData(true, false)]  // revoked
    [InlineData(false, true)]  // expired
    public async Task Handle_RevokedOrExpiredToken_ThrowsInvalidRefreshTokenException(bool revoked, bool expired)
    {
        // ARRANGE
        var token = new RefreshToken
        {
            IsUsed = false,
            RevokedAt = revoked ? DateTime.UtcNow : null,
            ExpiresAt = expired ? DateTime.UtcNow.AddDays(-1) : DateTime.UtcNow.AddDays(1)
        };
        _refreshTokenRepository.Setup(r => r.GetByTokenHashAsync("hash-of-ham-token", It.IsAny<CancellationToken>())).ReturnsAsync(token);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new RefreshCommand("ham-token", null, null), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidRefreshTokenException>();
    }

    [Theory]
    [InlineData(false, false, false)] // inactive
    [InlineData(true, true, false)]   // deleted
    [InlineData(true, false, true)]   // anonymized
    public async Task Handle_UserNotUsable_ThrowsInvalidRefreshTokenException(bool isActive, bool isDeleted, bool isAnonymized)
    {
        // ARRANGE
        var token = new RefreshToken { UserId = 1, IsUsed = false, ExpiresAt = DateTime.UtcNow.AddDays(1) };
        _refreshTokenRepository.Setup(r => r.GetByTokenHashAsync("hash-of-ham-token", It.IsAny<CancellationToken>())).ReturnsAsync(token);
        var user = new User { Id = 1, IsActive = isActive, IsDeleted = isDeleted, IsAnonymized = isAnonymized };
        _userRepository.Setup(r => r.GetByIdAsync(1, It.IsAny<CancellationToken>())).ReturnsAsync(user);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new RefreshCommand("ham-token", null, null), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidRefreshTokenException>();
    }

    [Fact]
    public async Task Handle_ValidToken_RotatesTokenAndKeepsFamily()
    {
        // ARRANGE
        var token = new RefreshToken { UserId = 1, TokenFamily = "family-1", IsUsed = false, ExpiresAt = DateTime.UtcNow.AddDays(1) };
        _refreshTokenRepository.Setup(r => r.GetByTokenHashAsync("hash-of-ham-token", It.IsAny<CancellationToken>())).ReturnsAsync(token);
        var user = new User { Id = 1, IsActive = true };
        _userRepository.Setup(r => r.GetByIdAsync(1, It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _tokenService.Setup(t => t.GenerateAccessToken(user)).Returns("yeni-access");
        _tokenService.Setup(t => t.GenerateRefreshToken()).Returns(new RefreshTokenResult("yeni-refresh", DateTime.UtcNow.AddDays(7)));
        var handler = CreateHandler();

        // ACT
        var result = await handler.Handle(new RefreshCommand("ham-token", "Chrome", "1.2.3.4"), default);

        // ASSERT
        token.IsUsed.Should().BeTrue();
        result.AccessToken.Should().Be("yeni-access");

using FluentAssertions;
using WordLearner.Application.Features.Auth;
using WordLearner.Application.Interfaces.Repositories.Auth;
using WordLearner.Application.Interfaces.Services;
using WordLearner.Domain.Entities.Auth;

namespace WordLearner.Tests.Features.Auth;

public class LogoutCommandHandlerTests
{
    private readonly Mock<IRefreshTokenRepository> _refreshTokenRepository = new();
    private readonly Mock<IPasswordService> _passwordService = new();

    public LogoutCommandHandlerTests()
    {
        _passwordService.Setup(p => p.HashToken(It.IsAny<string>())).Returns<string>(t => $"hash-of-{t}");
    }

    private LogoutCommandHandler CreateHandler() => new(_refreshTokenRepository.Object, _passwordService.Object);

    [Fact]
    public async Task Handle_TokenNotFound_ReturnsUnitIdempotently()
    {
        // ARRANGE — logout idempotent olmalı, bulunamayan token'da da başarı döner
        _refreshTokenRepository.Setup(r => r.GetByTokenHashAsync(It.IsAny<string>(), It.IsAny<CancellationToken>())).ReturnsAsync((RefreshToken?)null);
        var handler = CreateHandler();

        // ACT
        await handler.Handle(new LogoutCommand(1, "ham-token"), default);

        // ASSERT
        _refreshTokenRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task Handle_TokenBelongsToOtherUser_ReturnsUnitWithoutRevoking()
    {
        // ARRANGE — başkasının token'ını manipüle etmeye çalışıldığı ayrı bir hatayla belli edilmez
        var token = new RefreshToken { UserId = 99, RevokedAt = null };
        _refreshTokenRepository.Setup(r => r.GetByTokenHashAsync("hash-of-ham-token", It.IsAny<CancellationToken>())).ReturnsAsync(token);
        var handler = CreateHandler();

        // ACT
        await handler.Handle(new LogoutCommand(1, "ham-token"), default);

        // ASSERT
        token.RevokedAt.Should().BeNull();
        _refreshTokenRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task Handle_AlreadyRevoked_ReturnsUnitIdempotently()
    {
        // ARRANGE
        var token = new RefreshToken { UserId = 1, RevokedAt = DateTime.UtcNow.AddMinutes(-5) };
        _refreshTokenRepository.Setup(r => r.GetByTokenHashAsync("hash-of-ham-token", It.IsAny<CancellationToken>())).ReturnsAsync(token);
        var handler = CreateHandler();

        // ACT
        await handler.Handle(new LogoutCommand(1, "ham-token"), default);

        // ASSERT
        _refreshTokenRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task Handle_ValidToken_RevokesTokenAndSaves()
    {
        // ARRANGE
        var token = new RefreshToken { UserId = 1, RevokedAt = null };
        _refreshTokenRepository.Setup(r => r.GetByTokenHashAsync("hash-of-ham-token", It.IsAny<CancellationToken>())).ReturnsAsync(token);
        var handler = CreateHandler();

        // ACT
        await handler.Handle(new LogoutCommand(1, "ham-token"), default);

        // ASSERT
        token.RevokedAt.Should().NotBeNull();
        _refreshTokenRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Once);
    }
}`,

    private readonly Mock<IUserRepository> _userRepository = new();

    private readonly Mock<IOtpService> _otpService = new();

    private readonly Mock<IEmailService> _emailService = new();

    private ResetPasswordCommandHandler CreateHandler() => new(
        _userRepository.Object, _refreshTokenRepository.Object, _otpService.Object, _passwordService.Object, _emailService.Object);

    [Fact]
    public async Task Handle_UserNotFound_ThrowsInvalidOtpException()
    {
        // ARRANGE
        _userRepository.Setup(r => r.GetByEmailAsync(It.IsAny<string>(), It.IsAny<CancellationToken>())).ReturnsAsync((User?)null);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new ResetPasswordCommand("yok@test.de", "123456", "YeniSifre1!", "tr"), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidOtpException>();
    }

    [Fact]
    public async Task Handle_OtpExpired_ThrowsOtpExpiredException()
    {
        // ARRANGE
        var user = new User { Email = "ada@test.de" };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "123456", OtpPurpose.PasswordReset)).Returns(OtpVerificationResult.Expired);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new ResetPasswordCommand("ada@test.de", "123456", "YeniSifre1!", "tr"), default);

        // ASSERT
        await act.Should().ThrowAsync<OtpExpiredException>();
    }

    [Fact]
    public async Task Handle_InvalidCode_ThrowsInvalidOtpException()
    {
        // ARRANGE
        var user = new User { Email = "ada@test.de" };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "000000", OtpPurpose.PasswordReset)).Returns(OtpVerificationResult.InvalidCode);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new ResetPasswordCommand("ada@test.de", "000000", "YeniSifre1!", "tr"), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidOtpException>();
    }

    [Fact]
    public async Task Handle_ValidCode_UpdatesPasswordRevokesTokensAndNotifies()
    {
        // ARRANGE
        var user = new User { Id = 1, Email = "ada@test.de", FirstName = "Ada" };
        _userRepository.Setup(r => r.GetByEmailAsync("ada@test.de", It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "123456", OtpPurpose.PasswordReset)).Returns(OtpVerificationResult.Success);
        _passwordService.Setup(p => p.Hash("YeniSifre1!")).Returns("yeni-hash");
        var handler = CreateHandler();

        // ACT
        await handler.Handle(new ResetPasswordCommand("ada@test.de", "123456", "YeniSifre1!", "tr"), default);

        _refreshTokenRepository.Verify(r => r.RevokeAllForUserAsync(1, It.IsAny<CancellationToken>()), Times.Once);
        _userRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Once);
        _emailService.Verify(e => e.SendPasswordChangedNotificationAsync("ada@test.de", "Ada", "tr", It.IsAny<CancellationToken>()), Times.Once);
    }
}`,

public class ConfirmAccountDeletionCommandHandlerTests
{
    private readonly Mock<IUserRepository> _userRepository = new();
    private readonly Mock<IRefreshTokenRepository> _refreshTokenRepository = new();
    private readonly Mock<IOtpService> _otpService = new();

    private ConfirmAccountDeletionCommandHandler CreateHandler() =>
        new(_userRepository.Object, _refreshTokenRepository.Object, _otpService.Object);

    [Fact]
    public async Task Handle_UserNotFound_ThrowsEntityNotFoundException()
    {
        // ARRANGE
        _userRepository.Setup(r => r.GetByIdAsync(99, It.IsAny<CancellationToken>())).ReturnsAsync((User?)null);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new ConfirmAccountDeletionCommand(99, "123456"), default);

        // ASSERT
        await act.Should().ThrowAsync<EntityNotFoundException>();
    }

    [Fact]
    public async Task Handle_OtpExpired_ThrowsOtpExpiredException()
    {
        // ARRANGE
        var user = new User { Id = 1 };
        _userRepository.Setup(r => r.GetByIdAsync(1, It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "123456", OtpPurpose.AccountDeletion)).Returns(OtpVerificationResult.Expired);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new ConfirmAccountDeletionCommand(1, "123456"), default);

        // ASSERT
        await act.Should().ThrowAsync<OtpExpiredException>();
    }

    [Fact]
    public async Task Handle_InvalidCode_ThrowsInvalidOtpException()
    {
        // ARRANGE
        var user = new User { Id = 1 };
        _userRepository.Setup(r => r.GetByIdAsync(1, It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "000000", OtpPurpose.AccountDeletion)).Returns(OtpVerificationResult.InvalidCode);
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(new ConfirmAccountDeletionCommand(1, "000000"), default);

        // ASSERT
        await act.Should().ThrowAsync<InvalidOtpException>();
    }

    [Fact]
    public async Task Handle_ValidCode_StartsGracePeriodAndRevokesAllTokens()
    {
        // ARRANGE — kalıcı anonimleştirme DEĞİL, 30 gün grace period başlar (SECURITY.md §9)
        var user = new User { Id = 1, IsActive = true };
        _userRepository.Setup(r => r.GetByIdAsync(1, It.IsAny<CancellationToken>())).ReturnsAsync(user);
        _otpService.Setup(o => o.Verify(user, "123456", OtpPurpose.AccountDeletion)).Returns(OtpVerificationResult.Success);
        var handler = CreateHandler();

        // ACT
        await handler.Handle(new ConfirmAccountDeletionCommand(1, "123456"), default);

        user.IsDeleted.Should().BeTrue();
        user.IsActive.Should().BeFalse();
        user.ScheduledDeletionAt.Should().BeCloseTo(DateTime.UtcNow.AddDays(30), TimeSpan.FromMinutes(1));
        _refreshTokenRepository.Verify(r => r.RevokeAllForUserAsync(1, It.IsAny<CancellationToken>()), Times.Once);
        _userRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Once);
    }
}`,
