        diff: ` using WordLearner.Application.Common;
+using WordLearner.Application.Common.Exceptions;
 using WordLearner.Application.DTOs;
 using WordLearner.Domain.Exceptions;

 namespace WordLearner.API.Middleware;

 public class ExceptionHandlingMiddleware
 {
     private readonly RequestDelegate _next;
     private readonly ILogger<ExceptionHandlingMiddleware> _logger;

     public ExceptionHandlingMiddleware(RequestDelegate next, ILogger<ExceptionHandlingMiddleware> logger)
     {
         _next = next;
         _logger = logger;
     }

     public async Task InvokeAsync(HttpContext context)
     {
         try
         {
             await _next(context);
         }
         catch (EntityNotFoundException ex)
         {
             _logger.LogWarning(ex, "Entity not found. Path: {Path}", context.Request.Path);
             await WriteErrorAsync(context, StatusCodes.Status404NotFound, ex.Code);
         }
+        catch (AppException ex)
+        {
+            _logger.LogWarning(ex, "Application exception: {Code}. Path: {Path}", ex.Code, context.Request.Path);
+            await WriteErrorAsync(context, (int)ex.StatusCode, ex.Code);
+        }
         catch (Exception ex)
         {
             _logger.LogError(ex, "Unhandled exception. Path: {Path}", context.Request.Path);
             await WriteErrorAsync(context, StatusCodes.Status500InternalServerError, "INTERNAL_SERVER_ERROR");
         }
     }

     private static async Task WriteErrorAsync(HttpContext context, int statusCode, string code)
     {
         var message = ErrorMessages.Resolve(code, ExtractLanguage(context));

         context.Response.ContentType = "application/json";
         context.Response.StatusCode = statusCode;
         await context.Response.WriteAsJsonAsync(new ApiErrorResponse(false, new ApiErrorDetail(code, message)));
     }

     // "de-DE, tr;q=0.9" gibi bir header'dan yalnızca birincil dil alt etiketini (ilk "de") çıkarır.
     private static string? ExtractLanguage(HttpContext context)
     {
         var header = context.Request.Headers.AcceptLanguage.ToString();
         if (string.IsNullOrWhiteSpace(header))
             return null;

         var primary = header.Split(',')[0].Split(';')[0].Trim();
         return primary.Split('-')[0].ToLowerInvariant();
     }
 }`,

        diff: ` namespace WordLearner.Application.Common;

 // Yeni dil eklemek yalnızca bu sözlüğe yeni bir üst-seviye anahtar (ör. "en") eklemekle olur —
 // var olan Code'lara veya exception sınıflarına dokunulmaz (CLAUDE.md §1).
 public static class ErrorMessages
 {
     private const string DefaultLanguage = "tr";

     private static readonly Dictionary<string, Dictionary<string, string>> Messages = new()
     {
         [DefaultLanguage] = new()
         {
             ["ENTITY_NOT_FOUND"] = "Kayıt bulunamadı.",
             ["INTERNAL_SERVER_ERROR"] = "Beklenmeyen bir hata oluştu.",
+            ["ACCOUNT_ANONYMIZED"] = "Bu hesap kalıcı olarak silinmiş.",

         ["de"] = new()

             ["ENTITY_NOT_FOUND"] = "Eintrag nicht gefunden.",
             ["INTERNAL_SERVER_ERROR"] = "Ein unerwarteter Fehler ist aufgetreten.",
+            ["ACCOUNT_ANONYMIZED"] = "Dieses Konto wurde dauerhaft anonymisiert.",
         },
     };

     public static string Resolve(string code, string? language)
     {
         var resolvedLanguage = language is not null && Messages.ContainsKey(language)
             ? language
             : DefaultLanguage;

         return Messages[resolvedLanguage].TryGetValue(code, out var message) ? message : code;
     }
 }`,
