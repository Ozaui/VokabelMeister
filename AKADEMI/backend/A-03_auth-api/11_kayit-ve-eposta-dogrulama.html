{
    private readonly IUserRepository _userRepository;
    private readonly IPasswordService _passwordService;
    private readonly IOtpService _otpService;
    private readonly IEmailService _emailService;

    public RegisterCommandHandler(IUserRepository userRepository, IPasswordService passwordService, IOtpService otpService, IEmailService emailService)
    {
        _userRepository = userRepository;
        _passwordService = passwordService;
        _otpService = otpService;
        _emailService = emailService;
    }

    public async Task<RegisterResponse> Handle(RegisterCommand request, CancellationToken cancellationToken)
    {
        if (await _userRepository.GetByEmailAsync(request.Email, cancellationToken) is not null)
            throw new EmailAlreadyRegisteredException();

        var user = new User
        {
            Email = request.Email,
            PasswordHash = _passwordService.Hash(request.Password),
            FirstName = request.FirstName,
            LastName = request.LastName
        };

        var otpCode = _otpService.Generate(user, OtpPurpose.EmailVerification);

        await _userRepository.AddAsync(user, cancellationToken);
        await _userRepository.SaveChangesAsync(cancellationToken);

        await _emailService.SendEmailVerificationAsync(user.Email, user.FirstName, otpCode, request.Language, cancellationToken);

        return new RegisterResponse(user.Id, user.Email, user.FirstName, user.CurrentLevel, user.ThemePreference, user.LanguagePreference);
    }
}`,

using Zausel.Application.Common.Exceptions;
using Zausel.Application.Interfaces.Repositories.Auth;
using Zausel.Application.Interfaces.Services;
using Zausel.Domain.Enums.Auth;

namespace Zausel.Application.Features.Auth;

public record VerifyEmailCommand(string Email, string OtpCode) : IRequest<Unit>;

public class VerifyEmailCommandHandler : IRequestHandler<VerifyEmailCommand, Unit>
{
    private readonly IUserRepository _userRepository;
    private readonly IOtpService _otpService;

    public VerifyEmailCommandHandler(IUserRepository userRepository, IOtpService otpService)
    {
        _userRepository = userRepository;
        _otpService = otpService;
    }

    public async Task<Unit> Handle(VerifyEmailCommand request, CancellationToken cancellationToken)
    {
        // E-posta bulunamazsa da AYNI hata: hangi e-postanın kayıtlı olduğunu sızdırmamak için.
        var user = await _userRepository.GetByEmailAsync(request.Email, cancellationToken)
            ?? throw new InvalidOtpException();

        var result = _otpService.Verify(user, request.OtpCode, OtpPurpose.EmailVerification);
        if (result == OtpVerificationResult.Expired)
            throw new OtpExpiredException();
        if (result == OtpVerificationResult.InvalidCode)
            throw new InvalidOtpException();

        user.IsEmailVerified = true;
        user.EmailVerifiedAt = DateTime.UtcNow;

        await _userRepository.SaveChangesAsync(cancellationToken);
        return Unit.Value;
    }
}`,

using Zausel.Application.Interfaces.Repositories.Auth;
using Zausel.Application.Interfaces.Services;

namespace Zausel.Application.Features.Auth;

public record ResendVerificationCommand(string Email, string? Language) : IRequest<Unit>;

public class ResendVerificationCommandHandler : IRequestHandler<ResendVerificationCommand, Unit>
{
    private readonly IUserRepository _userRepository;
    private readonly IOtpService _otpService;
    private readonly IEmailService _emailService;

    public ResendVerificationCommandHandler(IUserRepository userRepository, IOtpService otpService, IEmailService emailService)
    {
        _userRepository = userRepository;
        _otpService = otpService;
        _emailService = emailService;
    }

    public async Task<Unit> Handle(ResendVerificationCommand request, CancellationToken cancellationToken)
    {
        // ForgotPassword ile aynı enumeration-önleme deseni: kayıtlı olmayan/zaten doğrulanmış
        // e-postada da 200 döner, kod ÜRETİLMEZ/gönderilmez — istemci fark edemez.
        var user = await _userRepository.GetByEmailAsync(request.Email, cancellationToken);
        if (user is null || user.IsEmailVerified)
            return Unit.Value;

        var otpCode = _otpService.Generate(user, OtpPurpose.EmailVerification);
        await _userRepository.SaveChangesAsync(cancellationToken);

        await _emailService.SendEmailVerificationAsync(user.Email, user.FirstName, otpCode, request.Language, cancellationToken);
        return Unit.Value;
    }
}`,
