namespace WordLearner.Application.Features.Auth;

public record ForgotPasswordCommand(string Email, string? Language) : IRequest<Unit>;

public class ForgotPasswordCommandHandler : IRequestHandler<ForgotPasswordCommand, Unit>
{
    private readonly IUserRepository _userRepository;
    private readonly IOtpService _otpService;
    private readonly IEmailService _emailService;

    public ForgotPasswordCommandHandler(IUserRepository userRepository, IOtpService otpService, IEmailService emailService)
    {
        _userRepository = userRepository;
        _otpService = otpService;
        _emailService = emailService;
    }

    public async Task<Unit> Handle(ForgotPasswordCommand request, CancellationToken cancellationToken)
    {
        // SECURITY.md §7: kullanıcı yoksa bile 200 — e-posta enumerasyonu önlenir. AuthProvider/
        // PasswordHash'e BAKILMAZ, sosyal hesap da OTP'yle şifre belirleyebilir (kasıtlı, SECURITY.md §1.2).
        var user = await _userRepository.GetByEmailAsync(request.Email, cancellationToken);
        if (user is null)
            return Unit.Value;

        var otpCode = _otpService.Generate(user, OtpPurpose.PasswordReset);
        await _userRepository.SaveChangesAsync(cancellationToken);

        await _emailService.SendPasswordResetAsync(user.Email, user.FirstName, otpCode, request.Language, cancellationToken);
        return Unit.Value;
    }
}`,

using WordLearner.Application.Common.Exceptions;
using WordLearner.Application.Interfaces.Repositories.Auth;
using WordLearner.Application.Interfaces.Services;
using WordLearner.Domain.Enums.Auth;

namespace WordLearner.Application.Features.Auth;

public record ResetPasswordCommand(string Email, string OtpCode, string NewPassword, string? Language) : IRequest<Unit>;

public class ResetPasswordCommandHandler : IRequestHandler<ResetPasswordCommand, Unit>
{
    private readonly IUserRepository _userRepository;
    private readonly IRefreshTokenRepository _refreshTokenRepository;
    private readonly IOtpService _otpService;
    private readonly IPasswordService _passwordService;
    private readonly IEmailService _emailService;

    public ResetPasswordCommandHandler(
        IUserRepository userRepository,
        IRefreshTokenRepository refreshTokenRepository,
        IOtpService otpService,
        IPasswordService passwordService,
        IEmailService emailService)
    {
        _userRepository = userRepository;
        _refreshTokenRepository = refreshTokenRepository;
        _otpService = otpService;
        _passwordService = passwordService;
        _emailService = emailService;
    }

    public async Task<Unit> Handle(ResetPasswordCommand request, CancellationToken cancellationToken)
    {
        var user = await _userRepository.GetByEmailAsync(request.Email, cancellationToken)
            ?? throw new InvalidOtpException();

        var result = _otpService.Verify(user, request.OtpCode, OtpPurpose.PasswordReset);
        if (result == OtpVerificationResult.Expired)
            throw new OtpExpiredException();
        if (result == OtpVerificationResult.InvalidCode)
            throw new InvalidOtpException();

        user.PasswordHash = _passwordService.Hash(request.NewPassword);

        // SECURITY.md §7: şifre sıfırlanınca tüm cihazlardan çıkış — çalınmış bir oturum varsa da kapanır.
        await _refreshTokenRepository.RevokeAllForUserAsync(user.Id, cancellationToken);
        await _userRepository.SaveChangesAsync(cancellationToken);

        await _emailService.SendPasswordChangedNotificationAsync(user.Email, user.FirstName, request.Language, cancellationToken);
        return Unit.Value;
    }
}`,

        kod: `using MediatR;
using WordLearner.Application.Common.Exceptions;
using WordLearner.Application.Interfaces.Repositories.Auth;
using WordLearner.Application.Interfaces.Services;
using WordLearner.Domain.Exceptions;
using WordLearner.Domain.Enums.Auth;

namespace WordLearner.Application.Features.Auth;

public record ConfirmAccountDeletionCommand(int UserId, string OtpCode) : IRequest<Unit>;

public class ConfirmAccountDeletionCommandHandler : IRequestHandler<ConfirmAccountDeletionCommand, Unit>
{
    private const int GraceDays = 30;

    private readonly IUserRepository _userRepository;
    private readonly IRefreshTokenRepository _refreshTokenRepository;
    private readonly IOtpService _otpService;

    public ConfirmAccountDeletionCommandHandler(IUserRepository userRepository, IRefreshTokenRepository refreshTokenRepository, IOtpService otpService)
    {
        _userRepository = userRepository;
        _refreshTokenRepository = refreshTokenRepository;
        _otpService = otpService;
    }

    public async Task<Unit> Handle(ConfirmAccountDeletionCommand request, CancellationToken cancellationToken)
    {
        var user = await _userRepository.GetByIdAsync(request.UserId, cancellationToken)
            ?? throw new EntityNotFoundException($"User not found: Id={request.UserId}");

        var result = _otpService.Verify(user, request.OtpCode, OtpPurpose.AccountDeletion);
        if (result == OtpVerificationResult.Expired)
            throw new OtpExpiredException();
        if (result == OtpVerificationResult.InvalidCode)
            throw new InvalidOtpException();

        // Kalıcı anonimleştirme DEĞİL — 30 gün grace period başlar (SECURITY.md §9).
        // AccountCleanupBackgroundService (A-20) süre dolunca PII'yi temizler.
        user.IsDeleted = true;
        user.DeletedAt = DateTime.UtcNow;
        user.ScheduledDeletionAt = DateTime.UtcNow.AddDays(GraceDays);
        user.IsActive = false;

        await _refreshTokenRepository.RevokeAllForUserAsync(user.Id, cancellationToken);
        await _userRepository.SaveChangesAsync(cancellationToken);
        return Unit.Value;
    }
}`,
