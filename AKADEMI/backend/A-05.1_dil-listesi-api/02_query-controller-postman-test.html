using WordLearner.Application.DTOs.Words;
using WordLearner.Application.Interfaces.Repositories;

namespace WordLearner.Application.Features.Words;

// languageId'ye ihtiyaç duyan istemci uçları (B-03 WordFormModal/WordPairingPage — de/tr
// kod↔id eşlemesi) için — daha önce yalnızca migration seed'inden (1=de, 2=tr) biliniyordu.
public record GetLanguagesQuery : IRequest<IReadOnlyList<LanguageDto>>;

public class GetLanguagesQueryHandler : IRequestHandler<GetLanguagesQuery, IReadOnlyList<LanguageDto>>
{
    private readonly ILanguageRepository _languageRepository;

    public GetLanguagesQueryHandler(ILanguageRepository languageRepository) =>
        _languageRepository = languageRepository;

    public async Task<IReadOnlyList<LanguageDto>> Handle(GetLanguagesQuery request, CancellationToken ct)
    {
        var languages = await _languageRepository.GetAllActiveAsync(ct);
        return languages.Select(l => new LanguageDto(l.Id, l.Code, l.Name, l.NativeName)).ToList();
    }
}`,

using Microsoft.AspNetCore.Authorization;
using Microsoft.AspNetCore.Mvc;
using WordLearner.Application.DTOs.Words;

namespace WordLearner.API.Controllers;

[ApiController]
[Route("api/v1/languages")]
public class LanguagesController : ControllerBase
{
    private readonly IMediator _mediator;

    public LanguagesController(IMediator mediator) => _mediator = mediator;

    [HttpGet]
    [Authorize]
    [ProducesResponseType(typeof(IReadOnlyList<LanguageDto>), StatusCodes.Status200OK)]
    public async Task<ActionResult<IReadOnlyList<LanguageDto>>> GetLanguages(CancellationToken ct) =>
        Ok(await _mediator.Send(new GetLanguagesQuery(), ct));
}`,

using Moq;
using WordLearner.Application.Features.Words;
using WordLearner.Application.Interfaces.Repositories;
using WordLearner.Domain.Entities.Words;

namespace WordLearner.Tests.Features.Words;

public class GetLanguagesQueryHandlerTests
{
    private readonly Mock<ILanguageRepository> _languageRepo = new();

    private GetLanguagesQueryHandler CreateHandler() => new(_languageRepo.Object);

    [Fact]
    public async Task GetLanguages_ReturnsActiveLanguagesMappedToDto()
    {
        // ARRANGE
        _languageRepo
            .Setup(r => r.GetAllActiveAsync(It.IsAny<CancellationToken>()))
            .ReturnsAsync(
                new List<Language>
                {
                    new()
                    {
                        Id = 1,
                        Code = "de",
                        Name = "German",
                        NativeName = "Deutsch",
                    },
                    new()
                    {
                        Id = 2,
                        Code = "tr",
                        Name = "Turkish",
                        NativeName = "Türkçe",
                    },
                }
            );
        var handler = CreateHandler();

        // ACT
        var result = await handler.Handle(new GetLanguagesQuery(), default);

        // ASSERT
        result.Should().HaveCount(2);
        result.Should().ContainSingle(l => l.Id == 1 && l.Code == "de" && l.NativeName == "Deutsch");
        result.Should().ContainSingle(l => l.Id == 2 && l.Code == "tr" && l.NativeName == "Türkçe");
    }
}`,
