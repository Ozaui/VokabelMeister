using Microsoft.Extensions.Logging;

using WordLearner.Application.Interfaces.Services;
using WordLearner.Domain.Entities.Auth;

// Program.cs'te app.Run()'dan önce, tek seferlik çağrılır — AdminController (A-18) ve
// [Authorize(Roles="Admin")] uçları için döngüsel bağımlılığı kırar (ilk Admin'i kimse
// Register+UpdateUserRole ile oluşturamaz, çünkü UpdateUserRole zaten Admin ister).
public class AdminSeedService : IAdminSeedService
{
    private readonly IUserRepository _userRepository;
    private readonly IPasswordService _passwordService;
    private readonly IConfiguration _configuration;
    private readonly ILogger<AdminSeedService> _logger;

    public AdminSeedService(
        IUserRepository userRepository,
        IPasswordService passwordService,
        IConfiguration configuration,
        ILogger<AdminSeedService> logger)
    {
        _userRepository = userRepository;
        _passwordService = passwordService;
        _configuration = configuration;
        _logger = logger;
    }

    public async Task SeedInitialAdminAsync(CancellationToken cancellationToken = default)
    {
        var email = _configuration["INITIAL_ADMIN_EMAIL"];
        var password = _configuration["INITIAL_ADMIN_PASSWORD"];

        // İkisi de tanımlı değilse (ör. prod'da bilinçli atlanmışsa) sessizce çık — zorunlu değil.
        if (string.IsNullOrWhiteSpace(email) || string.IsNullOrWhiteSpace(password))
            return;

        if (!MailAddress.TryCreate(email, out _))
        {
            _logger.LogWarning("INITIAL_ADMIN_EMAIL is not a valid email address, skipping admin seed");
            return;
        }

        if (await _userRepository.GetByEmailAsync(email, cancellationToken) is not null)
            return;

        var now = DateTime.UtcNow;
        var admin = new User
        {
            Email = email,
            PasswordHash = _passwordService.Hash(password),
            FirstName = "Admin",
            LastName = "Admin",
            Role = "Admin",
            IsActive = true,
            IsEmailVerified = true,
            EmailVerifiedAt = now,
            CreatedAt = now,
            UpdatedAt = now
        };

        await _userRepository.AddAsync(admin, cancellationToken);
        await _userRepository.SaveChangesAsync(cancellationToken);

        _logger.LogInformation("Initial admin account seeded for {Email}", email);
    }
}`,

using Microsoft.Extensions.Configuration;

namespace WordLearner.Tests.Services;

public class AdminSeedServiceTests
{
    private readonly Mock<IUserRepository> _userRepository = new();

    private AdminSeedService CreateService(string? email = "admin@vokabelmeister.com", string? password = "Admin123!") =>
        new(_userRepository.Object, new PasswordService(),
            new ConfigurationBuilder().AddInMemoryCollection(new Dictionary<string, string?>
            {
                ["INITIAL_ADMIN_EMAIL"] = email,
                ["INITIAL_ADMIN_PASSWORD"] = password
            }).Build(),
            Mock.Of<ILogger<AdminSeedService>>());

    [Fact]
    public async Task SeedInitialAdminAsync_EnvVarsNotConfigured_DoesNothing()
    {
        // ARRANGE
        var service = CreateService(email: null, password: null);

        // ACT
        await service.SeedInitialAdminAsync();

        // ASSERT
        _userRepository.Verify(r => r.AddAsync(It.IsAny<User>(), It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task SeedInitialAdminAsync_EmailIsMalformed_DoesNothing()
    {
        // ARRANGE
        var service = CreateService(email: "not-an-email");

        // ACT
        await service.SeedInitialAdminAsync();

        // ASSERT
        _userRepository.Verify(r => r.AddAsync(It.IsAny<User>(), It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task SeedInitialAdminAsync_AdminAlreadyExists_DoesNotCreateDuplicate()
    {
        // ARRANGE — idempotent: aynı e-posta zaten varsa dokunma
        _userRepository.Setup(r => r.GetByEmailAsync("admin@vokabelmeister.com", It.IsAny<CancellationToken>()))
            .ReturnsAsync(new User { Email = "admin@vokabelmeister.com", Role = "Admin" });
        var service = CreateService();

        // ACT
        await service.SeedInitialAdminAsync();

        // ASSERT
        _userRepository.Verify(r => r.AddAsync(It.IsAny<User>(), It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task SeedInitialAdminAsync_NoExistingAdmin_CreatesAdminUser()
    {
        // ARRANGE
        _userRepository.Setup(r => r.GetByEmailAsync("admin@vokabelmeister.com", It.IsAny<CancellationToken>()))
            .ReturnsAsync((User?)null);
        var service = CreateService();

        // ACT
        await service.SeedInitialAdminAsync();

        // ASSERT — Role=Admin, hesap aktif+doğrulanmış, şifre bcrypt ile hash'lenmiş (ham metin DEĞİL)
        _userRepository.Verify(r => r.AddAsync(It.Is<User>(u =>
            u.Email == "admin@vokabelmeister.com" &&
            u.Role == "Admin" &&
            u.IsActive &&
            u.IsEmailVerified &&
            u.PasswordHash != "Admin123!" &&
            !string.IsNullOrEmpty(u.PasswordHash)),
            It.IsAny<CancellationToken>()), Times.Once);
        _userRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Once);
    }
}`,
