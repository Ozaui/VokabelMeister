 public class UserProgressRepository : IUserProgressRepository
 {
     private readonly ZauselDbContext _context;

     public UserProgressRepository(ZauselDbContext context) => _context = context;

     public async Task<List<ProgressSnapshot>> GetSnapshotsAsync(int userId, CancellationToken cancellationToken = default)
     {
         // Silinmiş (IsDeleted) bir kelimenin ilerlemesi sayıma girmez — aksi halde bant/due sayıları,
         // GetByMasteryRangeAsync/GetSuspendedAsync'in (Word'e JOIN yaptığı için zaten hariç tuttuğu)
         // listelerle TUTARSIZ bir toplam gösterirdi.
         var activeWordIds = _context.Words.Select(w => w.Id);
         return await _context.UserProgress
             .Where(p => p.UserId == userId && activeWordIds.Contains(p.WordId))
             .Select(p => new ProgressSnapshot(p.Mastery, p.NextReviewAt, p.IsSuspended, p.CurrentLevel))
             .ToListAsync(cancellationToken);
     }

     public async Task<List<WordProgressItem>> GetByMasteryRangeAsync(
         int userId, decimal minInclusive, decimal? maxExclusive, CancellationToken cancellationToken = default)
     {
         var query = _context.UserProgress.Where(p => p.UserId == userId && p.Mastery >= minInclusive);
         if (maxExclusive.HasValue)
             query = query.Where(p => p.Mastery < maxExclusive.Value);

         var progressRows = await query.ToListAsync(cancellationToken);
         return await JoinWithWordsAsync(progressRows, cancellationToken);
     }

     public async Task<List<WordProgressItem>> GetSuspendedAsync(int userId, CancellationToken cancellationToken = default)
     {
         var progressRows = await _context.UserProgress
             .Where(p => p.UserId == userId && p.IsSuspended)
             .ToListAsync(cancellationToken);
         return await JoinWithWordsAsync(progressRows, cancellationToken);
     }

     public async Task<UserProgress?> GetByUserAndWordAsync(int userId, int wordId, CancellationToken cancellationToken = default) =>
         await _context.UserProgress.FirstOrDefaultAsync(p => p.UserId == userId && p.WordId == wordId, cancellationToken);

     public Task<int> SaveChangesAsync(CancellationToken cancellationToken = default) =>

     // Word navigation property'si yok (CategoryRepository'nin Language/Translation birleştirmesiyle
     // AYNI desen) — kelime metnini almak için ayrı bir sorgu + in-memory Dictionary eşleşmesi.
     private async Task<List<WordProgressItem>> JoinWithWordsAsync(List<UserProgress> progressRows, CancellationToken cancellationToken)
     {
         var wordIds = progressRows.Select(p => p.WordId).Distinct().ToList();
         var wordsById = await _context.Words.Where(w => wordIds.Contains(w.Id)).ToDictionaryAsync(w => w.Id, cancellationToken);

         return progressRows
             .Where(p => wordsById.ContainsKey(p.WordId))
             .Select(p =>
             {
                 var word = wordsById[p.WordId];
                 return new WordProgressItem(
                     p.WordId, word.Text, word.Definition, p.CurrentLevel, p.Mastery,
                     p.NextReviewAt, p.IsSuspended, p.ConsecutiveIncorrect);
             })
             .ToList();
     }
 }`,

using Zausel.Application.Interfaces.Repositories.Srs;
using Zausel.Application.Interfaces.Services;
using Zausel.Domain.Entities.Srs;
using Zausel.Domain.Exceptions;

namespace Zausel.Application.Features.Progress;

public record LearnSystemWordCommand(int WordId, int UserId, string? ActorRole) : IRequest<LearnSystemWordResponse>;

public class LearnSystemWordCommandHandler : IRequestHandler<LearnSystemWordCommand, LearnSystemWordResponse>
{
    private readonly IUserProgressRepository _userProgressRepository;
    private readonly IWordConceptRepository _wordConceptRepository;
    private readonly ILanguageRepository _languageRepository;
    private readonly IActivityLogger _activityLogger;
    private readonly IAchievementService _achievementService;

    public LearnSystemWordCommandHandler(
        IUserProgressRepository userProgressRepository, IWordConceptRepository wordConceptRepository,
        ILanguageRepository languageRepository, IActivityLogger activityLogger, IAchievementService achievementService)
    {
        _userProgressRepository = userProgressRepository;
        _wordConceptRepository = wordConceptRepository;
        _languageRepository = languageRepository;
        _activityLogger = activityLogger;
        _achievementService = achievementService;
    }

    public async Task<LearnSystemWordResponse> Handle(LearnSystemWordCommand request, CancellationToken cancellationToken)
    {
        var word = await _wordConceptRepository.GetWordByIdAsync(request.WordId, cancellationToken)
            ?? throw new EntityNotFoundException($"Word not found: Id={request.WordId}");

        var germanLanguage = await _languageRepository.GetByCodeAsync("de", cancellationToken)
            ?? throw new EntityNotFoundException("Language not found: Code=de");
        var germanWord = await _wordConceptRepository.FindWordAsync(word.WordConceptId, germanLanguage.Id, cancellationToken);
        // Kavram henüz Almanca'yla eşleşmemişse (tek dilli) kendi metnine düşülür — bu ekranın hiçbir
        // zaman boş bir başlıkla gösterilmemesi için.
        var germanText = germanWord?.Text ?? word.Text;

        var existing = await _userProgressRepository.GetByUserAndWordAsync(request.UserId, request.WordId, cancellationToken);
        if (existing is not null)
            return new LearnSystemWordResponse(existing.Id, request.WordId, germanText, AlreadyExists: true);

        var userProgress = new UserProgress { UserId = request.UserId, WordId = request.WordId };
        await _userProgressRepository.AddAsync(userProgress, request.UserId, cancellationToken);
        await _userProgressRepository.SaveChangesAsync(cancellationToken);

        await _activityLogger.LogAsync(
            request.UserId, request.ActorRole, "LEARN_SYSTEM_WORD", entityType: "UserProgress", entityId: userProgress.Id,
            oldValue: null, newValue: new { userProgress.WordId }, cancellationToken: cancellationToken);
        await _achievementService.EvaluateAndUnlockAsync(request.UserId, cancellationToken: cancellationToken);

        return new LearnSystemWordResponse(userProgress.Id, request.WordId, germanText, AlreadyExists: false);
    }
}`,

 using Zausel.Application.Common.Exceptions;
 using Zausel.Application.Interfaces.Services;

 namespace Zausel.Application.Services;

 // Yalnızca uzantı kontrolü GÜVENSİZ — bir .exe ".png" adıyla yüklenebilir; magic bytes ile
 // dosyanın GERÇEK ilk baytları da bildirdiği uzantıyla eşleşmeli (A_backend.md A-07 notu).
 public class LocalFileStorageService : IFileStorageService
 {
     private const long MaxFileSizeBytes = 5 * 1024 * 1024;

     private static readonly HashSet<string> AllowedExtensions = new(StringComparer.OrdinalIgnoreCase)
     {
         ".jpg", ".jpeg", ".png", ".webp"
     };

     private readonly IConfiguration _cfg;

     public LocalFileStorageService(IConfiguration cfg) => _cfg = cfg;

     public async Task<string> SaveImageAsync(Stream content, string originalFileName, long contentLength, string purpose, CancellationToken cancellationToken)
     {
         var extension = Path.GetExtension(originalFileName);
         if (!AllowedExtensions.Contains(extension))
             throw new UnsupportedFileTypeException();
         if (contentLength > MaxFileSizeBytes)
             throw new FileTooLargeException();

         using var buffer = new MemoryStream();
         await content.CopyToAsync(buffer, cancellationToken);
         var bytes = buffer.ToArray();

         if (!MatchesDeclaredType(bytes, extension))
             throw new UnsupportedFileTypeException();

         // uploads/<purpose>/<yyyy>/<MM>/<guid>.ext — amaca göre ayrışır, ayda bir yeni klasöre döner.
         var now = DateTime.UtcNow;
         var relativeDir = Path.Combine(purpose, now.Year.ToString(), now.Month.ToString("00"));
         var uploadDir = Path.Combine(_cfg["FileStorage:UploadPath"]!, relativeDir);
         Directory.CreateDirectory(uploadDir);

         var fileName = $"{Guid.NewGuid():N}{extension.ToLowerInvariant()}";
         await File.WriteAllBytesAsync(Path.Combine(uploadDir, fileName), bytes, cancellationToken);

         var relativeUrl = string.Join('/', purpose, now.Year, now.Month.ToString("00"), fileName);
         return $"{_cfg["FileStorage:BaseUrl"]!.TrimEnd('/')}/{relativeUrl}";
     }

+    public Task DeleteImageAsync(string url, CancellationToken cancellationToken)
+    {
+        var baseUrl = _cfg["FileStorage:BaseUrl"]!.TrimEnd('/');
+        if (!url.StartsWith(baseUrl, StringComparison.Ordinal))
+            return Task.CompletedTask;
+
+        var relativePath = url[(baseUrl.Length + 1)..].Replace('/', Path.DirectorySeparatorChar);
+        var fullPath = Path.Combine(_cfg["FileStorage:UploadPath"]!, relativePath);
+        if (File.Exists(fullPath))
+            File.Delete(fullPath);
+
+        return Task.CompletedTask;
+    }

     // Spoofing regresyonu: içerik bildirilen uzantıyla eşleşmiyorsa (ör. metin dosyası ".png" adıyla) reddedilir.
     private static bool MatchesDeclaredType(byte[] bytes, string extension) => extension.ToLowerInvariant() switch
     {
         ".jpg" or ".jpeg" => bytes.Length >= 3 && bytes[0] == 0xFF && bytes[1] == 0xD8 && bytes[2] == 0xFF,
         ".png" => bytes.Length >= 8 && bytes[0] == 0x89 && bytes[1] == 0x50 && bytes[2] == 0x4E && bytes[3] == 0x47

                    && bytes[8] == (byte)'W' && bytes[9] == (byte)'E' && bytes[10] == (byte)'B' && bytes[11] == (byte)'P',
         _ => false
     };
 }`,

        kod: `using MediatR;
using Zausel.Application.DTOs.UserCards;
using Zausel.Application.Interfaces.Repositories.PersonalContent;
using Zausel.Application.Interfaces.Services;
using Zausel.Domain.Exceptions;

namespace Zausel.Application.Features.UserCards;

public record UploadUserCardImageCommand(
    int UserCardId, Stream Content, string FileName, long ContentLength, int UserId, string? ActorRole)
    : IRequest<UserCardResponse>;

public class UploadUserCardImageCommandHandler : IRequestHandler<UploadUserCardImageCommand, UserCardResponse>
{
    private readonly IUserCardRepository _userCardRepository;
    private readonly IFileStorageService _fileStorageService;
    private readonly IActivityLogger _activityLogger;

    public UploadUserCardImageCommandHandler(
        IUserCardRepository userCardRepository, IFileStorageService fileStorageService, IActivityLogger activityLogger)
    {
        _userCardRepository = userCardRepository;
        _fileStorageService = fileStorageService;
        _activityLogger = activityLogger;
    }

    public async Task<UserCardResponse> Handle(UploadUserCardImageCommand request, CancellationToken cancellationToken)
    {
        // Sahiplik filtresi burada gömülü — başkasının kartına görsel yüklenemez.
        var aggregate = await _userCardRepository.GetByIdForUserAsync(request.UserCardId, request.UserId, cancellationToken)
            ?? throw new EntityNotFoundException($"UserCard not found: Id={request.UserCardId}");
        var oldImageUrl = aggregate.Card.ImageUrl;

        var newImageUrl = await _fileStorageService.SaveImageAsync(
            request.Content, request.FileName, request.ContentLength, "user-cards", cancellationToken);

        if (oldImageUrl is not null)
            await _fileStorageService.DeleteImageAsync(oldImageUrl, cancellationToken);

        aggregate.Card.ImageUrl = newImageUrl;
        await _userCardRepository.UpdateAsync(aggregate.Card, request.UserId, cancellationToken);
        await _userCardRepository.SaveChangesAsync(cancellationToken);

        var response = UserCardMapping.ToResponse(aggregate);

        await _activityLogger.LogAsync(
            request.UserId, request.ActorRole, "UPDATE_USER_CARD", entityType: "UserCard", entityId: aggregate.Card.Id,
            oldValue: new { ImageUrl = oldImageUrl }, newValue: new { ImageUrl = newImageUrl }, cancellationToken: cancellationToken);

        return response;
    }
}`,
