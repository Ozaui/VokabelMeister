        dosyaYolu: 'backend/WordLearner.API/Conventions/RoutePrefixConvention.cs',
        nedenBuKlasor: '`WordLearner.API/Conventions/` — ASP.NET Core MVC\'nin "controller modelini nasıl inşa edeceğini" özelleştiren sınıflar (`IApplicationModelConvention`) için standart, `Middleware/` klasörüyle KARDEŞ bir klasör; middleware HTTP isteğini işlerken, convention controller\'lar DAHA UYGULAMA BAŞLARKEN (route\'lar inşa edilirken) çalışır — ikisi FARKLI aşamalar.',
        kod: `using Microsoft.AspNetCore.Mvc;
using Microsoft.AspNetCore.Mvc.ApplicationModels;

namespace WordLearner.API.Conventions;

// Tüm controller'lara "api/v1" önekini TEK yerden ekler (AddControllers'a kayıt anında) —
// TASK/A_backend.md A-01 versiyonlama kararı: v2 ileride açılabilsin diye URL prefix'i baştan
// konur, Asp.Versioning gibi bir kütüphane henüz eklenmez (tek versiyon var, YAGNI).
public class RoutePrefixConvention : IApplicationModelConvention
{
    private readonly AttributeRouteModel _prefix;

    public RoutePrefixConvention(string prefix)
    {
        _prefix = new AttributeRouteModel(new RouteAttribute(prefix));
    }

    public void Apply(ApplicationModel application)
    {
        foreach (var controller in application.Controllers)
        foreach (var selector in controller.Selectors)
        {
            selector.AttributeRouteModel = selector.AttributeRouteModel is null
                ? _prefix
                : AttributeRouteModel.CombineAttributeRouteModel(_prefix, selector.AttributeRouteModel);
        }
    }
}`,

        diff: ` using System.Text;
 using FluentValidation;

+using WordLearner.API.Conventions;

-builder.Services.AddControllers();
+builder.Services.AddControllers(options => options.Conventions.Add(new RoutePrefixConvention("api/v1")));
 builder.Services.AddEndpointsApiExplorer();
 builder.Services.AddSwaggerGen();

 builder.Services.AddInfrastructureServices(builder.Configuration);
 builder.Services.AddApplicationServices();

 // Application assembly'sinde henüz hiçbir Command/Validator yok (ilk feature ile dolacak) —

 builder.Services.AddValidatorsFromAssembly(typeof(IRepository<>).Assembly);
 builder.Services.AddMediatR(cfg => cfg.RegisterServicesFromAssembly(typeof(IRepository<>).Assembly));

 builder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme).AddJwtBearer(options =>

 builder.Services.AddAuthorization();

 builder.Services.AddCors(options => options.AddPolicy("Default", policy => policy
     .WithOrigins(builder.Configuration.GetSection("Cors:AllowedOrigins").Get<string[]>() ?? [])
     .AllowAnyMethod()
     .AllowAnyHeader()));

 var app = builder.Build();

 if (app.Environment.IsDevelopment())
 {

 }

 app.UseMiddleware<RequestResponseLoggingMiddleware>();
 app.UseMiddleware<ExceptionHandlingMiddleware>();
 app.UseMiddleware<SecurityHeadersMiddleware>();
 app.UseHttpsRedirection();
 app.UseCors("Default");
 app.UseAuthentication();
 app.UseAuthorization();
 app.MapControllers();

 app.Run();`,
