      },
      {
        tur: 'kod',
        baslik: 'GetCategoriesQuery.cs — Ağaç Kurma + Seviye Filtresi',
        dosyaYolu: 'backend/Zausel.Application/Features/Categories/GetCategoriesQuery.cs',
        nedenBuKlasor: 'Diğer tüm Command/Query dosyaları gibi Features/Categories altında — CQRS deseninde bir Query\'nin Handler\'ı ile aynı dosyada yaşaması, bir özellikle ilgili TÜM akışın (istek şekli + iş mantığı) tek dosyada görülebilmesini sağlar.',
        kod: `using MediatR;
using Zausel.Application.DTOs.Categories;
using Zausel.Application.Interfaces.Repositories.Content;

namespace Zausel.Application.Features.Categories;

public record GetCategoriesQuery(string? Level, bool IncludeWordCount) : IRequest<List<CategoryResponse>>;

public class GetCategoriesQueryHandler : IRequestHandler<GetCategoriesQuery, List<CategoryResponse>>
{
    private static readonly string[] Levels = ["A1", "A2", "B1", "B2", "C1", "C2"];

    private readonly ICategoryRepository _categoryRepository;

    public GetCategoriesQueryHandler(ICategoryRepository categoryRepository) => _categoryRepository = categoryRepository;

    public async Task<List<CategoryResponse>> Handle(GetCategoriesQuery request, CancellationToken cancellationToken)
    {
        var all = await _categoryRepository.GetAllAsync(cancellationToken);
        var filtered = request.Level is null
            ? all
            : all.Where(a => IsInRange(request.Level, a.Category.MinLevel, a.Category.MaxLevel)).ToList();

        var wordCounts = request.IncludeWordCount
            ? await _categoryRepository.GetActiveWordCountsAsync(cancellationToken)
            : null;

        // Filtrelenmiş üst kategori kümenin DIŞINDA kaldıysa (ör. level filtresiyle elenmişse), o çocuk
        // ağacın KÖKÜ olarak gösterilir — sessizce KAYBOLMAZ. ILookup null anahtarı DESTEKLER
        // (Dictionary'nin AKSİNE), kök kategoriler (ParentCategoryId=null) bu yüzden ToLookup ile.
        var filteredIds = filtered.Select(a => a.Category.Id).ToHashSet();
        var childrenByParent = filtered
            .ToLookup(a => a.Category.ParentCategoryId is int parentId && filteredIds.Contains(parentId) ? parentId : (int?)null);

        return BuildTree(null, childrenByParent, wordCounts);
    }

    private static List<CategoryResponse> BuildTree(
        int? parentId, ILookup<int?, CategoryAggregate> childrenByParent, Dictionary<int, int>? wordCounts)
    {
        return childrenByParent[parentId]
            .OrderBy(c => c.Category.DisplayOrder)
            .Select(c => CategoryMapping.ToResponse(c, wordCounts?.GetValueOrDefault(c.Category.Id, 0)) with
            {
                Children = BuildTree(c.Category.Id, childrenByParent, wordCounts)
            })
            .ToList();
    }

    // MinLevel/MaxLevel bir ARALIK (ör. yalnızca MinLevel="A2" set edilmişse üst sınır YOK, C2'ye
    // kadar her seviyeden istenen kelime bu kategoride görünebilir) — tek bir eşitlik kontrolü DEĞİL.
    private static bool IsInRange(string level, string? minLevel, string? maxLevel)
    {
        var levelIndex = Array.IndexOf(Levels, level);
        if (levelIndex < 0)
            return true;

        var minIndex = minLevel is null ? 0 : Array.IndexOf(Levels, minLevel);
        var maxIndex = maxLevel is null ? Levels.Length - 1 : Array.IndexOf(Levels, maxLevel);
        return levelIndex >= minIndex && levelIndex <= maxIndex;
    }
}`,
        satirlar: [
          { satir: 'using MediatR;', aciklama: 'MediatR\'ın `IRequest<T>`/`IRequestHandler<TRequest,TResponse>` arayüzleri — CQRS\'in Command/Query+Handler çiftini bu paket sağlıyor.', neden: 'Controller\'ın doğrudan bir Handler sınıfı çağırmak yerine `_mediator.Send(query)` demesi, Controller\'ı hangi Handler\'ın çalıştığından TAMAMEN habersiz bırakır — yeni bir pipeline davranışı (ör. loglama, validasyon) eklemek Controller\'a hiç dokunmadan mümkün olur.', olmasaydi: 'MediatR olmasaydı her Controller action\'ı ilgili Handler\'ı DI\'dan elle enjekte edip çağırmak ZORUNDA kalırdı — `ValidationBehavior` gibi TÜM Handler\'lara otomatik uygulanan bir ara katman (pipeline) yazılamazdı.' },
          { satir: 'using Zausel.Application.DTOs.Categories;', aciklama: '`CategoryResponse` bu namespace\'te tanımlı — Query\'nin dönüş tipi.', neden: 'DTO\'lar `DTOs/<Domain>/` altında toplanır, Handler\'ın kendi klasöründe DEĞİL — bir sonraki geliştirici "bu response şekli nerede" sorusunu HER ZAMAN aynı klasörde arayarak yanıtlayabilir.', olmasaydi: 'DTO\'lar Handler dosyalarının içine gömülseydi, admin panel (B-04) hangi alanların API\'dan döndüğünü görmek için TÜM Handler dosyalarını taramak ZORUNDA kalırdı.' },
          { satir: 'using Zausel.Application.Interfaces.Repositories.Content;', aciklama: '`ICategoryRepository`/`CategoryAggregate` bu namespace\'te — Handler\'ın veri erişimi için bağımlı olduğu arayüz.', neden: 'Handler somut `CategoryRepository` sınıfına DEĞİL soyut arayüze bağımlı — birim testinde gerçek bir veritabanı olmadan `Mock<ICategoryRepository>` ile Handler tek başına test edilebilir.', olmasaydi: 'Handler doğrudan Infrastructure katmanındaki `CategoryRepository`\'ye bağımlı olsaydı, her testte gerçek bir SQL Server bağlantısı gerekirdi — testler yavaş ve DB durumuna bağımlı olurdu.' },
          { satir: 'namespace Zausel.Application.Features.Categories;', aciklama: 'Klasör yapısıyla (`Features/Categories/`) birebir eşleşen ad alanı — bu dosyanın "Categories" özelliğine ait olduğunu bildirir.', neden: 'MediatR, `GetCategoriesQuery` için `IRequestHandler` implementasyonunu DI container\'a assembly TARAMASIYLA kaydeder — bu taramanın kriteri sınıfın `IRequestHandler<,>` arayüzünü implemente ETMESİDİR, ad alanının METNİNE hiç BAKMAZ; klasörleme SALT bir sonraki geliştiricinin "Category özelliğiyle ilgili HER dosya nerede" sorusunu TEK klasöre bakarak yanıtlayabilmesi İÇİNDİR.', olmasaydi: 'Tüm Command/Query\'ler TEK bir düz ad alanında (Domain ayrımı OLMADAN) toplansaydı, 30+ Handler dosyası arasında "Category\'ye ait olanlar HANGİLERİ" sorusu dosya isimlerine bakarak (grep\'siz) YANITLANAMAZDI — MediatR YİNE doğru çalışırdı ama insan okunabilirliği KAYBOLURDU.' },
          { satir: 'public record GetCategoriesQuery(string? Level, bool IncludeWordCount) : IRequest<List<CategoryResponse>>;', aciklama: 'İstek şekli — opsiyonel `Level` (CEFR seviyesi, ör. "A1") ve `IncludeWordCount` (varsayılan `false`, `bool` olduğu için query string\'te belirtilmezse otomatik `false`).', neden: '`record` kullanımı MediatR\'ın diğer TÜM Command/Query\'leriyle (CreateWordCommand, GetWordsQuery vb.) tutarlı — değişmez (immutable), yapısal eşitliğe sahip bir istek nesnesi, test yazarken `new GetCategoriesQuery(...)` ile beklenen değerle KARŞILAŞTIRILABİLİR.', olmasaydi: 'Sıradan bir `class` kullanılsaydı, iki eşit-görünen istek nesnesi referans eşitliğinden dolayı testte `Equals` ile KARŞILAŞTIRILAMAZDI.' },
          { satir: 'public class GetCategoriesQueryHandler : IRequestHandler<GetCategoriesQuery, List<CategoryResponse>>', aciklama: 'MediatR\'ın `Handle` metodunu implemente eden sınıf — `GetCategoriesQuery` geldiğinde ÇALIŞACAK kod.', neden: 'MediatR bu sınıfı DI container\'dan (assembly taramasıyla) OTOMATİK bulur — Program.cs\'te elle bir kayıt YAZILMAZ.', olmasaydi: 'MediatR olmasaydı Controller\'ın hangi sınıfı çağıracağını KENDİSİ bilmesi gerekirdi — Controller ile iş mantığı arasındaki gevşek bağ (loose coupling) kaybolurdu.' },
          { satir: 'private static readonly string[] Levels = ["A1", "A2", "B1", "B2", "C1", "C2"];', aciklama: 'CEFR seviyelerinin SIRALI listesi — dizideki KONUM (index), o seviyenin "kaçıncı" olduğunu temsil eder (A1=0, C2=5).', neden: '`IsInRange` metodunun "A2, A1\'den YÜKSEK bir seviye midir" sorusunu yanıtlaması için seviyelerin bir SIRASI olması gerekiyor — string\'ler ("A1" < "A2") alfabetik sırada RASTLANTISAL olarak doğru çıkar ama "B1" ile "A2" karşılaştırması alfabetik sırada YANLIŞ sonuç VERİRDİ ("B1" < "A2" alfabetik olarak YANLIŞ), bu yüzden sabit bir dizi + `Array.IndexOf` kullanılıyor.', olmasaydi: 'Seviyeler string olarak DOĞRUDAN karşılaştırılsaydı (`"B1" < "A2"` gibi), `?level=B1` isteği MinLevel="A2" olan bir kategoriyi YANLIŞLIKLA elerdi (alfabetik sırada "A2" > "B1" çıkar) — sessiz, fark edilmesi zor bir mantık hatası.' },
          { satir: 'private readonly ICategoryRepository _categoryRepository;', aciklama: 'Constructor injection ile DI container\'dan gelen tek bağımlılık.', neden: 'Bu Query yalnızca OKUMA yapıyor — `ILanguageRepository`/`IActivityLogger` gibi başka bir bağımlılığa ihtiyacı YOK (CreateCategoryCommand\'ın aksine, o dil çözümlemesi + audit log gerektiriyordu).', olmasaydi: 'Gereksiz bağımlılıklar enjekte edilseydi, her birim testinde kullanılmayan mock\'lar KURULMASI gerekirdi — test kodu şişerdi.' },
          { satir: 'public GetCategoriesQueryHandler(ICategoryRepository categoryRepository) => _categoryRepository = categoryRepository;', aciklama: 'Expression-bodied constructor — tek satırlık atama.', neden: 'Projedeki TÜM tek-bağımlılıklı Handler/Repository constructor\'ları AYNI kısa sözdizimini kullanıyor (ör. `LanguageRepository`) — kod tabanında tutarlı bir stil, okuyucu her yerde AYNI kalıbı görüyor.', olmasaydi: 'Süslü parantezli uzun bir constructor gövdesi (`{ _categoryRepository = categoryRepository; }`) tek satırlık bir atama için gereksiz GÖRSEL GÜRÜLTÜ yaratırdı.' },
          { satir: 'public async Task<List<CategoryResponse>> Handle(GetCategoriesQuery request, CancellationToken cancellationToken)', aciklama: 'MediatR\'ın çağıracağı asıl metot — imza `IRequestHandler<TRequest,TResponse>` arayüzünce ZORUNLU kılınıyor.', neden: '`CancellationToken` parametresi HTTP isteği iptal edilirse (ör. kullanıcı sayfayı kapatırsa) DB sorgusunun YARIDA KESİLEBİLMESİ için — projedeki HER I/O metodunda zorunlu.', olmasaydi: '`CancellationToken` geçirilmeseydi, kullanıcı istekten VAZGEÇSE bile sunucu sorguyu SONUNA kadar çalıştırmaya devam ederdi — gereksiz DB yükü.' },
          { satir: 'var all = await _categoryRepository.GetAllAsync(cancellationToken);', aciklama: 'Repository\'den TÜM kategorileri (12-30 satır civarı, küçük bir set) TEK sorguda çeker — henüz filtrelenmemiş, henüz ağaç DEĞİL.', neden: 'Kategori sayısı küçük olduğu için (sayfalama YOK, `PagedResult` kullanılmıyor) tamamını belleğe almak, ardından LINQ ile filtrelemek/ağaçlamak DB\'ye karmaşık bir sorgu yazmaktan daha BASİT.', olmasaydi: 'Sayfalı bir sorgu yazılsaydı, bir kategorinin çocuğu FARKLI bir sayfada kalabilir, ağaç EKSİK kurulurdu.' },
          { satir: 'var filtered = request.Level is null', aciklama: 'Üç satırlık bir ternary\'nin ilk satırı — `Level` verilmemişse (`null`) filtreleme HİÇ yapılmaz.', neden: '`?level=` opsiyonel bir query parametresi — verilmezse admin panelin "TÜM kategorileri göster" ekranı bu Query\'yi HİÇ `level` göndermeden çağırabilir.', olmasaydi: '`Level` zorunlu olsaydı, "tüm kategorileri seviyeye bakmaksızın listele" gibi basit bir istek için sahte bir değer (ör. `"C2"`) UYDURMAK gerekirdi.' },
          { satir: '? all', aciklama: '`Level` `null` ise filtrelenmemiş TÜM liste kullanılır.', neden: 'Bu dal `IsInRange`\'i HİÇ çağırmıyor — gereksiz bir hesaplama YAPILMIYOR.', olmasaydi: 'Bu kısayol olmasaydı, `Level=null` durumunda `IsInRange` her kategori için "her zaman true" DÖNDÜRECEK şekilde ÖZEL olarak yazılması gerekirdi — gereksiz bir karmaşıklık.' },
          { satir: ': all.Where(a => IsInRange(request.Level, a.Category.MinLevel, a.Category.MaxLevel)).ToList();', aciklama: '`Level` doluysa, her kategori için `IsInRange` ile ARALIK kontrolü yapılır — yalnızca aralığa GİRENLER kalır.', neden: '`.ToList()` ile sonuç HEMEN somutlaştırılır (materialized) — aşağıda `filteredIds`/`ToLookup` bu listeyi BİRDEN FAZLA kez gezecek, `IQueryable` gecikmeli değerlendirme (deferred execution) olsaydı her gezinti AYNI filtrelemeyi TEKRAR çalıştırırdı.', olmasaydi: '`.ToList()` olmasaydı (LINQ-to-Objects\'te bu kadar kritik olmasa da, alışkanlık olarak) her `filtered` erişimi filtreyi YENİDEN hesaplardı — küçük veri setinde performans sorunu YARATMAZ ama okunabilirlik/niyet netliği için materialize etmek tercih edilir.' },
          { satir: 'var wordCounts = request.IncludeWordCount', aciklama: 'İkinci ternary\'nin ilk satırı — `?includeWordCount=true` isteniyorsa ek bir sorgu ÇALIŞTIRILIR, istenmiyorsa `wordCounts` `null` KALIR.', neden: 'Kelime sayısı hesaplaması `WordCategories` tablosunu `WordConcepts.IsActive` ile JOIN eden ayrı bir sorgu — HER `GET /categories` isteğinde bunu çalıştırmak GEREKSİZ maliyet, yalnızca admin panelin "kaç kelime var" ihtiyacı olduğunda TALEP EDİLİR.', olmasaydi: 'Kelime sayısı HER ZAMAN hesaplansaydı, yalnızca ağaç yapısını görmek isteyen (ör. bir dropdown dolduran) bir istek bile gereksiz bir JOIN sorgusuna KATLANMAK ZORUNDA kalırdı.' },
          { satir: '? await _categoryRepository.GetActiveWordCountsAsync(cancellationToken)', aciklama: 'Tüm kategoriler için TEK sorguda (CategoryId → aktif kelime sayısı) bir sözlük döner.', neden: 'HER kategori için AYRI AYRI "bu kategoride kaç kelime var" sorgusu atmak yerine TEK bir GROUP BY sorgusuyla TÜM sayımlar bir kerede alınır — N+1 sorgu problemi (12 kategori için 12 ayrı sorgu) bu şekilde ÖNLENİR.', olmasaydi: 'Her kategori için ayrı bir sayım sorgusu atılsaydı, 12 kategoride 12 ayrı DB round-trip GEREKİRDİ — gereksiz gecikme.' },
          { satir: ': null;', aciklama: '`IncludeWordCount=false` ise `wordCounts` `null` kalır — aşağıda `CategoryMapping.ToResponse`\'a `null` geçilecek, bu da `WordCount` alanının yanıt JSON\'ında `null` olarak DÖNMESİNİ sağlar.', neden: '`null` ile `0` arasındaki fark ANLAMLI: `null` = "hesaplanmadı, sormadın", `0` = "hesaplandı, hiç kelime YOK" — istemci bu ikisini birbirinden AYIRT edebilmeli.', olmasaydi: '`wordCounts` yerine boş bir sözlük (`new Dictionary<int,int>()`) dönseydi, `GetValueOrDefault(id, 0)` HER kategori için `0` döndürürdü — istemci "gerçekten 0 kelime mi var, yoksa hiç HESAPLANMADI mı" AYIRT EDEMEZDİ.' },
          { satir: 'var filteredIds = filtered.Select(a => a.Category.Id).ToHashSet();', aciklama: 'Filtrelenmiş kategorilerin ID\'lerini bir `HashSet<int>`\'e toplar — `Contains` kontrolü O(1) olsun diye.', neden: 'Aşağıdaki `ToLookup` çağrısı HER kategori için "ebeveynim filtrelenmiş kümede mi" sorusunu SORACAK — bir `List<int>.Contains` O(n) olurdu, `HashSet<int>.Contains` O(1).', olmasaydi: '`HashSet` yerine düz bir `List` kullanılsaydı, 30 kategoriyle bile fark edilmez ama alışkanlık/ölçeklenebilirlik açısından YANLIŞ bir tercih olurdu — kategori sayısı ileride YÜZLERE çıkarsa performans FARK EDİLİR hale gelirdi.' },
          { satir: 'var childrenByParent = filtered', aciklama: '`ToLookup` çağrısının başladığı satır.', neden: 'Değişken adı (`childrenByParent`) sonraki satırın NE ÜRETTİĞİNİ önceden okuyucuya SÖYLÜYOR — "ebeveyn ID\'sine göre gruplanmış çocuklar".', olmasaydi: 'Tek satırlık bir ifade olsaydı (`var childrenByParent = filtered.ToLookup(...)`), satır ÇOK UZAYIP okunması ZORLAŞIRDI — iki satıra bölünmesi bir stil tercihi.' },
          { satir: '.ToLookup(a => a.Category.ParentCategoryId is int parentId && filteredIds.Contains(parentId) ? parentId : (int?)null);', aciklama: 'Her kategoriyi "EFEKTİF ebeveyni" neyse ona göre gruplar — `ParentCategoryId` DOLU ve o ebeveyn filtrelenmiş kümede VARSA gerçek ebeveyn, YOKSA (ya kök ya da ebeveyni elenmiş) `null` (kök) sayılır.', neden: '`ToLookup` (`Dictionary<int?, ...>`\'in AKSİNE) `int?` gibi NULLABLE bir anahtar tipini DOĞRUDAN destekler — .NET\'in `Dictionary<TKey,TValue>` generic\'i `TKey`\'in `notnull` olmasını ZORUNLU kılar, derleme sırasında `int?` için bir UYARI (CS8714) verirdi.', olmasaydi: '`Dictionary<int?, List<CategoryAggregate>>` kullanılmaya ÇALIŞILSAYDI, kod DERLENİRDİ ama derleyici "bu anahtar null olabilir, TKey kısıtına UYMUYOR" uyarısı verirdi — `ToLookup` bu sorunu YAŞAMADAN, dilin BUNUN İÇİN var olan aracını kullanarak ÇÖZER.' },
          { satir: 'return BuildTree(null, childrenByParent, wordCounts);', aciklama: 'Ağaç kurmayı KÖKTEN (`parentId=null`) başlatan rekürsif çağrı.', neden: 'Kök kategorilerin (`ParentCategoryId=null` OLANLAR) hepsi `childrenByParent[null]` anahtarının ALTINDA toplanmış durumda — `BuildTree`\'nin İLK çağrısı bu anahtarla başlar.', olmasaydi: 'Rekürsif bir yardımcı metot OLMASAYDI, "kökten başlayıp her seviyede çocukları BUL" mantığı iç içe `foreach` döngüleriyle (kaç seviye derinlik olduğu BİLİNMEDEN) yazılması GEREKİRDİ — kategori hiyerarşisi ileride 3-4 seviye DERİNLEŞİRSE bu kod ÇALIŞMAZDI.' },
