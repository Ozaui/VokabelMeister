          { satir: 'c, translationsByConcept.GetValueOrDefault(c.Id, []), categoriesByConcept.GetValueOrDefault(c.Id, [])))', aciklama: 'Sayfa listesindeki HER kavram için kategori verisi de `GetValueOrDefault` ile GÜVENLİ şekilde eklenir.', neden: '`GetAggregateAsync`\'teki AYNI mantık — kategorisiz bir kelime İSTİSNA fırlatmadan boş bir `Categories` listesiyle DÖNER.', olmasaydi: 'Sözlük indeksleyicisi kullanılsaydı, kategorisiz herhangi bir kelime `GET /words` LİSTESİNİ TAMAMEN 500\'e DÜŞÜRÜRDÜ (tek bir eksik kayıt TÜM sayfayı bozardı).' },
          { satir: 'public async Task ReplaceWordCategoriesAsync(int wordConceptId, List<int> categoryIds, CancellationToken cancellationToken = default)', aciklama: 'Arayüzde (bir önceki slayt) tanımlanan sözleşmenin GERÇEK implementasyonu.', neden: 'Bölüm 8\'de `CreateWordCommand`/`UpdateWordCommand`\'ın çağıracağı metot — burada TANIMLANIYOR, orada KULLANILACAK.', olmasaydi: 'Arayüzde tanım olup implementasyon OLMASAYDI proje DERLENMEZDİ (interface implementasyonu eksik hatası).' },
          { satir: 'var existing = await _context.WordCategories.Where(wc => wc.WordConceptId == wordConceptId).ToListAsync(cancellationToken);', aciklama: 'Bu kelimeye ait TÜM mevcut kategori bağlarını çeker — silinecek/değiştirilecek adaylar.', neden: '"Tam değişim" (replace) semantiği için ÖNCE mevcut durumun TAMAMI bilinmeli — hangi satırların ARTIK geçerli olmadığını belirlemenin tek yolu bu.', olmasaydi: 'Mevcut satırlar hiç ÇEKİLMESEYDİ, eski bağlar veritabanında SONSUZA dek KALIRDI — bir kelimeden bir kategori "kaldırma" işlemi HİÇ MÜMKÜN olmazdı.' },
          { satir: '_context.WordCategories.RemoveRange(existing);', aciklama: 'Mevcut TÜM bağları HARD (kalıcı, geri dönüşü olmayan) siler.', neden: '`WordCategory` `BaseEntity`\'den TÜREMİYOR — `IsDeleted`/`DeletedAt` gibi soft-delete alanları YOK, bu yüzden `ReplaceExamplesAsync`\'in (A-05, WordExample\'ları `IsDeleted=true` yapan) AKSİNE burada gerçek bir DELETE gerekiyor.', olmasaydi: 'Soft-delete DENENSEYDİ (`IsDeleted=true` atanmaya çalışılsaydı), `WordCategory` sınıfında böyle bir alan OLMADIĞI için kod DERLENMEZDİ.' },
          { satir: 'var newRows = categoryIds.Distinct().Select((categoryId, index) => new WordCategory', aciklama: 'İstemcinin gönderdiği ID listesinden (tekrarlar `Distinct()` ile ELENEREK) yeni bağ satırları kurar — `index` her satırın `DisplayOrder`\'ı olacak.', neden: '`Distinct()` — istemci yanlışlıkla AYNI kategoriyi iki kez gönderirse (`[2, 2, 3]`), `UQ_WordCategories` UNIQUE kısıtı ikinci satırda bir SQL HATASI fırlatırdı; `Distinct()` bunu DAHA istemcinin isteği İŞLENMEDEN, temiz bir şekilde ÖNLER.', olmasaydi: '`Distinct()` olmasaydı, tekrarlı bir categoryIds listesi `SaveChangesAsync`\'te HAM bir SQL UNIQUE constraint HATASI (500) fırlatırdı — istemciye anlamlı bir hata mesajı YERİNE ham bir veritabanı hatası SIZARDI.' },
          { satir: 'WordConceptId = wordConceptId,', aciklama: 'Yeni bağın hangi kelimeye ait olduğu.', neden: 'Metot parametresinden GELEN değer — TÜM yeni satırlar AYNI kelimeye bağlanıyor (metodun amacı zaten "bir kelimenin kategorilerini değiştir").', olmasaydi: 'Bu alan atanmasaydı, `WordConceptId` varsayılan değeri (0) ile KAYDEDİLİRDİ — hiçbir gerçek kelimeye BAĞLANMAYAN, anlamsız bir satır oluşurdu.' },
          { satir: 'CategoryId = categoryId,', aciklama: 'İstemcinin gönderdiği listedeki HER bir kategori ID\'si.', neden: '`Select` lambda\'sının `categoryId` parametresinden gelir — dışarıdaki (metot parametresi) `categoryIds` listesinin HER elemanı için AYRI bir satır üretilir.', olmasaydi: 'Bu alan atanmasaydı, hangi kategoriye bağlandığı BELİRSİZ, varsayılan (0) bir ID\'yle KAYDEDİLİRDİ — muhtemelen var olmayan bir kategori, FK kısıtı hatasına yol AÇARDI.' },
          { satir: 'DisplayOrder = index,', aciklama: 'İstemcinin gönderdiği SIRAYA göre 0\'dan başlayan bir sıralama değeri.', neden: 'İstemcinin `categoryIds` dizisindeki SIRA anlamlı olabilir (ör. "birincil kategori önce") — bu sıra `DisplayOrder`\'a AYNEN YANSITILIYOR, kayıp EDİLMİYOR.', olmasaydi: '`DisplayOrder` hep `0` bırakılsaydı, admin panelin bir kelimenin kategorilerini SIRALI göstermesi (ör. "birincil kategori" vurgusu) MÜMKÜN olmazdı.' },
          { satir: 'CreatedAt = DateTime.UtcNow', aciklama: 'Oluşturulma zamanı ELLE set edilir.', neden: '`WordCategory` `BaseEntity`\'den TÜREMEDİĞİ için `ZauselDbContext.SaveChangesAsync`\'in OTOMATİK zaman damgalama mekanizması (yalnızca `BaseEntity` türevlerini yakalayan `ChangeTracker.Entries<BaseEntity>()`) BU satırı YAKALAMAZ — DB\'deki `HasDefaultValueSql("GETUTCDATE()")` bir GÜVENLİK AĞI, ama kod açıkça DEĞERİ kendisi veriyor.', olmasaydi: 'Bu satır atlanıp yalnızca DB\'nin `GETUTCDATE()` varsayılanına güvenilseydi, EF Core `CreatedAt`\'in CLR varsayılanı (0001-01-01) olduğunu görüp o değeri EXPLICIT olarak GÖNDEREBİLİRDİ (DB varsayılanını GEÇERSİZ kılarak) — davranış EF Core sürümüne/konfigürasyona bağlı BELİRSİZLEŞİRDİ, elle atamak bu belirsizliği ORTADAN KALDIRIYOR.' },
          { satir: 'await _context.WordCategories.AddRangeAsync(newRows, cancellationToken);', aciklama: 'Yeni satırların TAMAMINI TEK seferde change tracker\'a ekler.', neden: '`AddRangeAsync` TEK bir toplu ekleme — kategori başına AYRI bir `AddAsync` çağrısı YERİNE, tüm yeni bağlar TEK bir işlemde İZLENMEYE alınır.', olmasaydi: 'Döngüyle TEK TEK `AddAsync` çağrılsaydı, sonuç AYNI olurdu ama kod GEREKSİZ yere UZARDI — `AddRangeAsync` zaten bir liste ALACAK şekilde tasarlanmış.' },
          { satir: 'private async Task<Dictionary<int, List<CategoryAggregate>>> BuildCategoriesAsync(', aciklama: 'YENİ private yardımcı metot — verilen WordConceptId listesi için TOPLU kategori verisi hazırlar.', neden: '`BuildTranslationsAsync`\'in (A-05) AYNI imzasal deseni: `List<int> id\'ler → Dictionary<int, List<...>>` — çağıran taraf (`GetAggregateAsync`/`GetPagedAsync`) bu sözlükten `GetValueOrDefault` ile KENDİ concept\'inin verisini ÇEKER.', olmasaydi: 'Ayrı bir yardımcı metot OLMASAYDI, `GetAggregateAsync` ve `GetPagedAsync` AYNI (kategori toplama) mantığını İKİ YERDE TEKRARLARDI — DRY ilkesinin ihlali, bir hata düzeltmesi İKİ yerde YAPILMASI gerekirdi.' },
          { satir: 'List<int> wordConceptIds, CancellationToken cancellationToken)', aciklama: 'Metodun ikinci parametre satırı — çoklu ID desteği (tek bir kelime için de `[id]` şeklinde çağrılabilir).', neden: '`BuildTranslationsAsync` İLE AYNI imza şekli — kod tabanında TUTARLI bir "toplu veri hazırlama yardımcı metodu" kalıbı.', olmasaydi: 'Farklı bir imza (ör. tek bir `int`) kullanılsaydı, sayfa listesi (birden fazla concept) için AYRI bir metot daha YAZILMASI gerekirdi.' },
          { satir: 'var links = await _context.WordCategories.Where(wc => wordConceptIds.Contains(wc.WordConceptId)).ToListAsync(cancellationToken);', aciklama: 'Verilen kelimelere ait TÜM kategori bağ satırlarını TEK sorguda çeker.', neden: 'İlk adım — önce "hangi kelime hangi kategoriye bağlı" bilgisi (yalnızca ID\'ler, henüz kategori DETAYI değil) alınır.', olmasaydi: 'Bu sorgu OLMASAYDI, hangi kelimenin hangi kategorilere bağlı olduğu BİLİNEMEZDİ — metodun GERİ KALANI çalışamazdı.' },
          { satir: 'var categoryIds = links.Select(l => l.CategoryId).Distinct().ToList();', aciklama: 'Bağ satırlarından BENZERSİZ kategori ID\'lerini çıkarır — birden fazla kelime AYNI kategoriye bağlı olabileceği için tekrarlar `Distinct()` ile ELENİR.', neden: 'Aşağıdaki `Categories`/`CategoryTranslations` sorgularının GEREKSİZ yere tekrar eden ID\'lerle ÇALIŞMAMASI için — 20 kelime AYNI 3 kategoriye bağlıysa, kategori detayları yalnızca 3 KEZ (20 değil) sorgulanmalı.', olmasaydi: '`Distinct()` olmasaydı sonuç YİNE DOĞRU olurdu (SQL `IN` tekrarlı değerleri KENDİLİĞİNDEN sadeleştirir) ama sorgu metni GEREKSİZ yere UZARDI.' },
          { satir: 'var categories = await _context.Categories.Where(c => categoryIds.Contains(c.Id)).ToDictionaryAsync(c => c.Id, cancellationToken);', aciklama: 'İlgili kategorilerin KENDİLERİNİ (Icon/Color/MinLevel gibi) TEK sorguda, ID\'ye göre erişilebilir bir sözlük olarak çeker.', neden: '`CategoryMapping`/`WordMapping`\'in bu kategorileri isme/renge göre SUNABİLMESİ için Category satırının KENDİSİNE (yalnızca ID\'sine değil) ihtiyaç var.', olmasaydi: 'Yalnızca ID\'ler bilinseydi, `CategoryAggregate` kurulurken hangi rengin/ikonun kullanılacağı BİLİNEMEZDİ.' },
          { satir: 'var translations = await _context.CategoryTranslations.Where(t => categoryIds.Contains(t.CategoryId)).ToListAsync(cancellationToken);', aciklama: 'İlgili kategorilerin TÜM dillerdeki adlarını (de+tr) TEK sorguda çeker.', neden: '`WordCategoryTranslationResponse`\'un (Bölüm 7\'nin YENİ DTO\'su) hem `languageCode` hem `name` alanları için çeviri satırlarına ihtiyaç var.', olmasaydi: 'Çeviriler ÇEKİLMESEYDİ, kelime yanıtındaki `categories[].translations[]` alanı HER ZAMAN boş DÖNERDİ — kullanıcı hangi kategoriye ait olduğunu isim OLARAK GÖREMEZDİ, yalnızca ID görürdü.' },
          { satir: 'var languages = await _context.Languages.ToDictionaryAsync(l => l.Id, cancellationToken: cancellationToken);', aciklama: 'TÜM dilleri (yalnızca 2 tane, de+tr) bir sözlüğe alır — `BuildTranslationsAsync`\'teki İLE BİREBİR AYNI satır.', neden: 'Diller sabit ve az sayıda (2) olduğu için filtre YOK, TÜMÜ çekiliyor — `BuildTranslationsAsync`\'in AYNI ihtiyacı (LanguageId\'den Code\'a çevirmek) burada da TEKRARLANIYOR, ayrı bir metoda ÇIKARILMADI çünkü tek satırlık bir sorgu.', olmasaydi: 'Dil bilgisi ÇEKİLMESEYDİ, `CategoryTranslationAggregate`\'in `Language` alanı DOLDURULAMAZDI — yanıtta `languageCode` HİÇ görünmezdi.' },
          { satir: 'var translationsByCategory = translations', aciklama: 'Çeviri listesini kategori ID\'sine göre gruplamanın başlangıcı.', neden: 'Aşağıdaki `CategoryAggregate` kurulumunda HER kategori kendi çevirilerini ARAYACAK — önce bu arama HIZLI olsun diye bir sözlük KURULUYOR.', olmasaydi: 'Gruplama OLMASAYDI, her kategori için `translations.Where(t => t.CategoryId == c.Id)` şeklinde AYRI bir LINQ taraması gerekirdi — O(n×m) karmaşıklık, gruplamayla O(n) düşer.' },
          { satir: '.GroupBy(t => t.CategoryId)', aciklama: 'Çeviri listesini `CategoryId`\'ye göre gruplar.', neden: 'Bir kategorinin BİRDEN FAZLA çevirisi (de+tr) olduğu için gruplama gerekli — `CategoryTranslationConfiguration`\'daki (Bölüm 1) UNIQUE(CategoryId,LanguageId) kısıtı bu gruplamanın HER grupta EN FAZLA 2 eleman (de+tr) olacağını GARANTİLER.', olmasaydi: 'Gruplama OLMASAYDI, bir sonraki adımda "bu kategorinin çevirileri" sorusu YANITLANAMAZDI.' },
          { satir: '.ToDictionary(g => g.Key, g => g.Select(t => new CategoryTranslationAggregate(t, languages[t.LanguageId])).ToList());', aciklama: 'Her grubu (kategori ID\'si → o kategorinin `CategoryTranslationAggregate` listesi) bir sözlüğe çevirir.', neden: '`languages[t.LanguageId]` — yukarıda hazırlanan dil sözlüğünden, bu çevirinin HANGİ dile ait olduğu (Code, NativeName) BULUNUR; `CategoryTranslationAggregate` (Bölüm 2) tam olarak "çeviri satırı + hangi dile ait olduğu" çiftini TAŞIYOR.', olmasaydi: 'Bu satır olmasaydı, çeviri satırları HAM (`CategoryTranslation` entity\'si, dil bilgisi olmadan) kalır, `WordCategoryTranslationResponse`\'un `languageCode` alanı DOLDURULAMAZDI.' },
          { satir: 'return links', aciklama: 'Son adım — bağ satırlarını (WordConceptId → CategoryId eşlemesi) sonuca DÖNÜŞTÜRMENİN başlangıcı.', neden: 'Buraya kadar HAZIRLANAN `categories`/`translationsByCategory` sözlükleri, şimdi ASIL istenen çıktı şekline (`Dictionary<int, List<CategoryAggregate>>`, yani WordConceptId → CategoryAggregate listesi) DÖNÜŞTÜRÜLECEK.', olmasaydi: 'Bu son dönüşüm OLMASAYDI, metot yanlış şekilde bir veri döndürürdü (imza uyuşmazlığından DERLENMEZDİ).' },
          { satir: '.GroupBy(l => l.WordConceptId)', aciklama: 'Bağ satırlarını bu kez `WordConceptId`\'ye göre gruplar — "bu kelimenin TÜM kategori bağları".', neden: 'Bir kelime BİRDEN FAZLA kategoriye ait olabilir (M:N) — çağıran taraf (`GetAggregateAsync`) "bu kelimenin kategorileri" sorusunu SORACAK, cevap bir LİSTE olmalı.', olmasaydi: 'Gruplama OLMASAYDI, HER bağ satırı için AYRI bir sözlük girdisi oluşurdu — bir kelimenin İKİNCİ kategorisi BİRİNCİSİNİN üzerine YAZARDI, veri KAYBOLURDU.' },

          { satir: 'g => g.Key,', aciklama: 'Sözlüğün anahtarı — grubun `WordConceptId`\'si.', neden: 'Çağıran tarafın (`GetAggregateAsync`/`GetPagedAsync`) `GetValueOrDefault(wordConceptId, [])` ile ARAYACAĞI anahtar TAM OLARAK bu.', olmasaydi: 'Yanlış bir anahtar seçilseydi (ör. `g.First().Id` gibi bağ satırının KENDİ ID\'si), çağıran taraf HİÇBİR ZAMAN doğru eşleşme BULAMAZDI.' },

          { satir: '.ToList());', aciklama: 'Her kelimenin kategori listesini somutlaştırır.', neden: 'Çağıran taraf `List<CategoryAggregate>` bekliyor (aggregate\'in `Categories` alanının tipi) — `IEnumerable` DEĞİL.', olmasaydi: '`.ToList()` olmasaydı tip uyuşmazlığından DERLENMEZDİ.' }
