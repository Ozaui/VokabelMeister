using Microsoft.EntityFrameworkCore.Metadata.Builders;
using Zausel.Application.Common;
using Zausel.Domain.Entities.Srs;
using Zausel.Domain.Enums.Srs;

namespace Zausel.Infrastructure.Data.Configurations.Srs;

public class AchievementConfiguration : IEntityTypeConfiguration<Achievement>
{
    // HasData migration-zamanında sabitlenir — DateTime.UtcNow burada KULLANILMAZ, her migration
    // scaffold'unda farklı bir değer üretip sahte bir diff yaratırdı (CategoryConfiguration ile AYNI gerekçe).
    private static readonly DateTime SeedTimestamp = new(2026, 8, 22, 0, 0, 0, DateTimeKind.Utc);

    public void Configure(EntityTypeBuilder<Achievement> builder)
    {
        builder.ToTable("Achievements", tb =>
        {
            tb.HasCheckConstraint("CK_Achievements_Rarity", "Rarity IN ('Common','Rare','Epic','Legendary')");
        });

        builder.HasKey(x => x.Id);

        builder.Property(x => x.Icon).HasMaxLength(255);
        builder.Property(x => x.RewardXP).HasDefaultValue(0);
        builder.Property(x => x.Rarity).HasConversion<string>().HasMaxLength(20).IsRequired().HasDefaultValue(AchievementRarity.Common);
        builder.Property(x => x.CreatedAt).HasDefaultValueSql("GETUTCDATE()");

        // Seed — Id'ler AchievementIds sabitleriyle (AchievementService/AchievementMessages) birebir
        // eşleşir (Languages'teki Id=1/Id=2 seed deseniyle AYNI). Name/Description sütunu YOK — rozetin
        // görünen adı/açıklaması CLAUDE.md §1 "istemciye giden mesaj" istisnasına göre AchievementMessages
        // sözlüğünden Accept-Language'a göre çözülür (ErrorMessages/SuccessMessages ile AYNI desen), yeni
        // bir dil migration gerektirmeden yalnızca o sözlüğe eklenir. Icon şimdilik null — rozet görseli
        // ayrı bir task (medya yükleme akışı yalnızca Admin'e açık, A-07).
        builder.HasData(
            new Achievement { Id = AchievementIds.Streak3, RewardXP = 10, Rarity = AchievementRarity.Common, CreatedAt = SeedTimestamp },
            new Achievement { Id = AchievementIds.Streak7, RewardXP = 25, Rarity = AchievementRarity.Rare, CreatedAt = SeedTimestamp },

namespace Zausel.Application.Services;

// EvaluateAndUnlockAsync durum-tabanlı (event-tabanlı DEĞİL) çalışır: her çağrıda TÜM eşikleri
// kullanıcının GÜNCEL UserProgress/UserCardProgress/User durumundan yeniden hesaplar — bu yüzden
// A-10 (learn-system-word) ve A-11 (review-answer/oturum tamamlama) yazıldığında, o Handler'lar da
// kendi mutasyonlarından SONRA AYNI metodu çağırarak rozet kilidini açabilir; ayrı bir event/queue
// sistemi gerekmez. Şu an TEK çağıran ApplyWordLeechActionCommandHandler (Reset akışı).
public class AchievementService : IAchievementService
{
    private readonly IUserRepository _userRepository;
    private readonly IUserProgressRepository _userProgressRepository;
    private readonly IUserCardProgressRepository _userCardProgressRepository;
    private readonly IUserAchievementRepository _userAchievementRepository;

    public AchievementService(
        IUserRepository userRepository,
        IUserProgressRepository userProgressRepository,
        IUserCardProgressRepository userCardProgressRepository,
        IUserAchievementRepository userAchievementRepository)
    {
        _userRepository = userRepository;
        _userProgressRepository = userProgressRepository;
        _userCardProgressRepository = userCardProgressRepository;
        _userAchievementRepository = userAchievementRepository;
    }

    public async Task EvaluateAndUnlockAsync(int userId, bool leechRecovered = false, CancellationToken cancellationToken = default)
    {
        var wordSnapshots = await _userProgressRepository.GetSnapshotsAsync(userId, cancellationToken);
        var cardSnapshots = await _userCardProgressRepository.GetSnapshotsAsync(userId, cancellationToken);
        var snapshots = wordSnapshots.Concat(cardSnapshots).ToList();

        var wordCount = snapshots.Count;
        var goodBandCount = snapshots.Count(s => s.Mastery >= 70);
        var hasFirstMastery = snapshots.Any(s => s.CurrentLevel >= 5);

        var user = await _userRepository.GetByIdAsync(userId, cancellationToken);
        var streakDays = user?.StreakDays ?? 0;

        var qualifiedAchievementIds = new List<int>();

        if (streakDays >= 3) qualifiedAchievementIds.Add(AchievementIds.Streak3);
        if (streakDays >= 7) qualifiedAchievementIds.Add(AchievementIds.Streak7);
        if (streakDays >= 30) qualifiedAchievementIds.Add(AchievementIds.Streak30);

        if (wordCount >= 50) qualifiedAchievementIds.Add(AchievementIds.WordCount50);
        if (wordCount >= 200) qualifiedAchievementIds.Add(AchievementIds.WordCount200);
        if (wordCount >= 500) qualifiedAchievementIds.Add(AchievementIds.WordCount500);

        if (hasFirstMastery) qualifiedAchievementIds.Add(AchievementIds.FirstMastery);
        if (goodBandCount >= 100) qualifiedAchievementIds.Add(AchievementIds.GoodBand100);

        if (leechRecovered) qualifiedAchievementIds.Add(AchievementIds.LeechRecovery);

        // FlawlessSession burada YOK — hatasız oturum bir "oturum tamamlandı" OLAYINA bağlı, LearningSession
        // (A-11) henüz yazılmadığı için tespit edilecek bir veri yok; A-11'in oturum-tamamlama Handler'ı
        // yazılınca bu metoda bir "sessionWasFlawless" parametresi eklenip aynı desenle işlenecek.

        var unlockedAny = false;
        foreach (var achievementId in qualifiedAchievementIds)
        {
            if (await _userAchievementRepository.HasUnlockedAsync(userId, achievementId, cancellationToken))
                continue;

            await _userAchievementRepository.AddAsync(userId, achievementId, cancellationToken);
            unlockedAny = true;
        }

        // Rozet açılışı ActivityLogger'a YAZILMAZ — UserAchievement satırının kendisi (UnlockedAt ile)
        // zaten insert-only bir log, LearningHistory'yle AYNI gerekçe.
        if (unlockedAny)
            await _userAchievementRepository.SaveChangesAsync(cancellationToken);
    }
}`,

        kod: `using MediatR;
using Zausel.Application.DTOs.Progress;
using Zausel.Application.Interfaces.Repositories.Srs;
using Zausel.Application.Interfaces.Services;
using Zausel.Application.Services;
using Zausel.Domain.Exceptions;

namespace Zausel.Application.Features.Progress;

public record ApplyWordLeechActionCommand(int WordId, string Action, int UserId, string? ActorRole) : IRequest<LeechActionResponse>;

public class ApplyWordLeechActionCommandHandler : IRequestHandler<ApplyWordLeechActionCommand, LeechActionResponse>
{
    private readonly IUserProgressRepository _userProgressRepository;
    private readonly IActivityLogger _activityLogger;
    private readonly IAchievementService _achievementService;

    public ApplyWordLeechActionCommandHandler(
        IUserProgressRepository userProgressRepository, IActivityLogger activityLogger, IAchievementService achievementService)
    {
        _userProgressRepository = userProgressRepository;
        _activityLogger = activityLogger;
        _achievementService = achievementService;
    }

    public async Task<LeechActionResponse> Handle(ApplyWordLeechActionCommand request, CancellationToken cancellationToken)
    {
        var userProgress = await _userProgressRepository.GetByUserAndWordAsync(request.UserId, request.WordId, cancellationToken)
            ?? throw new EntityNotFoundException($"UserProgress not found: WordId={request.WordId}");

        // Continue hiçbir alanı DEĞİŞTİRMEZ — kullanıcı "biliyorum, YİNE DE bu şekilde devam et" der,
        // veritabanına yazılacak bir şey yok, yalnızca istemciye bir onay dönülür.
        if (request.Action == "Continue")
            return new LeechActionResponse(IsSuspended: null, CurrentLevel: null, NextReviewAt: null, Acknowledged: true);

        var oldValue = new { userProgress.IsSuspended, userProgress.CurrentLevel, userProgress.NextReviewAt };

        LeechActionResponse response;
        if (request.Action == "Suspend")
        {
            userProgress.IsSuspended = true;
            response = new LeechActionResponse(IsSuspended: true, CurrentLevel: null, NextReviewAt: null, Acknowledged: null);
        }
        else
        {
            // Reset — SM-2 durumu SIFIRLANIR (yeni bir kelimeymiş gibi baştan başlar), TimesCorrect/
            // TimesIncorrect/SuccessRate gibi geçmiş istatistikler KORUNUR (yalnızca ileri gidiş sıfırlanır).
            userProgress.CurrentLevel = 0;
            userProgress.Mastery = SrsCalculator.CalculateMastery(0, userProgress.SuccessRate);
            userProgress.EasinessFactor = 2.5m;
            userProgress.IntervalDays = 1;
            userProgress.RepetitionNumber = 0;
            userProgress.ConsecutiveIncorrect = 0;
            userProgress.IsSuspended = false;
            userProgress.NextReviewAt = null;
            response = new LeechActionResponse(IsSuspended: null, CurrentLevel: 0, NextReviewAt: null, Acknowledged: null);
        }

        await _userProgressRepository.UpdateAsync(userProgress, request.UserId, cancellationToken);
        await _userProgressRepository.SaveChangesAsync(cancellationToken);

        var newValue = new { userProgress.IsSuspended, userProgress.CurrentLevel, userProgress.NextReviewAt };
        await _activityLogger.LogAsync(
            request.UserId, request.ActorRole, "APPLY_LEECH_ACTION", entityType: "UserProgress", entityId: userProgress.Id,
            oldValue: oldValue, newValue: newValue, cancellationToken: cancellationToken);

        // "Leech Kurtarma" rozeti yalnızca Reset'te değerlendirilir — Suspend bir kelimeyi leech
        // durumuna SOKAR, kurtarmaz; gereksiz sorgu yapmamak için Suspend'te AchievementService HİÇ çağrılmaz.
        if (request.Action == "Reset")
            await _achievementService.EvaluateAndUnlockAsync(request.UserId, leechRecovered: true, cancellationToken);

        return response;
    }
}`,

public record GetMyAchievementsQuery(int UserId, string? AcceptLanguage) : IRequest<List<AchievementResponse>>;

public class GetMyAchievementsQueryHandler : IRequestHandler<GetMyAchievementsQuery, List<AchievementResponse>>
{
    private readonly IUserAchievementRepository _userAchievementRepository;

    public GetMyAchievementsQueryHandler(IUserAchievementRepository userAchievementRepository) =>
        _userAchievementRepository = userAchievementRepository;

    public async Task<List<AchievementResponse>> Handle(GetMyAchievementsQuery request, CancellationToken cancellationToken)
    {
        var items = await _userAchievementRepository.GetUnlockedForUserAsync(request.UserId, cancellationToken);

        return items.Select(item =>
        {
            var (name, description) = AchievementMessages.Resolve(item.AchievementId, request.AcceptLanguage);
            return new AchievementResponse(item.AchievementId, name, description, item.Icon, item.RewardXP, item.Rarity, item.UnlockedAt);
        }).ToList();
    }
}`,

    private void SetupEmptyProgress(int userId = 1)

    [Fact]
    public async Task Handle_StreakDays3_UnlocksOnlyStreak3()
    {

        SetupEmptyProgress();

        // ASSERT

        _userAchievementRepository.Verify(r => r.AddAsync(1, AchievementIds.Streak7, It.IsAny<CancellationToken>()), Times.Never);

namespace Zausel.Tests.Features.Progress;

public class ApplyWordLeechActionCommandHandlerTests
{
    private readonly Mock<IUserProgressRepository> _userProgressRepository = new();
    private readonly Mock<IActivityLogger> _activityLogger = new();
    private readonly Mock<IAchievementService> _achievementService = new();

    private ApplyWordLeechActionCommandHandler CreateHandler() =>
        new(_userProgressRepository.Object, _activityLogger.Object, _achievementService.Object);

    [Fact]
    public async Task Handle_NotFound_ThrowsEntityNotFoundException()
    {
        // ARRANGE
        _userProgressRepository.Setup(r => r.GetByUserAndWordAsync(1, 99, It.IsAny<CancellationToken>())).ReturnsAsync((UserProgress?)null);
        var command = new ApplyWordLeechActionCommand(99, "Suspend", UserId: 1, ActorRole: "User");
        var handler = CreateHandler();

        // ACT
        var act = () => handler.Handle(command, default);

        // ASSERT
        await act.Should().ThrowAsync<EntityNotFoundException>();
        _userProgressRepository.Verify(r => r.UpdateAsync(It.IsAny<UserProgress>(), It.IsAny<int>(), It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task Handle_SuspendAction_SetsIsSuspendedAndLogsActivity()
    {
        // ARRANGE
        var existing = new UserProgress { Id = 1, UserId = 5, WordId = 5, IsSuspended = false, ConsecutiveIncorrect = 5 };
        _userProgressRepository.Setup(r => r.GetByUserAndWordAsync(5, 5, It.IsAny<CancellationToken>())).ReturnsAsync(existing);
        var command = new ApplyWordLeechActionCommand(5, "Suspend", UserId: 5, ActorRole: "User");
        var handler = CreateHandler();

        // ACT
        var result = await handler.Handle(command, default);

        // ASSERT — yalnızca IsSuspended döner, diğer alanlar ETKİLENMEZ (ConsecutiveIncorrect KORUNUR)
        result.IsSuspended.Should().BeTrue();
        result.CurrentLevel.Should().BeNull();
        result.Acknowledged.Should().BeNull();
        existing.IsSuspended.Should().BeTrue();
        existing.ConsecutiveIncorrect.Should().Be(5);
        _userProgressRepository.Verify(r => r.UpdateAsync(existing, 5, It.IsAny<CancellationToken>()), Times.Once);
        _userProgressRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Once);
        _activityLogger.Verify(l => l.LogAsync(
            5, "User", "APPLY_LEECH_ACTION", "UserProgress", 1, It.IsAny<object>(), It.IsAny<object>(), null, null, It.IsAny<CancellationToken>()),
            Times.Once);
        // Suspend bir kelimeyi leech durumuna SOKAR, kurtarmaz — AchievementService HİÇ çağrılmamalı.
        _achievementService.Verify(
            s => s.EvaluateAndUnlockAsync(It.IsAny<int>(), It.IsAny<bool>(), It.IsAny<CancellationToken>()), Times.Never);
    }

    [Fact]
    public async Task Handle_ResetAction_ResetsSm2StateAndPreservesHistoricalStats()
    {
        // ARRANGE — geçmiş istatistikler (TimesCorrect/TimesIncorrect/SuccessRate) KORUNMALI, yalnızca SM-2 durumu sıfırlanmalı
        var existing = new UserProgress
        {
            Id = 1, UserId = 5, WordId = 5, CurrentLevel = 4, EasinessFactor = 1.9m, IntervalDays = 15,
            RepetitionNumber = 6, ConsecutiveIncorrect = 5, IsSuspended = true, NextReviewAt = DateTime.UtcNow,
            TimesCorrect = 12, TimesIncorrect = 6, SuccessRate = 66.67m
        };
        _userProgressRepository.Setup(r => r.GetByUserAndWordAsync(5, 5, It.IsAny<CancellationToken>())).ReturnsAsync(existing);
        var command = new ApplyWordLeechActionCommand(5, "Reset", UserId: 5, ActorRole: "User");
        var handler = CreateHandler();

        // ACT
        var result = await handler.Handle(command, default);

        // ASSERT
        result.CurrentLevel.Should().Be(0);
        result.NextReviewAt.Should().BeNull();
        existing.CurrentLevel.Should().Be(0);
        existing.EasinessFactor.Should().Be(2.5m);
        existing.IntervalDays.Should().Be(1);
        existing.RepetitionNumber.Should().Be(0);
        existing.ConsecutiveIncorrect.Should().Be(0);
        existing.IsSuspended.Should().BeFalse();
        existing.NextReviewAt.Should().BeNull();
        // Mastery, SrsCalculator.CalculateMastery(0, 66.67) ile YENİDEN hesaplanır — SuccessRate'in kendisi DEĞİŞMEZ
        existing.Mastery.Should().Be(SrsCalculator.CalculateMastery(0, 66.67m));
        existing.TimesCorrect.Should().Be(12);
        existing.TimesIncorrect.Should().Be(6);
        existing.SuccessRate.Should().Be(66.67m);
        // Reset = leech kurtarma OLAYI — AchievementService leechRecovered:true ile TAM BİR KEZ çağrılmalı.
        _achievementService.Verify(s => s.EvaluateAndUnlockAsync(5, true, It.IsAny<CancellationToken>()), Times.Once);
    }

    [Fact]
    public async Task Handle_ContinueAction_DoesNotMutateOrPersistAnything()
    {
        // ARRANGE
        var existing = new UserProgress { Id = 1, UserId = 5, WordId = 5, ConsecutiveIncorrect = 7, IsSuspended = false };
        _userProgressRepository.Setup(r => r.GetByUserAndWordAsync(5, 5, It.IsAny<CancellationToken>())).ReturnsAsync(existing);
        var command = new ApplyWordLeechActionCommand(5, "Continue", UserId: 5, ActorRole: "User");
        var handler = CreateHandler();

        // ACT
        var result = await handler.Handle(command, default);

        // ASSERT — yalnızca onay döner, HİÇBİR alan değişmez, veritabanına YAZILMAZ
        result.Acknowledged.Should().BeTrue();
        result.IsSuspended.Should().BeNull();
        existing.ConsecutiveIncorrect.Should().Be(7);
        _userProgressRepository.Verify(r => r.UpdateAsync(It.IsAny<UserProgress>(), It.IsAny<int>(), It.IsAny<CancellationToken>()), Times.Never);
        _userProgressRepository.Verify(r => r.SaveChangesAsync(It.IsAny<CancellationToken>()), Times.Never);
        _activityLogger.Verify(l => l.LogAsync(
            It.IsAny<int?>(), It.IsAny<string?>(), It.IsAny<string>(), It.IsAny<string?>(), It.IsAny<int?>(),
            It.IsAny<object?>(), It.IsAny<object?>(), It.IsAny<string?>(), It.IsAny<string?>(), It.IsAny<CancellationToken>()),
            Times.Never);
        _achievementService.Verify(
            s => s.EvaluateAndUnlockAsync(It.IsAny<int>(), It.IsAny<bool>(), It.IsAny<CancellationToken>()), Times.Never);
    }
}`,
