    public async Task Handle_ValidRequest_CreatesUserCategoryAndReturnsResponse()

        var command = new CreateUserCategoryCommand("Hayvanlar", "Ev hayvanları", "#FF6B00", "paw", UserId: 1, ActorRole: "User");

    }
