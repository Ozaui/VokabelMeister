using Zausel.Application.Common.Exceptions;
using Zausel.Application.DTOs.Words;
using Zausel.Application.Interfaces.Repositories.Content;
using Zausel.Domain.Entities.Content;
using Zausel.Domain.Enums.Content;

namespace Zausel.Application.Features.Words;

// Force — Controller'da ?force=true query string'inden okunur (API_ENDPOINTS.md §5), Request
// DTO'sunun bir alanı DEĞİL, HTTP-bağlamından gelen bir değer (A-03'teki UserId/Language deseniyle AYNI).
public record CreateWordCommand(
    string PartOfSpeech,
    string DifficultyLevel,
    string? ImageUrl,
    List<WordTranslationRequest> Translations,
    bool Force,
    int? UserId) : IRequest<WordResponse>;

public class CreateWordCommandHandler : IRequestHandler<CreateWordCommand, WordResponse>
{
    private readonly IWordConceptRepository _wordConceptRepository;
    private readonly ILanguageRepository _languageRepository;

    public CreateWordCommandHandler(IWordConceptRepository wordConceptRepository, ILanguageRepository languageRepository)
    {
        _wordConceptRepository = wordConceptRepository;
        _languageRepository = languageRepository;
    }

    public async Task<WordResponse> Handle(CreateWordCommand request, CancellationToken cancellationToken)
    {
        var languagesByCode = await ResolveLanguagesAsync(request.Translations, cancellationToken);

        if (!request.Force)
        {
            foreach (var translation in request.Translations)
            {
                var language = languagesByCode[translation.LanguageCode];
                var duplicate = await _wordConceptRepository.FindWordByLanguageAndTextAsync(
                    language.Id, translation.Text, excludeWordId: null, cancellationToken);
                if (duplicate is not null)
                    throw new WordDuplicateException(translation.LanguageCode, translation.Text);
            }
        }

        var concept = new WordConcept
        {
            PartOfSpeech = Enum.Parse<PartOfSpeech>(request.PartOfSpeech),
            DifficultyLevel = request.DifficultyLevel,
            ImageUrl = request.ImageUrl
        };
        await _wordConceptRepository.AddConceptAsync(concept, request.UserId, cancellationToken);
        await _wordConceptRepository.SaveChangesAsync(cancellationToken);

        foreach (var translation in request.Translations)
        {
            var language = languagesByCode[translation.LanguageCode];
            var word = new Word
            {
                WordConceptId = concept.Id,
                LanguageId = language.Id,
                Text = translation.Text,
                Definition = translation.Definition
            };
            await _wordConceptRepository.AddWordAsync(word, request.UserId, cancellationToken);
            await _wordConceptRepository.SaveChangesAsync(cancellationToken);

            await AddDetailAndExamplesAsync(word.Id, translation, request.UserId, cancellationToken);
        }

        await _wordConceptRepository.SaveChangesAsync(cancellationToken);

        var aggregate = await _wordConceptRepository.GetAggregateAsync(concept.Id, cancellationToken)
            ?? throw new EntityNotFoundException($"WordConcept not found after creation: Id={concept.Id}");
        return WordMapping.ToResponse(aggregate);
    }

    private async Task<Dictionary<string, Language>> ResolveLanguagesAsync(
        List<WordTranslationRequest> translations, CancellationToken cancellationToken)
    {
        var result = new Dictionary<string, Language>();
        foreach (var translation in translations)
        {
            result[translation.LanguageCode] = await _languageRepository.GetByCodeAsync(translation.LanguageCode, cancellationToken)
                ?? throw new EntityNotFoundException($"Language not found: Code={translation.LanguageCode}");
        }

        return result;
    }

    private async Task AddDetailAndExamplesAsync(int wordId, WordTranslationRequest translation, int? userId, CancellationToken cancellationToken)
    {
        if (translation.WordDetail is not null)
        {
            var detail = new WordDetail
            {
                WordId = wordId,
                Pronunciation = translation.WordDetail.Pronunciation,
                Notes = translation.WordDetail.Notes,
                CommonMistakes = translation.WordDetail.CommonMistakes,
                GrammarData = translation.WordDetail.GrammarData?.GetRawText()
            };
            await _wordConceptRepository.AddDetailAsync(detail, userId, cancellationToken);
        }

        if (translation.Examples is not null)
        {
            var newExamples = translation.Examples.Select(example => new WordExample
            {
                WordId = wordId,
                SentenceText = example.SentenceText,
                Level = example.Level,
                ExampleType = Enum.Parse<ExampleType>(example.ExampleType ?? nameof(ExampleType.Normal))
            }).ToList();

            // Yeni bir Word'de silinecek eski örnek yok — ReplaceExamplesAsync boş bir "existing"
            // bulup yalnızca ekleme yapar, Create/Update AYNI metodu paylaşır.
            await _wordConceptRepository.ReplaceExamplesAsync(wordId, newExamples, userId, cancellationToken);
        }
    }
}`,

        kod: `using FluentValidation;
using Zausel.Application.DTOs.Words;
using Zausel.Application.Features.Words;
using Zausel.Domain.Enums.Content;

namespace Zausel.Application.Validators.Words;

public class CreateWordCommandValidator : AbstractValidator<CreateWordCommand>
{
    private static readonly string[] ValidLevels = ["A1", "A2", "B1", "B2", "C1", "C2"];
    private static readonly string[] SupportedLanguageCodes = ["de", "tr"];
    private static readonly string[] ValidExampleTypes = ["Normal", "Idiom", "Formal", "Colloquial"];

    public CreateWordCommandValidator()
    {
        RuleFor(x => x.PartOfSpeech).Must(p => Enum.TryParse<PartOfSpeech>(p, out _)).WithErrorCode("PART_OF_SPEECH_INVALID");
        RuleFor(x => x.DifficultyLevel).Must(ValidLevels.Contains).WithErrorCode("DIFFICULTY_LEVEL_INVALID");

        RuleFor(x => x.Translations).NotEmpty().WithErrorCode("TRANSLATIONS_REQUIRED");
        RuleFor(x => x.Translations).Must(t => t.Count <= 2).WithErrorCode("TRANSLATIONS_COUNT_INVALID");
        RuleFor(x => x.Translations)
            .Must(t => t.Select(x => x.LanguageCode).Distinct().Count() == t.Count)
            .WithErrorCode("TRANSLATIONS_LANGUAGE_DUPLICATE");

        // Enum.Parse'ın (Handler'da) her zaman GEÇERLİ bir değer bulacağını garanti eden kurallar —
        // ExampleType/Level burada doğrulanmazsa Handler'daki Enum.Parse/DB CHECK constraint
        // yakalanmayan bir istisna fırlatır (400 yerine 500).
        RuleForEach(x => x.Translations).ChildRules(translation =>
        {
            translation.RuleFor(t => t.LanguageCode).Must(SupportedLanguageCodes.Contains).WithErrorCode("LANGUAGE_CODE_UNSUPPORTED");
            translation.RuleForEach(t => t.Examples).ChildRules(example =>
            {
                example.RuleFor(e => e.SentenceText).NotEmpty().WithErrorCode("EXAMPLE_SENTENCE_TEXT_REQUIRED");
                example.RuleFor(e => e.Level).Must(ValidLevels.Contains).WithErrorCode("EXAMPLE_LEVEL_INVALID");
                example.RuleFor(e => e.ExampleType).Must(v => v is null || ValidExampleTypes.Contains(v)).WithErrorCode("EXAMPLE_TYPE_INVALID");
            });
        });

        RuleFor(x => x).Custom(ValidateGrammar);
    }

    // WordGrammarValidator dile+PartOfSpeech'e göre bir defalık kurulur — burada geçersiz bir
    // PartOfSpeech veya desteklenmeyen bir dil varsa (yukarıdaki kurallar zaten bunu YAKALAYACAK)
    // gramer kontrolü hiç çalıştırılmaz, aynı eksiklik için ÇİFTE/çelişkili hata üretilmez.
    private static void ValidateGrammar(CreateWordCommand command, ValidationContext<CreateWordCommand> context)
    {
        if (!Enum.TryParse<PartOfSpeech>(command.PartOfSpeech, out var partOfSpeech))
            return;

        foreach (var translation in command.Translations)
        {
            if (!SupportedLanguageCodes.Contains(translation.LanguageCode))
                continue;

            var grammarValidator = new WordGrammarValidator(translation.LanguageCode, partOfSpeech);
            var input = new WordGrammarInput(translation.Text, translation.Definition, translation.WordDetail?.GrammarData);
            var result = grammarValidator.Validate(input);
            foreach (var failure in result.Errors)
                context.AddFailure(failure);
        }
    }
}`,

        kod: `using MediatR;
using Zausel.Application.Common.Exceptions;
using Zausel.Application.DTOs.Words;
using Zausel.Application.Interfaces.Repositories.Content;
using Zausel.Domain.Entities.Content;
using Zausel.Domain.Enums.Content;
using Zausel.Domain.Exceptions;

namespace Zausel.Application.Features.Words;

public record UpdateWordCommand(
    int WordConceptId,
    string PartOfSpeech,
    string DifficultyLevel,
    string? ImageUrl,
    List<WordTranslationRequest> Translations,
    bool Force,
    int? UserId) : IRequest<WordResponse>;

public class UpdateWordCommandHandler : IRequestHandler<UpdateWordCommand, WordResponse>
{
    private readonly IWordConceptRepository _wordConceptRepository;
    private readonly ILanguageRepository _languageRepository;

    public UpdateWordCommandHandler(IWordConceptRepository wordConceptRepository, ILanguageRepository languageRepository)
    {
        _wordConceptRepository = wordConceptRepository;
        _languageRepository = languageRepository;
    }

    public async Task<WordResponse> Handle(UpdateWordCommand request, CancellationToken cancellationToken)
    {
        var concept = (await _wordConceptRepository.GetAggregateAsync(request.WordConceptId, cancellationToken))?.Concept
            ?? throw new EntityNotFoundException($"WordConcept not found: Id={request.WordConceptId}");

        concept.PartOfSpeech = Enum.Parse<PartOfSpeech>(request.PartOfSpeech);
        concept.DifficultyLevel = request.DifficultyLevel;
        concept.ImageUrl = request.ImageUrl;
        await _wordConceptRepository.UpdateConceptAsync(concept, request.UserId, cancellationToken);

        foreach (var translation in request.Translations)
        {
            var language = await _languageRepository.GetByCodeAsync(translation.LanguageCode, cancellationToken)
                ?? throw new EntityNotFoundException($"Language not found: Code={translation.LanguageCode}");

            var existingWord = await _wordConceptRepository.FindWordAsync(concept.Id, language.Id, cancellationToken);

            if (!request.Force)
            {
                var duplicate = await _wordConceptRepository.FindWordByLanguageAndTextAsync(
                    language.Id, translation.Text, excludeWordId: existingWord?.Id, cancellationToken);
                if (duplicate is not null)
                    throw new WordDuplicateException(translation.LanguageCode, translation.Text);
            }

            var word = existingWord ?? new Word { WordConceptId = concept.Id, LanguageId = language.Id };
            word.Text = translation.Text;
            word.Definition = translation.Definition;

            if (existingWord is null)
            {
                await _wordConceptRepository.AddWordAsync(word, request.UserId, cancellationToken);
                await _wordConceptRepository.SaveChangesAsync(cancellationToken); // word.Id gerekli (yeni dil ekleniyor)
            }
            else
            {
                await _wordConceptRepository.UpdateWordAsync(word, request.UserId, cancellationToken);
            }

            await UpsertDetailAsync(word.Id, translation.WordDetail, request.UserId, cancellationToken);

            if (translation.Examples is not null)
            {
                var newExamples = translation.Examples.Select(example => new WordExample
                {
                    WordId = word.Id,
                    SentenceText = example.SentenceText,
                    Level = example.Level,
                    ExampleType = Enum.Parse<ExampleType>(example.ExampleType ?? nameof(ExampleType.Normal))
                }).ToList();
                await _wordConceptRepository.ReplaceExamplesAsync(word.Id, newExamples, request.UserId, cancellationToken);
            }
        }

        await _wordConceptRepository.SaveChangesAsync(cancellationToken);

        var aggregate = await _wordConceptRepository.GetAggregateAsync(concept.Id, cancellationToken)
            ?? throw new EntityNotFoundException($"WordConcept not found after update: Id={concept.Id}");
        return WordMapping.ToResponse(aggregate);
    }

    private async Task UpsertDetailAsync(int wordId, WordDetailRequest? request, int? userId, CancellationToken cancellationToken)
    {
        if (request is null)
            return;

        var existingDetail = await _wordConceptRepository.GetDetailByWordIdAsync(wordId, cancellationToken);
        var detail = existingDetail ?? new WordDetail { WordId = wordId };
        detail.Pronunciation = request.Pronunciation;
        detail.Notes = request.Notes;
        detail.CommonMistakes = request.CommonMistakes;
        detail.GrammarData = request.GrammarData?.GetRawText();

        if (existingDetail is null)
            await _wordConceptRepository.AddDetailAsync(detail, userId, cancellationToken);
        else
            await _wordConceptRepository.UpdateDetailAsync(detail, userId, cancellationToken);
    }
}`,

        return Unit.Value;
    }
}`,

            PageSize = page.PageSize
        };
