using MimeKit;
using WordLearner.Application.Common.Exceptions;
using WordLearner.Application.Interfaces.Services;
using WordLearner.Domain.Entities.System;

namespace WordLearner.Application.Services;

public class MailKitSmtpTestService : ISmtpTestService
{
    public async Task SendTestEmailAsync(
        SmtpSettings settings,
        string decryptedPassword,
        string toEmail,
        CancellationToken ct = default
    )
    {
        var body = new TextPart("plain")
        {
            Text = "Bu bir test e-postasıdır. SMTP ayarlarınız doğru çalışıyor.",
        };

        try
        {
            await MailKitSender.SendAsync(
                settings,
                decryptedPassword,
                toEmail,
                "VokabelMeister — SMTP Test",
                body,
                ct
            );
        }
        catch (Exception ex) when (ex is not OperationCanceledException)
        {
            // MailKit farklı aşamalarda (DNS/bağlantı, kimlik doğrulama, gönderim) farklı exception
            // tipleri fırlatır — hepsi istemci için aynı anlama gelir, tek hata sözleşmesine sarılır.
            throw new SmtpTestFailedException(ex.Message);
        }
    }
}`,

// Body'de bir SmtpSettings şekli yok (yalnızca ToEmail) — test, admin'in o an DB'de kayıtlı
// ayarlarını doğrular, henüz PUT edilmemiş form değerlerini değil.
public record TestSmtpSettingsCommand : IRequest<MessageResponse>
{
    public string ToEmail { get; init; } = string.Empty;
    public string? Language { get; init; }
}

public class TestSmtpSettingsCommandHandler : IRequestHandler<TestSmtpSettingsCommand, MessageResponse>
{
    private readonly ISmtpSettingsRepository _smtpSettingsRepository;
    private readonly IEncryptionService _encryptionService;
    private readonly ISmtpTestService _smtpTestService;

    public TestSmtpSettingsCommandHandler(
        ISmtpSettingsRepository smtpSettingsRepository,
        IEncryptionService encryptionService,
        ISmtpTestService smtpTestService
    )
    {
        _smtpSettingsRepository = smtpSettingsRepository;
        _encryptionService = encryptionService;
        _smtpTestService = smtpTestService;
    }

    public async Task<MessageResponse> Handle(TestSmtpSettingsCommand request, CancellationToken ct)
    {
        var settings =
            await _smtpSettingsRepository.GetCurrentAsync(ct)
            ?? throw new SmtpSettingsNotConfiguredException();

        var decryptedPassword = _encryptionService.Decrypt(settings.PasswordEncrypted);

        await _smtpTestService.SendTestEmailAsync(settings, decryptedPassword, request.ToEmail, ct);

        return new MessageResponse("SMTP_TEST_EMAIL_SENT", SuccessMessages.Resolve("SMTP_TEST_EMAIL_SENT", request.Language));
    }
}`,

[Route("api/v1/admin/smtp-settings")]

    private readonly IMediator _mediator;

    private string? CurrentRole => User.FindFirstValue(ClaimTypes.Role);
    private string? ClientIp => HttpContext.Connection.RemoteIpAddress?.ToString();
    private string CurrentUserEmail => User.FindFirstValue(ClaimTypes.Email)!;
    private string? Language => RequestLanguageResolver.Resolve(HttpContext);

    [HttpGet]
    [ProducesResponseType(typeof(SmtpSettingsDto), StatusCodes.Status200OK)]
    public async Task<ActionResult<SmtpSettingsDto>> GetSmtpSettings(CancellationToken ct) =>
        Ok(await _mediator.Send(new GetSmtpSettingsQuery(), ct));

    [HttpPut]
    [ProducesResponseType(StatusCodes.Status204NoContent)]
    [ProducesResponseType(typeof(ApiErrorResponse), StatusCodes.Status400BadRequest)]
    public async Task<IActionResult> UpdateSmtpSettings(UpdateSmtpSettingsCommand command, CancellationToken ct)
    {
        await _mediator.Send(
            command with
            {
                UserId = CurrentUserId,
                ActorRole = CurrentRole,
                IpAddress = ClientIp,
            },
            ct
        );
        return NoContent();
    }

    [HttpPost("test")]
    [ProducesResponseType(typeof(MessageResponse), StatusCodes.Status200OK)]
    [ProducesResponseType(typeof(ApiErrorResponse), StatusCodes.Status400BadRequest)]
    [ProducesResponseType(typeof(ApiErrorResponse), StatusCodes.Status502BadGateway)]
    public async Task<ActionResult<MessageResponse>> TestSmtpSettings(CancellationToken ct) =>
        Ok(
            await _mediator.Send(
                new TestSmtpSettingsCommand { ToEmail = CurrentUserEmail, Language = Language },
                ct
            )
        );
