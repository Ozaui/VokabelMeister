using WordLearner.Domain.Entities.System;

namespace WordLearner.Application.Interfaces.Services;

public interface ISmtpTestService
{
    // AMAÇ: Verilen ayarlarla (şifre ÇÖZÜLMÜŞ hâliyle) SMTP sunucusuna bağlanıp
    //       \`toEmail\`e kısa bir test mesajı gönderir.
    // NEDEN decryptedPassword AYRI parametre (settings.PasswordEncrypted DEĞİL):
    //       bu servis şifre çözme mantığını (IEncryptionService) BİLMEMELİ — çağıran
    //       Handler zaten SmtpSettingsRepository'den okuyup IEncryptionService.Decrypt
    //       ile çözdüğü düz metni buraya taşır (tek sorumluluk).
    // NASIL: Başarısız olursa (bağlantı/kimlik doğrulama/gönderim hatası)
    //        SmtpTestFailedException fırlatır — projenin TEK hata sözleşmesi
    //        (ApiErrorResponse) dışına çıkılmaz.
    Task SendTestEmailAsync(
        SmtpSettings settings,
        string decryptedPassword,
        string toEmail,
        CancellationToken ct = default
    );
}

// ─────────────────────────────────────────────────────────────────────────────
// MailKitSmtpTestService.cs
//
// AMAÇ: ISmtpTestService'in MailKit tabanlı implementasyonu — verilen SMTP
//       ayarlarıyla gerçekten bağlanıp bir test e-postası gönderir.
// NEDEN try/catch içinde tek bir SmtpTestFailedException'a sarılır: MailKit farklı
//       aşamalarda (DNS/bağlantı, kimlik doğrulama, gönderim) FARKLI exception tipleri
//       fırlatabilir (SocketException, AuthenticationException, SmtpCommandException…)
//       — hepsi istemci için AYNI anlama gelir ("test başarısız"), projenin TEK hata
//       sözleşmesi (ApiErrorResponse) bu çeşitliliği istemciye YANSITMAMALI.
// BAĞIMLILIKLAR: MailKit.Net.Smtp, MimeKit.
// ─────────────────────────────────────────────────────────────────────────────

using MailKit.Net.Smtp;
using MailKit.Security;
using MimeKit;
using WordLearner.Application.Common.Exceptions;
using WordLearner.Application.Interfaces.Services;
using WordLearner.Domain.Entities.System;

namespace WordLearner.Application.Services;

public class MailKitSmtpTestService : ISmtpTestService
{
    public async Task SendTestEmailAsync(
        SmtpSettings settings,
        string decryptedPassword,
        string toEmail,
        CancellationToken ct = default
    )
    {
        var message = new MimeMessage();
        message.From.Add(new MailboxAddress(settings.FromName, settings.FromEmail));
        message.To.Add(MailboxAddress.Parse(toEmail));
        message.Subject = "VokabelMeister — SMTP Test";
        message.Body = new TextPart("plain")
        {
            Text = "Bu bir test e-postasıdır. SMTP ayarlarınız doğru çalışıyor.",
        };

        try
        {
            using var client = new SmtpClient();
            // NEDEN EnableSsl→StartTls/None: entity yalnızca tek bir bool taşıyor
            //       (DATABASE_SCHEMA/Sistem.md) — MailKit'in Auto seçeneği yerine
            //       açık bir eşleme, hangi modun kullanıldığını kod okuyanına
            //       (ve BAĞLANTI hatası aldığında admin'e) belirsizlik bırakmaz.
            var secureOption = settings.EnableSsl ? SecureSocketOptions.StartTls : SecureSocketOptions.None;
            await client.ConnectAsync(settings.Host, settings.Port, secureOption, ct);
            await client.AuthenticateAsync(settings.Username, decryptedPassword, ct);
            await client.SendAsync(message, ct);
            await client.DisconnectAsync(true, ct);
        }
        catch (Exception ex) when (ex is not OperationCanceledException)
        {
            throw new SmtpTestFailedException(ex.Message);
        }
    }
}`,

            satir: 'var secureOption = settings.EnableSsl ? SecureSocketOptions.StartTls : SecureSocketOptions.None;',
            aciklama: 'MailKit\'in `SecureSocketOptions.Auto` (sunucuyla otomatik pazarlık) seçeneği yerine, entity\'nin tek bir bool\'una (EnableSsl) açık bir eşleme.',
            neden: 'DATABASE_SCHEMA/Sistem.md şeması yalnızca `EnableSsl BIT` taşıyor — bir enum (None/StartTls/SslOnConnect) DEĞİL. Açık eşleme, bir bağlantı hatası aldığında admin\'e/geliştiriciye "hangi modun kullanıldığı" konusunda BELİRSİZLİK bırakmaz.',

using MediatR;
using WordLearner.Application.Common.Exceptions;
using WordLearner.Application.Common.Localization;
using WordLearner.Application.DTOs.Auth;
using WordLearner.Application.Interfaces.Repositories;

namespace WordLearner.Application.Features.Smtp;

public record TestSmtpSettingsCommand : IRequest<MessageResponse>
{
    public string ToEmail { get; init; } = string.Empty;
    public string? Language { get; init; }
}

public class TestSmtpSettingsCommandHandler : IRequestHandler<TestSmtpSettingsCommand, MessageResponse>
{
    private readonly ISmtpSettingsRepository _smtpSettingsRepository;
    private readonly IEncryptionService _encryptionService;
    private readonly ISmtpTestService _smtpTestService;

    public TestSmtpSettingsCommandHandler(
        ISmtpSettingsRepository smtpSettingsRepository,
        IEncryptionService encryptionService,
        ISmtpTestService smtpTestService
    )
    {
        _smtpSettingsRepository = smtpSettingsRepository;
        _encryptionService = encryptionService;
        _smtpTestService = smtpTestService;
    }

    public async Task<MessageResponse> Handle(TestSmtpSettingsCommand request, CancellationToken ct)
    {
        var settings =
            await _smtpSettingsRepository.GetCurrentAsync(ct)
            ?? throw new SmtpSettingsNotConfiguredException();

        var decryptedPassword = _encryptionService.Decrypt(settings.PasswordEncrypted);

        await _smtpTestService.SendTestEmailAsync(settings, decryptedPassword, request.ToEmail, ct);

        return new MessageResponse("SMTP_TEST_EMAIL_SENT", SuccessMessages.Resolve("SMTP_TEST_EMAIL_SENT", request.Language));
    }
}`,
        satirlar: [
          {
            satir: 'public record TestSmtpSettingsCommand : IRequest<MessageResponse>',
            aciklama: '`MessageResponse` — AuthController\'ın "token dönmeyen" endpoint\'lerinde kullandığı AYNI zarf (`DTOs/Auth/` altında, ama Auth\'a ÖZEL değil, projede paylaşılan bir sözleşme).',
            neden: 'Bu endpoint de (login/forgot-password gibi) veri döndürmez, yalnızca "işlem tetiklendi" bilgisini insan-okunur bir mesajla iletir — yeni bir "SmtpTestResponse" zarfı yazmak GEREKSİZ olurdu (aynı şekle sahip bir DTO\'nun ikinci bir kopyası).',
            olmasaydi: 'Ayrı bir `SmtpTestResponse(string Message)` yazılsaydı, `SuccessMessages.Resolve` desenini (Code→dile göre çöz) YENİDEN icat etmek ya da MessageResponse\'un yaptığı işi BİREBİR kopyalamak gerekirdi — CLAUDE.md "spekülatif ortak tip yazılmaz" kuralının TERSİ bir gereksiz çoğaltma.'

            neden: 'Test edilecek bir ayar yoksa (`existing is null`) MailKit\'e bağlanmaya ÇALIŞMAK anlamsız — bu satır, ISmtpTestService\'e ULAŞMADAN erken ve net bir hata verir.',
            olmasaydi: 'Bu kontrol OLMASAYDI, `settings.PasswordEncrypted` bir `NullReferenceException` fırlatırdı (500, INTERNAL_SERVER_ERROR) — admin "SMTP ayarlarını önce kaydetmem gerektiğini" ANLAYAMAZDI, yalnızca belirsiz bir sunucu hatası görürdü.'

        kod: `// ─────────────────────────────────────────────────────────────────────────────

using System.Security.Claims;

using Microsoft.AspNetCore.Mvc;

    private string? CurrentRole => User.FindFirstValue(ClaimTypes.Role);
    private string? ClientIp => HttpContext.Connection.RemoteIpAddress?.ToString();

    // AMAÇ: Kayıtlı SMTP ayarlarını döner — şifre alanı "***" ile maskelenir.
    [HttpGet]
    [ProducesResponseType(typeof(SmtpSettingsDto), StatusCodes.Status200OK)]
    public async Task<ActionResult<SmtpSettingsDto>> GetSmtpSettings(CancellationToken ct) =>
        Ok(await _mediator.Send(new GetSmtpSettingsQuery(), ct));

    // AMAÇ: SMTP ayarlarını kaydeder (ilk kayıtta oluşturur, sonrasında günceller).
    [HttpPut]
    [ProducesResponseType(StatusCodes.Status204NoContent)]

    public async Task<IActionResult> UpdateSmtpSettings(UpdateSmtpSettingsCommand command, CancellationToken ct)

                ActorRole = CurrentRole,
                IpAddress = ClientIp,

    [ProducesResponseType(typeof(ApiErrorResponse), StatusCodes.Status502BadGateway)]
    public async Task<ActionResult<MessageResponse>> TestSmtpSettings(CancellationToken ct) =>
        Ok(
            await _mediator.Send(
                new TestSmtpSettingsCommand { ToEmail = CurrentUserEmail, Language = Language },
                ct
            )
        );
}`,
