<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VokabelMeister — Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Nunito:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // FOUC önlemi: React/Redux yüklenmeden ÖNCE, ilk boyamadan hemen önce çalışır — böylece
      // koyu temayı tercih eden bir admin, sayfanın bir an açık renkle çizilip sonra koyuya
      // "atladığını" GÖRMEZ. useThemeSync.ts bu class'ı SONRAKİ değişiklikler için senkron tutar.
      (function () {
        var stored = localStorage.getItem('theme');
        var theme = stored === 'Light' || stored === 'Dark' || stored === 'System' ? stored : 'System';
        var isDark = theme === 'Dark' || (theme === 'System' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
